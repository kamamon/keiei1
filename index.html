<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球団社長 プロ野球経営シミュレーション</title>
<meta name="description" content="予算・街づくり・ドラフト・FA・育成・球場経営まで、プロ野球球団のすべてを動かす経営シミュレーションゲーム">
<meta name="theme-color" content="#133F31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23133F31'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fff'/%3E%3Cpath d='M20 22c5 6 5 14 0 20M44 22c-5 6-5 14 0 20' stroke='%23E5383B' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* ===== 球団社長 — スコアボードをモチーフにした画面 ===== */
:root {
  --bg: #0B241D; --bg2: #0E2C24; --panel: #11342A; --panel2: #0F2E25; --hover: rgba(255, 255, 255, .045);
  --line: rgba(228, 236, 224, .11); --line2: rgba(228, 236, 224, .22);
  --ink: #E8EEE3; --ink2: #A9BBAF; --ink3: #7C9084;
  --lamp: #FFB547; --lamp-ink: #2A1A00; --ball: #4FD48B; --strike: #F2CF48; --out: #FF6655;
  --board: #133F31; --board2: #0A271E; --board-ink: #EEF3EA;
  --team: #E5383B; --team2: #F6C744; --team-ink: #fff; --team-soft: rgba(229, 56, 59, .16);
  --f-disp: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-body: "BIZ UDPGothic", system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-num: "BIZ UDGothic", "BIZ UDPGothic", ui-monospace, "Hiragino Sans", "Meiryo", monospace;
  --r: 4px; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
:root[data-theme="day"] {
  --bg: #E5EBE3; --bg2: #DAE2D8; --panel: #F8FAF6; --panel2: #EEF2EB; --hover: rgba(0, 40, 20, .04);
  --line: rgba(18, 40, 30, .12); --line2: rgba(18, 40, 30, .24);
  --ink: #13221B; --ink2: #44584D; --ink3: #6A7D72;
  --lamp: #B86E00; --lamp-ink: #fff; --ball: #1B8A4B; --strike: #8F7000; --out: #C83A29;
  --board: #174636; --board2: #0F3328;
  --shadow: 0 10px 30px rgba(10, 40, 25, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== スコアボード（ヘッダー） ===== */
.sb { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 18px;
  padding: 8px 16px; background: linear-gradient(var(--board), var(--board2)); color: var(--board-ink); border-bottom: 3px solid var(--team); min-height: 64px; }
.sb-menu { display: none; background: none; border: 1px solid rgba(255, 255, 255, .2); color: inherit; border-radius: var(--r); width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
.sb-team { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
.sb-name { font-family: var(--f-disp); font-size: 19px; line-height: 1.15; white-space: nowrap; letter-spacing: .02em; }
.sb-sub { font-size: 12px; opacity: .78; white-space: nowrap; }
.sb-date { display: flex; align-items: baseline; gap: 4px; }
.lit { display: inline-block; min-width: 1.6em; padding: 2px 6px; background: #071d16; border: 1px solid rgba(255, 255, 255, .08); border-radius: 3px; text-align: center;
  font-family: var(--f-disp); font-size: 20px; color: #FFB547; line-height: 1.2; text-shadow: 0 0 10px rgba(255, 181, 71, .45); }
.lit.flip { animation: flip .45s ease; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); opacity: .4; } 100% { transform: rotateX(0); } }
.sl { font-size: 12px; opacity: .75; margin-right: 4px; }
.sb-phase { font-size: 12px; opacity: .85; margin-left: 8px; white-space: nowrap; }
.sb-mini { display: none; margin-left: auto; font-size: 12px; white-space: nowrap; opacity: .9; font-family: var(--f-num); }
.sb-mini b { font-weight: 400; color: #FFB547; }
.sb-read { display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap; min-width: 0; }
.rd { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.rk { font-size: 11px; opacity: .7; }
.rv { font-family: var(--f-num); font-size: 15px; white-space: nowrap; }
.rv.neg { color: #FF8A7A; }
.sb-go { display: flex; }
.go { background: var(--lamp); color: var(--lamp-ink); border: 0; border-radius: var(--r) 0 0 var(--r); padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
:root[data-theme="day"] .go { background: #FFB547; color: #2A1A00; }
.go:hover { filter: brightness(1.08); }
.go2 { background: #d9932f; color: #2A1A00; border: 0; border-left: 1px solid rgba(0, 0, 0, .2); border-radius: 0 var(--r) var(--r) 0; padding: 0 10px; cursor: pointer; }
.go:disabled, .go2:disabled { opacity: .5; cursor: wait; }

/* ===== 全体レイアウト ===== */
.wrap { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.nav { position: sticky; top: 67px; align-self: start; height: calc(100vh - 67px); z-index: 5; overflow-y: auto; padding: 12px 10px 40px; border-right: 1px solid var(--line); background: var(--bg2); }
.nav-g { font-size: 11px; color: var(--ink3); margin: 14px 8px 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: var(--r); text-decoration: none; color: var(--ink2); cursor: pointer; font-size: 13.5px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { background: var(--team-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--team); }
.nav .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--out); color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
.main { padding: 20px 24px 80px; min-width: 0; }
.h1 { font-family: var(--f-disp); font-size: 26px; line-height: 1.25; margin: 0 0 4px; letter-spacing: .01em; }
.lead { color: var(--ink2); margin: 0 0 18px; max-width: 70ch; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-home { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--ball); } .neg { color: var(--out); } .warn { color: var(--strike); }
.nowrap { white-space: nowrap; }
.right { text-align: right; } .center { text-align: center; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ===== パネル ===== */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; margin: 0; font-weight: 700; }
.panel-b { padding: 12px 14px; }
.panel-b.flush { padding: 0; }
.panel.hl { border-color: var(--team); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--ink2); font-size: 13px; } .kv dd { margin: 0; text-align: right; font-family: var(--f-num); }
.stat-big { font-family: var(--f-disp); font-size: 28px; line-height: 1.1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.tile { background: var(--panel); padding: 10px 14px; }
.tile .k { font-size: 12px; color: var(--ink2); } .tile .v { font-family: var(--f-num); font-size: 18px; white-space: nowrap; } .tile .s { font-size: 11px; color: var(--ink3); }
.tile .v.txt { font-family: var(--f-body); font-size: 15px; font-weight: 700; white-space: normal; line-height: 1.35; padding-top: 2px; }

/* ===== ボタン・入力 ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--line2); background: transparent; color: var(--ink);
  border-radius: var(--r); cursor: pointer; font-size: 13.5px; white-space: nowrap; line-height: 1.3; text-decoration: none; }
.btn:hover { background: var(--hover); border-color: var(--ink3); }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.team { background: var(--team); border-color: var(--team); color: var(--team-ink); font-weight: 700; }
.btn.danger { border-color: rgba(255, 102, 85, .6); color: var(--out); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.xs { padding: 2px 7px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { background: var(--team-soft); border-color: var(--team); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--team); color: var(--team-ink); }
.inp, select.inp { background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 9px; color: var(--ink); min-width: 0; }
.inp.num { text-align: right; }
input[type=range] { accent-color: var(--lamp); width: 100%; }
input[type=checkbox] { accent-color: var(--lamp); width: 16px; height: 16px; vertical-align: middle; }
label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.field { display: grid; gap: 4px; } .field > span { font-size: 12px; color: var(--ink2); }

/* ===== タブ ===== */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; padding: 9px 14px; color: var(--ink2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--team); font-weight: 700; }
.tabs .cnt { font-size: 11px; color: var(--ink3); margin-left: 4px; }

/* ===== 表 ===== */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--ink); }
table.t th.sorted { color: var(--lamp); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.t tr:hover td { background: var(--hover); }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.t tr.me td { background: var(--team-soft); }
table.t tr.me td:first-child { box-shadow: inset 3px 0 0 var(--team); }
table.t tr.dim td { opacity: .5; }
table.t.compact td { padding: 4px 6px; } table.t.compact th { padding: 5px 6px; }
.pl { cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--ink3); }
.pl:hover { color: var(--lamp); border-bottom-color: var(--lamp); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink2); }

/* ===== 評価記号・バー ===== */
.gr { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px; border-radius: 3px; font-family: var(--f-disp); font-size: 12px; line-height: 1; color: #1a1a1a; }
.gr.S { background: #FFD54A; } .gr.A { background: #FF6B57; color: #fff; } .gr.B { background: #FF9F43; } .gr.C { background: #F2D24E; }
.gr.D { background: #9BD35A; } .gr.E { background: #4CC38A; } .gr.F { background: #5BA4D9; color: #fff; } .gr.G { background: #8A97A0; color: #fff; } .gr.Q { background: transparent; border: 1px dashed var(--ink3); color: var(--ink3); }
.av { display: inline-flex; align-items: center; gap: 4px; }
.av .n { font-family: var(--f-num); min-width: 2.1em; text-align: right; }
.bar { position: relative; height: 8px; background: rgba(128, 128, 128, .2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lamp); border-radius: 4px; }
.bar > b { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--ink); opacity: .55; }
.bar.team > i { background: var(--team); }
.bar.ball > i { background: var(--ball); } .bar.strike > i { background: var(--strike); } .bar.out > i { background: var(--out); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); vertical-align: middle; }
.dot.b { background: var(--ball); box-shadow: 0 0 6px var(--ball); } .dot.s { background: var(--strike); box-shadow: 0 0 6px var(--strike); } .dot.o { background: var(--out); box-shadow: 0 0 6px var(--out); }
.form { font-weight: 700; } .form.f2 { color: #FF6B57; } .form.f1 { color: #FF9F43; } .form.f0 { color: var(--ink2); } .form.fm1 { color: #5BA4D9; } .form.fm2 { color: #8a7cff; }
.tag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.tag.team { background: var(--team); color: var(--team-ink); border-color: var(--team); }
.tag.b { border-color: var(--ball); color: var(--ball); } .tag.s { border-color: var(--strike); color: var(--strike); } .tag.o { border-color: var(--out); color: var(--out); }
.tag.lamp { border-color: var(--lamp); color: var(--lamp); }

/* ===== ラインスコア（試合結果） ===== */
.ls { background: var(--board2); color: var(--board-ink); border-radius: var(--r); padding: 10px 12px; overflow-x: auto; }
.ls table { border-collapse: collapse; font-family: var(--f-disp); }
.ls th { font-family: var(--f-body); font-weight: 400; font-size: 11px; opacity: .7; padding: 2px 6px; text-align: center; }
.ls td { padding: 3px 7px; text-align: center; font-size: 17px; color: #FFB547; min-width: 26px; }
.ls td.tn { text-align: left; color: var(--board-ink); font-size: 14px; white-space: nowrap; padding-right: 14px; }
.ls td.tot { color: #fff; font-size: 20px; border-left: 1px solid rgba(255, 255, 255, .15); }
.ls td.he { color: rgba(255, 255, 255, .7); font-size: 14px; }
.mini-ls { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mini-ls:hover { background: var(--hover); }
.wl { font-family: var(--f-disp); font-size: 14px; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.wl.w { background: var(--team); color: var(--team-ink); } .wl.l { border: 1px solid var(--line2); color: var(--ink2); } .wl.d { border: 1px dashed var(--line2); color: var(--ink2); }
.score { font-family: var(--f-disp); font-size: 18px; }

/* ===== エンブレム ===== */
.emb { flex: none; display: inline-block; vertical-align: middle; }

/* ===== モーダル・トースト ===== */
.mback { position: fixed; inset: 0; background: rgba(2, 12, 8, .62); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; width: 100%; max-width: 860px; box-shadow: var(--shadow); animation: pop .18s ease; }
.modal.wide { max-width: 1080px; } .modal.narrow { max-width: 560px; }
.modal.still { animation: none; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 17px; }
.modal-b { padding: 16px 18px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.x { background: none; border: 0; color: var(--ink2); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: var(--r); }
.x:hover { background: var(--hover); color: var(--ink); }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--board); color: var(--board-ink); border-left: 4px solid var(--lamp); padding: 10px 14px; border-radius: var(--r); box-shadow: var(--shadow); animation: pop .2s ease; font-size: 13.5px; }
.toast.bad { border-left-color: var(--out); } .toast.good { border-left-color: var(--ball); }
.busy { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: rgba(2, 12, 8, .55); }
.busy-box { background: var(--board); color: var(--board-ink); border-radius: 6px; padding: 18px 26px; text-align: center; min-width: 260px; box-shadow: var(--shadow); }
.busy-box .lit { font-size: 22px; margin: 6px 2px; }

/* ===== タイトル・球団選択 ===== */
.title { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; background:
  radial-gradient(1200px 600px at 50% 0%, rgba(255, 181, 71, .08), transparent 60%), var(--bg); }
.title-board { background: linear-gradient(var(--board), var(--board2)); border: 6px solid #0a1f18; outline: 1px solid rgba(255, 255, 255, .06); border-radius: 8px; padding: 34px 44px 28px; text-align: center; color: var(--board-ink); box-shadow: var(--shadow); max-width: 640px; width: 100%; }
.title-board h1 { font-family: var(--f-disp); font-size: clamp(44px, 9vw, 78px); margin: 0; letter-spacing: .08em; color: #FFB547; text-shadow: 0 0 22px rgba(255, 181, 71, .35); line-height: 1.1; }
.title-board p { margin: 10px 0 0; opacity: .85; }
.lamps { display: flex; justify-content: center; gap: 22px; margin: 20px 0 6px; font-size: 12px; opacity: .9; }
.lamps span { display: inline-flex; align-items: center; gap: 6px; }
.title-actions { display: grid; gap: 10px; margin-top: 26px; width: 100%; max-width: 340px; }
.title-actions .btn { padding: 12px 16px; font-size: 15px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; cursor: pointer; display: grid; gap: 8px; border-top: 4px solid var(--c); color: var(--ink); }
.tcard:hover { border-color: var(--c); background: var(--panel2); }
.tcard.on { outline: 2px solid var(--lamp); }
.tcard .nm { font-family: var(--f-disp); font-size: 17px; line-height: 1.2; }
.stars { color: var(--lamp); letter-spacing: 1px; }
.tcard.custom { border: 1px dashed var(--lamp); border-top: 4px dashed var(--lamp); align-content: center; background: transparent; }
.tcard.custom:hover { background: var(--panel); }
.tcard.custom .nm { color: var(--lamp); }

/* ===== カスタムスタート ===== */
.cs { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; --team: var(--lamp); --team-ink: var(--lamp-ink); }
.cs-side { position: sticky; top: 16px; display: grid; gap: 12px; }
.cs-plate { position: relative; overflow: hidden; background: linear-gradient(var(--board), var(--board2)); color: var(--board-ink); border-radius: 8px; border-top: 8px solid var(--c); padding: 20px 16px 22px; text-align: center; box-shadow: var(--shadow); }

function isP(p) { return p.pos === 'P'; }
function velScore(v) { return clamp((v - 122) * 2.5, 0, 100); }
function batOvr(a, pos) {
  const off = a.con * .40 + a.pow * .36 + a.eye * .12 + a.spd * .12;
  const def = a.fld * .65 + a.arm * .35;
  const w = POS_DEFW[pos] === undefined ? .2 : POS_DEFW[pos];
  return off * (1 - w) + def * w;

function pitOvr(a, t) {
  const vs = velScore(a.vel);
  return t === 'RP' ? vs * .32 + a.ctl * .26 + a.brk * .38 + a.sta * .04 : vs * .25 + a.ctl * .25 + a.brk * .32 + a.sta * .18;

/* ---------- 自動オーダー ---------- */
function autoLineup(tid, excludeIds) {

/* ---------- 投手陣の役割 ---------- */

/* ---------- 1軍の自動編成 ---------- */

/* 故障者の入れ替え（同じ投手/野手で補充） */
function swapInjured(tid) {

  for (const p of first) {
    if (p.injW <= 0) continue;
    p.lv = 2; changed = true;
    const frn = firstFrnCount(tid);
    const cands = rosterLv(tid, 2).filter(x => x.injW === 0 && isP(x) === isP(p) && (!x.frn || frn < LIM.frn1));
    let rep;

    else {

      let t;

function finishGame(S) {

  for (const sd of S.sides) { if (sd.ps.exitLead === null) sd.ps.exitLead = leadOf(sd); }

    W = S.wc[win]; L = S.lc[1 - win];
    if (W && W.isSP && W.outs < 15) { const rel = ws.used.filter(x => !x.isSP); if (rel.length) W = maxBy(rel, x => x.outs - x.er * 4 + (x === rel[0] ? 0.5 : 0)); }

  }

    const opp = S.score[1 - sd.idx];
    for (const ps of sd.used) {

      }

        if (ps.isSP && sd.used.length === 1 && !tie) { st.cg++; if (opp === 0) st.sho++; }

    }

    h: H.tid, a: A.tid, hs: sh, as: sa, tie, inn: S.inn, line: S.line, W: W ? W.p.id : null, L: L ? L.p.id : null, SV: SV ? SV.p.id : null,
    hits: [A.h, H.h], errs: [A.e, H.e], hrs: S.hrs, walkoff: S.walkoff, sp: [A.sp.id, H.sp.id],
    bp: A.lu.map(x => x.p.id).concat(H.lu.map(x => x.p.id)), pp

      bat: sd.box.bat,

/* =========================================================
   シーズン：日程・試合消化・順位・プレーオフ・成績・表彰
   公式戦は3月第4週〜9月第3週（24週・143試合）、9月第4週は予備日

const SEASON_START = 11, SEASON_END = 34, MAKEUP_TURN = 35;
const DOW = ['火', '水', '木', '金', '土', '日'];

function genSchedule() {
  const L = [[], []]; for (const t of G.teams) L[t.league].push(t.id);
  const circle = ids => { const arr = ids.slice(); const rounds = []; for (let r = 0; r < 5; r++) { const pairs = []; for (let i = 0; i < 3; i++) pairs.push([arr[i], arr[5 - i]]); rounds.push(pairs); arr.splice(1, 0, arr.pop()); } return rounds; };
  const R = [circle(shuffle(L[0].slice())), circle(shuffle(L[1].slice()))];
  const lens = [3, 3, 3, 2, 3, 3, 3, 2, 3];
  const hostX = [true, false, true, true, false, false, true, true, false];
  const extraOf = (lg, a, b) => {
    let i = L[lg].indexOf(a), j = L[lg].indexOf(b);
    const lo = Math.min(i, j), hi = Math.max(i, j); const d = hi - lo;
    const toLo = d === 1 || d === 2 || (d === 3 && lo < 3);
    return L[lg][toLo ? lo : hi];
  };
  const intra = [];
  for (let k = 0; k < 9; k++) for (let r = 0; r < 5; r++) {
    for (let g = 0; g < lens[k]; g++) {
      const day = [];
      for (let lg = 0; lg < 2; lg++) for (const [x, y] of R[lg][r]) {
        const ex = extraOf(lg, x, y); const o = ex === x ? y : x;
        const home = hostX[k] ? ex : o;
        day.push({ h: home, a: home === x ? y : x });
      }
      intra.push(day);
    }
  }
  const inter = [];
  for (let k = 0; k < 6; k++) for (let g = 0; g < 3; g++) {
    const day = [];
    for (let i = 0; i < 6; i++) { const a = L[0][i], b = L[1][(i + k) % 6]; const home = ((k + G.year) % 2 === 0) ? a : b; day.push({ h: home, a: home === a ? b : a }); }
    inter.push(day);
  }
  const days = intra.slice(0, 48).concat(inter, intra.slice(48));
  G.sched = { days: days.map(d => d.map(g => ({ h: g.h, a: g.a, done: false }))), makeup: [], mkDays: [] };
  G.day = 0;
}
function dayTurn(d) { return SEASON_START + Math.floor(d / 6); }
function dayLabel(d) { const t = dayTurn(d); const m = Math.floor(t / 4) + 1, w = t % 4 + 1; return m + '月第' + w + '週(' + DOW[d % 6] + ')'; }
function userSchedule() {
  const uid = G.user.tid; const out = [];
  G.sched.days.forEach((day, d) => { for (const g of day) if (g.h === uid || g.a === uid) out.push({ d, g }); });
  (G.sched.mkDays || []).forEach((day, i) => { for (const g of day) if (g.h === uid || g.a === uid) out.push({ d: 'mk' + i, g, mk: true }); });
  return out;
}

function blankRec() { return { w: 0, l: 0, d: 0, rs: 0, ra: 0, hw: 0, hl: 0, strk: 0, l10: [], vs: {}, il: [0, 0, 0] }; }
function pctOf(R) { const d = R.w + R.l; return d ? R.w / d : 0; }
function gamesPlayed(tid) { const r = G.teams[tid].rec; return r.w + r.l + r.d; }
function standings(lg) {
  const ts = G.teams.filter(t => t.league === lg).sort((a, b) => pctOf(b.rec) - pctOf(a.rec) || b.rec.w - a.rec.w || (b.rec.rs - b.rec.ra) - (a.rec.rs - a.rec.ra));
  const top = ts[0].rec;
  return ts.map((t, i) => ({ t, rank: i + 1, gb: ((top.w - t.rec.w) + (t.rec.l - top.l)) / 2 }));
}
function teamRank(tid) { const t = G.teams[tid]; return standings(t.league).find(x => x.t.id === tid).rank; }
function gamesBehind(tid) { const t = G.teams[tid]; return standings(t.league).find(x => x.t.id === tid).gb; }
function applyRecord(hid, aid, res) {
  const H = G.teams[hid].rec, A = G.teams[aid].rec;
  H.rs += res.hs; H.ra += res.as; A.rs += res.as; A.ra += res.hs;
  const inter = G.teams[hid].league !== G.teams[aid].league;

function rainProb(m) { return ({ 3: 0.03, 4: 0.04, 5: 0.04, 6: 0.09, 7: 0.05, 8: 0.05, 9: 0.05 })[m] || 0.03; }

function playSeasonGame(g, dayIdx, isMakeup) {

}
function scheduleMakeups() {

  const days = [];
  while (pend.length) {
    const busy = new Set(); const day = [];
    for (let i = 0; i < pend.length; i++) { const g = pend[i]; if (busy.has(g.h) || busy.has(g.a)) continue; busy.add(g.h); busy.add(g.a); day.push({ h: g.h, a: g.a, done: false, mk: true }); pend.splice(i, 1); i--; }

/* ---------- ボックススコアの保存（ユーザー試合のみ・最近40試合） ---------- */
function storeBox(id, res, g, dayIdx, post) {

}

/* ---------- プレーオフ ---------- */
function mkSeries(kind, lg, hi, lo) {
  const cfg = { cs1: { need: 2, max: 3, adv: 0 }, cs2: { need: 4, max: 6, adv: 1 }, gs: { need: 4, max: 8, adv: 0 } }[kind];
  return { kind, lg, hi, lo, w: [cfg.adv, 0], d: 0, need: cfg.need, max: cfg.max, games: [], winner: null };
}
function startPost() {
  const st = [standings(0), standings(1)];
  G.post = { stage: 'cs1', series: [], lgChamp: [st[0][0].t.id, st[1][0].t.id], champ: null, mvp: null };
  for (let lg = 0; lg < 2; lg++) G.post.series.push(mkSeries('cs1', lg, st[lg][1].t.id, st[lg][2].t.id));
}
function playSeries(kind) {
  for (const s of G.post.series.filter(x => x.kind === kind && x.winner == null)) {
    let guard = 0;
    while (s.winner == null && guard++ < 12) {
      const gi = s.games.length;
      let h = s.hi, a = s.lo;
      if (kind === 'gs') { const homeHi = [0, 1, 5, 6, 7].includes(gi); h = homeHi ? s.hi : s.lo; a = homeHi ? s.lo : s.hi; }
      G.dayNo++; touch();

      const gid = G.gid++;
      const gm = { h, a, hs: res.hs, as: res.as, id: gid, tie: res.tie };
      gm.att = homeGameEconomy(h, a, 4, kind);

/* ---------- 成績計算 ---------- */

function woDen(s) { return s.ab + s.bb + s.sf + s.hbp; }

  let num = 0, den = 0, r = 0, outs = 0, er = 0;
  for (const t of G.teams) for (const p of roster(t.id)) {
    if (isP(p)) { r += p.st.r; outs += p.st.outs; er += p.st.er; } else { num += woNum(p.st); den += woDen(p.st); }
  }

  G._lbStamp = G.dayNo;

}
function batWAR(p, s, lb) {

  const wraa = (woba - lb.woba) / 1.2 * s.pa;

  const posAdj = { C: 12, SS: 7, '2B': 3, '3B': 2, CF: 2.5, LF: -7, RF: -7, '1B': -12, DH: -17 }[pos] || 0;
  const gf = s.g / 143;

}

function qualified(p, kind) {
  if (p.team < 0) return false;
  const g = Math.max(1, gamesPlayed(p.team));
  return kind === 'bat' ? p.st.pa >= g * 3.1 : p.st.outs >= g * 3;
}

function tName(tid) { const t = G.teams[tid]; return t ? t.city + t.nick : '―'; }

function book(kind, cat, man) {
  if (!man || !isFinite(man)) return;
  const F = G.fin;
  F.y[kind][cat] = (F.y[kind][cat] || 0) + man;
  F.m[kind] += man;
  F.cash += kind === 'rev' ? man : -man;
}
function yearTotal(kind) { return sum(Object.values(G.fin.y[kind])); }

/* ---------- 観客動員 ---------- */
function basePerf(T) {
  const R = T.rec; const n = R.w + R.l;
  const wp = n >= 8 ? pctOf(R) : (T.lastPct || 0.5);
  let perf = 0.88 + (wp - 0.5) * 1.2;
  if (G.month >= 6 && G.month <= 9) { const gb = gamesBehind(T.id); if (gb <= 0) perf += 0.08; else if (gb <= 5) perf += 0.04; else if (gb >= 15) perf -= 0.05; }
  if (R.strk >= 5) perf += 0.03;
  return clamp(perf, 0.65, 1.25);
}
function demandOf(hid, aid, dayIdx) {
  const T = G.teams[hid], O = G.teams[aid];
  let D = 6000 + T.market * 2600 + T.pop * 300;
  D *= basePerf(T);
  D *= [0.80, 0.80, 0.84, 1.0, 1.20, 1.14][dayIdx % 6];
  const st = stadOf(hid);
  let mf = ({ 3: 0.95, 4: 0.92, 5: 1.0, 6: 0.95, 7: 1.08, 8: 1.10, 9: 1.0, 10: 1.1 })[G.month] || 1;
  if (st.dome) mf = Math.max(mf, 1.0);
  if (curTurn() === 16) mf *= 1.12;
  D *= mf;
  D *= 0.90 + O.pop / 100 * 0.22;
  return D;
}
function stadSatisfaction() {
  const f = G.stad.fac;
  let s = 42 + f.vision.lv * 3 + f.amenity.lv * 3.5 + f.food.lv * 2 + f.light.lv * 2 + f.turf.lv * 0.6 + f.shop.lv * 1 + f.vip.lv * 0.8 + (G.stad.dome ? 4 : 0);
  const cond = avg(Object.values(f), x => x.cond) / 100;
  s *= 0.82 + cond * 0.18;
  s -= Math.min(12, (G.stad.age || 0) * 0.25);
  s += G.town.stat.sat || 0;
  s += G.flags.satBonus || 0;
  if (G.stad.honey > 1) s += 8;
  return clamp(s, 15, 100);
}
function tixRefMul(T) { return 0.8 + T.market * 0.06; }
function tierCaps(cap) {
  const pre = 0.04 + G.stad.fac.vip.lv * 0.02;
  return { out: cap * 0.30, inn: cap * (0.70 - pre), pre: cap * pre };
}
function userTicketSale(D, cap, priceMul) {
  const T = uT(); const caps = tierCaps(cap); const rm = tixRefMul(T);
  let att = 0, rev = 0; const by = {};
  for (const k of ['out', 'inn', 'pre']) {
    const d = TIX[k]; const share = caps[k] / cap; const price = G.tix[k] * (priceMul || 1);
    const ref = d.ref * rm * (k === 'pre' ? 1 + G.stad.fac.vip.lv * 0.05 : 1) * (priceMul || 1);

function userAttMult() {

  m *= clamp(1 + (tw.acc - 20) * 0.003 + tw.vib * 0.0012, 0.9, 1.4);
  m *= 1 + adEffect('att');

function pickPromo() {

/* 本拠地1試合ぶんの観客と収入。post=プレーオフ種別 */
function homeGameEconomy(hid, aid, dayIdx, post) {
  const T = G.teams[hid];
  const cap = capOf(hid);
  let D = demandOf(hid, aid, dayIdx);
  if (post) D *= post === 'gs' ? 1.8 : 1.5;
  if (!isUser(hid)) {
    D *= (0.94 + (T.facLv || 2) * 0.03) * rf(0.94, 1.06);
    const att = Math.round(Math.min(cap, D));
    T.att = T.att || { g: 0, tot: 0 }; if (!post) { T.att.g++; T.att.tot += att; }
    return att;
  }
  D *= userAttMult() * rf(0.94, 1.06);
  D += G.fc.members * 0.012;
  let promo = null;
  if (!post && dayIdx % 6 >= 3) promo = pickPromo();
  if (!promo && !post && G.promo.queue.length && dayIdx % 6 === 2 && chance(0.3)) promo = pickPromo();
  const pd = promo ? PROMOS[promo] : null;
  if (pd) D *= 1 + pd.att * (1 + G.stad.fac.light.lv * 0.08);
  const sale = userTicketSale(D, cap, post ? 1.3 : 1);
  const att = Math.round(sale.att);
  const f = G.stad.fac;
  const tw = G.town.stat;
  const share = G.stad.owned ? 1 : 0.5;
  const foodPc = (700 + f.food.lv * 200) * (1 + tw.food) * (pd && pd.food ? 1 + pd.food : 1) * (1 + (G.flags.foodBoost || 0));
  const goodsPc = (250 + f.shop.lv * 100) * (0.6 + T.pop / 100 * 0.8) * (1 + tw.goods + adEffect('goods')) * (pd && pd.goods ? 1 + pd.goods : 1) * (1 + (G.flags.goodsBoost || 0));
  book('rev', 'ticket', sale.rev);
  book('rev', 'food', att * foodPc * share / 10000);
  book('rev', 'goods', att * goodsPc / 10000);
  book('rev', 'town', G.town.stat.gameRev || 0);
  book('exp', 'ops', 800 + att * 0.07);
  if (pd) {
    book('exp', 'promo', pd.cost);
    if (pd.fans) T.fans += pd.fans;
    if (pd.pop) T.pop = clamp(T.pop + pd.pop, 0, 99);
    if (pd.attach) G.town.attach = clamp(G.town.attach + pd.attach, 0, 100);
    if (pd.sat) G.flags.satTmp = (G.flags.satTmp || 0) + pd.sat;
    G.promo.log.unshift({ date: nowStr(), k: promo, att });
    if (G.promo.log.length > 30) G.promo.log.pop();
  }
  const A = G.fin.att;
  if (!post) {
    A.g++; A.tot += att; A.max = Math.max(A.max, att); if (att >= cap * 0.995) A.sell++;
    A.list.push(att); if (A.list.length > 80) A.list.shift();
  } else { A.post = (A.post || 0) + att; }
  T.att = T.att || { g: 0, tot: 0 }; if (!post) { T.att.g++; T.att.tot += att; }
  return att;
}
function previewAttendance(prices) {

function adWeeklyCost() { let c = 0; for (const k in G.ads.lv) { const lv = G.ads.lv[k]; if (lv > 0) c += ADS[k].cost * lv; } return c * (G.ads.paused ? 0 : 1); }
function adEffect(key) {
  let e = 0; if (G.ads.paused) return 0;
  const pr = uStaff('pr'); const prm = 0.8 + (pr ? pr.abil : 40) / 100 * 0.4;
  for (const k in G.ads.lv) { const lv = G.ads.lv[k]; if (lv > 0 && ADS[k][key]) e += ADS[k][key] * Math.pow(lv, 0.75) * prm; }
  return e;
}
function tvAnnual(T) { return (T.market * 16000 + T.pop * 800); }

/* ---------- ファンクラブ ---------- */
function fcAvgFee() { let s = 0; for (const k in FC_TIERS) s += FC_TIERS[k].mix * G.fc.fee[k]; return s; }
function fcRefFee() { let s = 0; for (const k in FC_TIERS) s += FC_TIERS[k].mix * FC_TIERS[k].ref; return s; }
function fcTarget() {
  const T = uT();
  const fans = T.fans * 10000;
  const rate = 0.004 + 0.006 * (T.pop / 100);
  const feeF = Math.pow(fcRefFee() / Math.max(500, fcAvgFee()), 0.8);
  const benF = 0.8 + G.fc.ben * 0.1;
  const sales = 0.85 + clamp(G.budget.sales / 20000, 0, 3) * 0.08 + (uStaff('sales') ? uStaff('sales').abil : 40) / 100 * 0.1;
  const camp = G.fc.camp > 0 ? 1.15 : 1;
  return fans * rate * feeF * benF * sales * camp * (1 + adEffect('fc'));
}
function fcWeekly() {
  const t = curTurn(); const FC = G.fc;
  const target = fcTarget();
  const speed = t < 16 ? 0.06 : (t < 36 ? 0.03 : 0.012);
  let nw = (target - FC.members) * speed;
  if (nw > 0) { FC.members += nw; book('rev', 'fanclub', nw * fcAvgFee() / 10000); FC.joinY += nw; }
  else FC.members += nw * 0.3;
  book('exp', 'fc', FC.members * FC.ben * 800 / 48 / 10000);
  if (FC.camp > 0) { FC.camp--; book('exp', 'promo', 300); }
}

  const FC = G.fc; const sat = stadSatisfaction();
  const ret = clamp(0.62 + sat / 400 + FC.ben * 0.02 + (uT().lastPct - 0.5) * 0.4, 0.5, 0.92);
  FC.members *= ret;
  book('rev', 'fanclub', FC.members * fcAvgFee() / 10000);
  FC.lastRet = ret; FC.joinY = 0;
}

/* ---------- 人気・ファン人口（全球団・毎週） ---------- */
function popTarget(T) {
  const user = isUser(T.id);
  const R = T.rec; const n = R.w + R.l;
  const wp = n >= 10 ? pctOf(R) : (T.lastPct || 0.5);
  const stars = roster(T.id).filter(p => p.lv === 1).sort((a, b) => b.pop - a.pop).slice(0, 5);
  const mg = teamMgr(T.id);
  const parts = { base: 25 + T.market * 7, perf: (wp - 0.5) * 60, star: (avg(stars, p => p.pop) - 50) * 0.15, mgr: ((mg.fame || 40) - 50) * 0.06, bonus: T.popBonus || 0 };
  if (user) {
    parts.ads = adEffect('pop') * 25;
    parts.sat = (stadSatisfaction() - 60) * 0.15;
    parts.town = G.town.attach * 0.05 + BLD_EFFECT('popw') * 40;
    const pr = uStaff('pr'); parts.pr = pr ? (pr.abil - 50) * 0.04 : -1;
    if (G.user.policy === 'profit') parts.pol = -2;
  } else parts.fac = ((T.facLv || 2) - 2) * 1.5 + T.market * 1.2;
  let s = 0; for (const k in parts) s += parts[k];
  return { v: clamp(s, 5, 99), parts };
}
function weeklyPopularity(weekRes) {
  const season = curTurn() >= SEASON_START && curTurn() <= MAKEUP_TURN;
  for (const T of G.teams) {
    const user = isUser(T.id);
    let d = (popTarget(T).v - T.pop) * 0.015;
    const wr = weekRes[T.id];
    if (season && wr && wr.g) d += (wr.w / wr.g - 0.5) * 0.6;
    T.pop = clamp(T.pop + d, 5, 99);
    if (T.popBonus) T.popBonus *= 0.985;
    const tf = T.market * 55 + T.pop * 3.5 + (user ? G.town.stat.pop / 2000 + G.town.attach * 0.5 : T.market * 6);
    let fd = (tf - T.fans) * 0.01;
    if (user) fd += adEffect('fans') * (G.user.policy === 'local' ? 1.15 : 1);
    T.fans = Math.max(20, T.fans + fd);
  }
}

/* ---------- スポンサー・球場内広告 ---------- */
function sponsorCat(slot) { return (SPONSOR_SLOTS[slot] && SPONSOR_SLOTS[slot].cat) || 'uni'; }
/* 球場を借りていると、球場内広告の収入の4割は球場の持ち主に入る */
function stadAdShare() { return G.stad.owned ? 1 : 0.6; }
function sponsorReq(slot) {
  const d = SPONSOR_SLOTS[slot];
  if (d && d.req) for (const k in d.req) { const f = G.stad.fac[k]; if (!f || f.lv < d.req[k]) return { ok: false, why: `${STAD_FAC[k].n}Lv${d.req[k]}から販売できます` }; }
  return { ok: true };
}
/* 枠の相場（年額・万円） */
function sponsorValue(slot) {
  const T = uT(); const s = SPONSOR_SLOTS[slot];
  const sales = 0.85 + clamp(G.budget.sales / 20000, 0, 3) * 0.06 + ((uStaff('sales') ? uStaff('sales').abil : 40) - 50) * 0.004;
  let ex = 1;
  if (s.x === 'att') { const A = G.fin.att; const avgAtt = A && A.g ? A.tot / A.g : (G.fin.lastAtt ? G.fin.lastAtt / 71 : capOf(T.id) * 0.7); ex = clamp(avgAtt / 27000, 0.5, 1.6); }
  else if (s.x === 'cap') ex = clamp(capOf(T.id) / 32000, 0.5, 1.6);
  else if (s.x === 'town') { const st = G.town.stat; ex = 0.8 + (st.vibBase != null ? st.vibBase : st.vib || 10) / 120; }
  else if (s.x === 'vision') ex = 0.5 + G.stad.fac.vision.lv * 0.25;
  return s.base * ex * (0.45 + T.pop / 100) * (0.6 + T.market * 0.12) * sales * (G.user.policy === 'profit' ? 1.05 : 1);
}
function dealNewId() { G.dealId = (G.dealId || 0) + 1; return G.dealId; }
/* 交渉用の隠れた値：max＝希望年数での上限、py＝希望年数、pat＝我慢できる回数、int＝熱意、hn＝営業部長の読みのぶれ */
function dealFields(o, v, py, opt) {
  opt = opt || {};
  const int = opt.int != null ? opt.int : rf(0.2, 1);
  const sales = uStaff('sales'); const ab = sales ? sales.abil : 40;
  o.id = o.id || dealNewId();
  o.int = Math.round(int * 100) / 100;
  o.py = py; o.yrs = o.yrs || py;
  o.max = Math.round(v * (0.97 + int * 0.22) * rf(0.96, 1.04));
  o.pat = ri(1, 3) + (opt.renew ? 1 : 0) + (ab >= 70 ? 1 : 0);
  o.hn = Math.round(rf(-1, 1) * 100) / 100;
  o.rd = 0; o.log = []; o.final = false;
  return o;
}
function makeSponsorOffer(slot, opt, exclude) {
  opt = opt || {};
  const S = G.sponsors; const ng = S.ng || {};
  const pool = COMPANIES.filter(c => !(exclude && exclude.has(c)) && !(ng[c] > 0));
  const co = opt.co || pick(pool.length ? pool : COMPANIES);
  const py = opt.yrs || ri(1, 3);
  const v = sponsorValue(slot) * (opt.renew ? 1.03 : 1);
  const o = { slot, co, yrs: py, exp: opt.exp || 8, renew: !!opt.renew };
  dealFields(o, v, py, opt);
  o.annual = roundSal(Math.min(o.max * 0.96, v * rf(0.88, 1.02)));
  return o;
}
function genSponsorOffers(slot, n) {
  const ex = new Set(G.sponsors.offers.filter(o => o.slot === slot).map(o => o.co));
  const out = [];
  for (let i = 0; i < (n || 2); i++) { const o = makeSponsorOffer(slot, null, ex); ex.add(o.co); out.push(o); }
  return out;
}
function sponsorWeekly() {
  const S = G.sponsors; S.sol = S.sol || {}; S.ng = S.ng || {};
  for (const slot in SPONSOR_SLOTS) {
    if (S.cur[slot] || !sponsorReq(slot).ok) continue;
    if (S.sol[slot] > 0) { S.sol[slot]--; if (S.sol[slot] === 0) { delete S.sol[slot]; S.offers.push(...genSponsorOffers(slot, ri(2, 3))); addNews('biz', `${SPONSOR_SLOTS[slot].n}の営業に、企業から提案が届きました`, { tid: G.user.tid }); } continue; }
    if (!S.offers.some(o => o.slot === slot) && chance(0.06)) S.offers.push(...genSponsorOffers(slot, ri(1, 2)));
  }
  for (const c in S.ng) { S.ng[c]--; if (S.ng[c] <= 0) delete S.ng[c]; }
  S.offers.forEach(o => o.exp--);
  S.offers = S.offers.filter(o => o.exp > 0 && SPONSOR_SLOTS[o.slot]);
  let uni = 0, stad = 0;
  for (const k in S.cur) { const c = S.cur[k]; if (!c || !SPONSOR_SLOTS[k]) continue; if (sponsorCat(k) === 'stad') stad += c.annual; else uni += c.annual; }
  book('rev', 'sponsor', uni / 48);
  if (stad) book('rev', 'stadad', stad * stadAdShare() / 48);
}
/* 空いている枠に営業をかける（数週間で提案が届く） */
function solicitSponsor(slot) {
  const S = G.sponsors; S.sol = S.sol || {};
  if (S.cur[slot] || S.sol[slot] || !sponsorReq(slot).ok) return false;
  S.sol[slot] = ri(1, 3); return true;
}
function acceptSponsorId(id) {
  const o = G.sponsors.offers.find(x => x.id === id); if (!o) return false;
  G.sponsors.cur[o.slot] = { co: o.co, annual: o.annual, yrs: o.yrs, since: G.year };
  G.sponsors.offers = G.sponsors.offers.filter(x => x.slot !== o.slot);
  if (G.sponsors.sol) delete G.sponsors.sol[o.slot];
  addNews('biz', `${SPONSOR_SLOTS[o.slot].n}の${o.renew ? '契約を' + o.co + 'と更新' : 'スポンサーに' + o.co + 'が決定'}（年${fmtOku(o.annual)}・${o.yrs}年）`, { tid: G.user.tid });
  return true;
}
function acceptSponsor(i) { const o = G.sponsors.offers[i]; if (o) { if (!o.id) o.id = dealNewId(); acceptSponsorId(o.id); } }
function sponsorYearEnd() {
  const S = G.sponsors;
  for (const k in S.cur) {
    const c = S.cur[k]; if (!c) continue; c.yrs--;
    if (c.yrs > 0) continue;
    S.cur[k] = null;
    if (SPONSOR_SLOTS[k] && sponsorReq(k).ok && chance(0.8)) {
      S.offers.push(makeSponsorOffer(k, { co: c.co, renew: true, int: rf(0.5, 1), exp: 10 }));
      addNews('biz', `${SPONSOR_SLOTS[k].n}（${c.co}）の契約が満了しました。${c.co}から更新の提案が届いています`, { tid: G.user.tid });
    } else addNews('biz', `${SPONSOR_SLOTS[k] ? SPONSOR_SLOTS[k].n : k}（${c.co}）の契約が満了しました`, { tid: G.user.tid });
  }
  for (const slot in SPONSOR_SLOTS) if (!S.cur[slot] && sponsorReq(slot).ok && S.offers.filter(o => o.slot === slot).length < 2) S.offers.push(...genSponsorOffers(slot, 1));
}

/* ---------- 広告料・命名権料の交渉 ---------- */
/* kind：'sp'＝スポンサー・球場内広告、'nm'＝ネーミングライツ */
function dealList(kind) { return kind === 'nm' ? G.naming.offers : G.sponsors.offers; }
function dealYearRange(kind) { return kind === 'nm' ? [3, 10] : [1, 5]; }
function dealFind(kind, id) { return dealList(kind).find(o => o.id === id) || null; }
function dealValue(kind, o) { return kind === 'nm' ? namingValue(o.kind) : sponsorValue(o.slot); }
function dealLabel(kind, o) { return kind === 'nm' ? (o.kind === 'main' ? '本拠地のネーミングライツ' : '2軍球場のネーミングライツ') : SPONSOR_SLOTS[o.slot].n; }
/* 古いセーブの提案にも交渉用の値を持たせる */
function dealEnsure(kind, o) {
  if (o.max != null && o.py != null) return o;
  const v = dealValue(kind, o);
  dealFields(o, v, o.yrs, {});
  o.max = Math.max(o.max, Math.round(o.annual * 1.03));
  return o;
}
/* 希望年数から外れるほど、年額の上限は下がる */
function dealReserve(kind, o, yrs) { const k = kind === 'nm' ? 0.025 : 0.04; return o.max * (1 - k * Math.abs(yrs - o.py)); }
function dealMood(o) {
  if (o.final || o.pat <= 0) return { t: 'これ以上は難しそう', c: 'neg' };
  if (o.pat === 1) return { t: '慎重になっている', c: 'warn' };
  return { t: o.int >= 0.6 ? 'ぜひ契約したい様子' : '前向き', c: 'pos' };
}
/* 営業部長の読み。能力が高いほど幅が狭く、正確 */
function dealHint(kind, o, yrs) {
  const s = uStaff('sales'); const ab = s ? s.abil : 40;
  if (ab < 45) return null;
  const err = ab >= 75 ? 0.04 : ab >= 60 ? 0.08 : 0.13;
  const c = dealReserve(kind, o, yrs) * (1 + (o.hn || 0) * err * 0.5);
  return { lo: roundSal(c * (1 - err)), hi: roundSal(c * (1 + err)) };
}
function dealSign(kind, o) {
  if (kind === 'nm') { const i = G.naming.offers.indexOf(o); acceptNaming(i); }
  else acceptSponsorId(o.id);
}
/* こちらの条件を出す。結果：signed（合意）／counter（相手が歩み寄り）／walk（決裂） */
function negotiateDeal(kind, id, ask, yrs) {
  const o = dealFind(kind, id); if (!o) return { res: 'gone' };
  dealEnsure(kind, o);
  const [y0, y1] = dealYearRange(kind);
  yrs = clamp(Math.round(+yrs || o.yrs), y0, y1);
  ask = roundSal(Math.max(0, +ask || 0));
  if (yrs === o.yrs && ask <= o.annual) { dealSign(kind, o); return { res: 'signed', annual: o.annual, yrs: o.yrs }; }
  const R = dealReserve(kind, o, yrs);
  o.rd++; o.log.push({ w: 'me', a: ask, y: yrs });
  if (ask <= R) { o.annual = ask; o.yrs = yrs; o.log.push({ w: 'co', t: 'ok', a: ask, y: yrs }); dealSign(kind, o); return { res: 'signed', annual: ask, yrs }; }
  const gap = ask / R - 1;
  o.pat -= gap > 0.25 ? 2 : 1;
  /* 上限を大きく超える要求は、相手を怒らせて打ち切られることがある */
  const angry = gap > 0.12 && chance(Math.min(0.6, (gap - 0.12) * 2.5));
  if (o.pat < 0 || angry) {
    const L = dealList(kind); L.splice(L.indexOf(o), 1);
    G.sponsors.ng = G.sponsors.ng || {}; G.sponsors.ng[o.co] = 24;
    addNews('biz', `${o.co}との${dealLabel(kind, o)}の交渉は決裂しました`, { tid: G.user.tid });
    return { res: 'walk', co: o.co, angry: angry && o.pat >= 0 };
  }
  const prev = o.yrs === yrs ? o.annual : Math.min(o.annual, R * 0.9);
  let next = prev + (Math.min(R, ask) - prev) * rf(0.35, 0.65);
  next = roundSal(Math.min(Math.floor(R), Math.max(next, prev)));
  o.annual = next; o.yrs = yrs;
  o.final = o.pat === 0 || (R - next) / R < 0.03;
  o.log.push({ w: 'co', t: o.final ? 'final' : 'counter', a: next, y: yrs });
  return { res: 'counter', annual: next, yrs, final: o.final };
}
/* 相手の今の条件で契約する */
function takeDeal(kind, id) { const o = dealFind(kind, id); if (!o) return false; dealSign(kind, o); return true; }

/* ---------- ネーミングライツ ---------- */
function namingValue(kind) {
  const T = uT();
  if (kind === 'farm') return (2500 + T.pop * 40 + G.tfac.farm.lv * 500);
  return (8000 + capOf(T.id) * 0.06 + T.pop * 120 + T.market * 3000) * (G.stad.dome ? 1.1 : 1);
}
function genNamingOffers(kind) {
  const out = []; const ng = G.sponsors.ng || {};
  const pool = COMPANIES.filter(c => !(ng[c] > 0));
  for (let i = 0; i < 3; i++) {
    const co = pick(pool.length ? pool : COMPANIES); const yrs = ri(3, 8);

    const o = { kind, co, name, yrs, exp: 6 };

function namingWeekly() {

}

}

function stadiumNameOf(tid) { return isUser(tid) ? stadiumName() : G.teams[tid].stad.name; }

/* ---------- 融資 ---------- */
function loanLimit() { const rev = Math.max(yearTotal('rev'), G.fin.lastRev || 80000); return Math.round(rev * 1.6 * (0.6 + G.owner.trust / 125)); }
function debt() { return sum(G.fin.loans, l => l.bal); }
function loanRate() { return 0.012 + clamp(debt() / Math.max(1, loanLimit()), 0, 1) * 0.012; }
function borrow(amount, yrs) {
  const room = loanLimit() - debt(); amount = Math.min(amount, room);
  if (amount <= 0) return false;
  G.fin.loans.push({ bal: amount, rate: loanRate(), yrs, pay: Math.ceil(amount / yrs), taken: G.year });
  G.fin.cash += amount;
  addNews('biz', `銀行から${fmtOku(amount)}を借り入れました（${yrs}年返済）`, { tid: G.user.tid });
  return true;
}
function repay(idx, amount) {
  const l = G.fin.loans[idx]; if (!l) return;
  amount = Math.min(amount, l.bal, Math.max(0, G.fin.cash));
  l.bal -= amount; G.fin.cash -= amount;
  if (l.bal <= 0.5) G.fin.loans.splice(idx, 1);
}

/* ---------- 毎週の収支 ---------- */
function otherCost(T) { return 30000 + T.market * 20000; }
function officeCost(T) { return 20000 + T.market * 6000; }

  book('exp', 'staff', (sum(userStaffList(), s => s.sal) + officeCost(T)) / 48);

  book('exp', 'maint', facilityMaint());
  book('exp', 'ads', adWeeklyCost());

  book('exp', 'dev', G.budget.dev / 48);

  }

}
function monthClose() {
  const F = G.fin;

/* ---------- 街づくり ---------- */

/* ---------- AIの見立て ---------- */
function aiKnows(p, tid) { return p.pr.hype >= 35 || hash2(p.id, tid * 13 + 5) < 0.55; }

/* ---------- 自由契約（戦力外） ---------- */

/* ---------- FA ---------- */
function faEligible(p) { const need = p.faUsed ? p.faUsed + 4 : 8; return !p.frn && p.svc >= need && p.yrs <= 1 && !(p.ren && p.ren.st === 'signed') && p.lv !== 3; }
function faRank(p) { const ss = shihai(p.team).filter(x => !x.frn).sort((a, b) => b.sal - a.sal); const i = ss.indexOf(p); return i < 3 ? 'A' : i < 10 ? 'B' : 'C'; }

    const askYrs = p.age <= 29 ? ri(3, 5) : p.age <= 32 ? ri(2, 4) : ri(1, 2);
    G.faMarket.push({ id: p.id, from: T.id, rank, ask, askYrs, offers: {}, done: false, prevSal: p.sal });
    p.fa = { kind: 'fa', from: T.id };
    removeFromTeam(p);
    addNews('fa', `${tShort(T.id)}の${p.name}（${POS_JP[p.pos]}・${p.age}歳）がFA権を行使（${rank}ランク）`, { important: isUser(T.id) || o >= 70, tid: T.id });

}
function faNeed(T, p) {

    const weakest = rot.length >= 5 ? rot[0] : 40;

  }

function aiFABids() {

}

  const pop = (T.pop - 50) / 50;

/* ---------- トレード ---------- */
function tradeOpen() { const t = curTurn(); return t <= 27 || t >= 40; }
function evalTrade(tid, give, get, cash) {
  const ut = G.user.tid;
  if (!tradeOpen()) return { ok: false, why: 'トレード期間外です（7月末で締切、11月に再開）' };
  if (!give.length && !get.length) return { ok: false, why: '選手を選んでください' };
  const vin = sum(give, p => pVal(p, tid)), vout = sum(get, p => pVal(p, tid));
  const maxOut = get.length ? Math.max(...get.map(p => pVal(p, tid))) : 0;
  const maxIn = give.length ? Math.max(...give.map(p => pVal(p, tid))) : 0;
  let score = vin + cash / 10000 * 30 - vout * 1.08 - 5;
  if (maxOut > 0 && maxIn < maxOut * 0.6) score -= (maxOut * 0.6 - maxIn) * 1.5;
  const after = shihai(tid).length + give.filter(p => p.lv !== 3).length - get.filter(p => p.lv !== 3).length;
  if (after > LIM.shihai) return { ok: false, why: `${tName(tid)}の支配下枠が足りません` };
  const ua = shihai(ut).length - give.filter(p => p.lv !== 3).length + get.filter(p => p.lv !== 3).length;
  if (ua > LIM.shihai) return { ok: false, why: 'あなたの支配下枠（70人）を超えます' };
  if (cash > 0 && G.fin.cash < cash) return { ok: false, why: '資金が足りません' };
  const cLeft = shihai(tid).filter(p => p.pos === 'C' && !get.includes(p)).length + give.filter(p => p.pos === 'C').length;
  if (cLeft < 3) return { ok: false, why: '捕手が足りなくなるため断られました', score };
  const ok = score >= 0;
  return { ok, score, why: ok ? '' : (score > -60 ? 'あと少し上積みがあれば応じてもらえそうです' : '釣り合わないと断られました') };
}
function doTrade(tid, give, get, cash) {
  const ut = G.user.tid;
  for (const p of give) { const lv = p.lv === 3 ? 3 : 2; addToTeam(p, tid, lv); p.mor = clamp(p.mor - 5, 0, 100); }
  for (const p of get) { const lv = p.lv === 3 ? 3 : 2; addToTeam(p, ut, lv); p.mor = clamp(p.mor + 3, 0, 100); }
  if (cash > 0) book('exp', 'transfer', cash); else if (cash < 0) book('rev', 'transfer', -cash);
  const s = `${tName(tid)}とトレード成立：${give.map(p => p.name).join('・') || '金銭'} ⇄ ${get.map(p => p.name).join('・') || '金銭'}`;
  addNews('trade', s, { important: true, tid: ut });
  G.trades.unshift({ y: G.year, m: G.month, tid, give: give.map(p => p.name), get: get.map(p => p.name), cash });
  touch();
}

/* ---------- 引退 ---------- */

/* =========================================================
   育成：成長・衰え・キャンプ・故障・やる気・調子
   ========================================================= */
const PHYS = { pow: 1, spd: 1, arm: 1, vel: 1, sta: 1 };
const BAT_GRP = { con: 'bat', pow: 'bat', eye: 'bat', fld: 'fld', arm: 'fld', spd: 'fld' };

/* チームごとの成長係数（毎週計算） */
function growCtx(tid) {
  const t = curTurn();
  const user = isUser(tid);
  const T = G.teams[tid];
  const ctx = { team: tid, user, mult: 1, camp: null };
  // 時期: 2月=キャンプ、11〜1月=自主トレ（控えめ）
  let season = 1;
  if (t >= 4 && t <= 7) season = 2.0;
  else if (t >= 40 || t <= 3) season = 0.5;
  else if (t >= 36) season = 0.7;
  ctx.season = season;
  if (user) {
    const mg = uStaff('mgr'); const hd = uStaff('head');
    ctx.mult = (0.9 + (mg ? mg.dev : 40) / 100 * 0.2) * (1 + (hd ? hd.abil - 50 : -10) * 0.001);
    ctx.mult *= 0.9 + 0.1 * clamp(G.budget.dev / 30000, 0, 2.5);
    ctx.mult *= TRAIN_INT[G.user.train].grow;
    if (G.user.policy === 'dev') ctx.mult *= 1.10;
    ctx.mult *= 1 + facMult('team', 'gym') * 0.04 + facMult('team', 'analytics') * 0.02;
    ctx.cBat = 0.75 + coach('bat') / 100 * 0.5; ctx.cPit = 0.75 + coach('pit') / 100 * 0.5; ctx.cFld = 0.75 + coach('fld') / 100 * 0.5;
    ctx.cFarm = 0.75 + coach('farm') / 100 * 0.5; ctx.cIk = 0.75 + coach('ikusei') / 100 * 0.5;
    ctx.fIndoor = 1 + facMult('team', 'indoor') * 0.04; ctx.fPen = 1 + facMult('team', 'bullpen') * 0.05;
    ctx.fFarm = 1 + facMult('team', 'farm') * 0.05; ctx.fDorm = 1 + facMult('team', 'dorm') * 0.05;
    if (t >= 4 && t <= 7 && G.camp) {
      const site = CAMP_SITES[G.camp.site], th = CAMP_THEMES[G.camp.theme], it = CAMP_INT[G.camp.int];
      ctx.camp = { site, th, it, guest: G.camp.guest };
      ctx.mult *= site.grow * it.grow * (G.camp.guest ? 1.06 : 1);
    }
    if ((t === 41 || t === 42) && G.fallCamp && G.fallCamp.on) ctx.fall = G.fallCamp.theme;
  } else {
    const m = T.mgr; const lv = T.facLv || 2;
    ctx.mult = (0.9 + m.dev / 100 * 0.2) * (0.92 + lv * 0.04);
    ctx.cBat = ctx.cPit = ctx.cFld = ctx.cFarm = ctx.cIk = 0.9 + lv * 0.04;
    ctx.fIndoor = ctx.fPen = ctx.fFarm = ctx.fDorm = 1 + lv * 0.02;
    if (t >= 4 && t <= 7) ctx.mult *= 1.06;
    if (t === 41 || t === 42) ctx.fall = 'balance';
  }

}
function growPlayer(p, ctx) {
  const g = GT[p.gt]; const age = p.age;
  const ageMul = age <= g.g ? (age <= 20 ? 1.1 : 1.0) : age <= g.p ? 0.35 : 0;
  const keys = isP(p) ? PIT_KEYS : BAT_KEYS;
  const per = PERS[p.per].grow || 1;
  const morF = 0.8 + p.mor / 100 * 0.4;
  let playF = 1;
  if (ctx.team != null) {
    if (p.lv === 1) playF = isP(p) ? (p.wkG >= 1 ? 1.1 : 0.9) : (p.wkG >= 4 ? 1.15 : p.wkG <= 1 ? 0.85 : 1);
    else if (p.lv === 3) playF = 0.92;
  }
  const season = ctx.season || 1;
  const base = 0.15 * (ctx.mult || 1) * per * morF * playF * season * (p.injW > 0 ? 0.3 : 1);
  const lvF = ctx.team == null ? 1 : p.lv === 1 ? 1 : p.lv === 2 ? (ctx.cFarm || 1) * (ctx.fFarm || 1) : (ctx.cIk || 1) * (ctx.fFarm || 1);
  const dorm = age <= 23 ? (ctx.fDorm || 1) : 1;

  for (const k of keys) {
    const cur = p.a[k], cap = p.cap[k];
    if (ageMul > 0 && cur < cap) {
      const room = (cap - cur) / (k === 'vel' ? 4 : 15);
      let inc = base * ageMul * Math.pow(clamp(room, 0, 1), 0.8) * rf(0.4, 1.6) * lvF * dorm;
      if (p.lv === 1) inc *= isP(p) ? (ctx.cPit || 1) * (ctx.fPen || 1) : (BAT_GRP[k] === 'bat' ? (ctx.cBat || 1) * (ctx.fIndoor || 1) : (ctx.cFld || 1));
      else if (isP(p)) inc *= ctx.fPen ? 1 + (ctx.fPen - 1) * 0.5 : 1;
      if (p.focus) inc *= p.focus === k ? 1.6 : 0.85;
      if (ctx.camp) {
        const th = ctx.camp.th;

        if (th.youth) inc *= age <= 24 ? 1.4 : 0.85;
      }
      if (ctx.fall && age <= 25) inc *= ctx.fall === 'balance' ? 1.5 : (CAMP_THEMES[ctx.fall].keys && CAMP_THEMES[ctx.fall].keys.includes(k) ? 2.0 : 1.3);

}

}

/* ---------- 調子とやる気 ---------- */
function weeklyMorale(weekRes) {

  for (const T of G.teams) {

    const R = T.rec; const wp = (R.w + R.l) >= 8 ? pctOf(R) : 0.5;
    const hasLeader = rosterLv(T.id, 1).some(p => p.per === 'leader' && ovr(p) >= 60);
    const dorm = isUser(T.id) ? G.tfac.dorm.lv : (T.facLv || 2) * 0.6;
    for (const p of roster(T.id)) {

function batterFatigue(res) {

}

/* ---------- 故障 ---------- */
function injMult(p) {

  if (p.team >= 0 && isUser(p.team)) {
    m *= 1 - facMult('team', 'medical') * 0.05 - facMult('team', 'gym') * 0.03 - facMult('stad', 'turf') * 0.03;
    m *= 1 - (coach('cond') - 50) * 0.004;

    const t = curTurn(); if (t >= 4 && t <= 7 && G.camp) m *= CAMP_SITES[G.camp.site].inj * CAMP_INT[G.camp.int].inj;
  } else if (p.team >= 0) m *= 1.05 - (G.teams[p.team].facLv || 2) * 0.03;

}

}

  for (const x of res.pp) { const p = P_(x.id); if (p && p.injW === 0 && chance((x.sp ? 0.006 : 0.0025) * injMult(p) * (x.pc > 115 ? 1.5 : 1))) injure(p, injMult(p)); }

function weeklyInjuries() {

      else rec += (T.facLv || 2) * 0.05;

    } else if (chance((camp ? 0.004 : 0.0018) * injMult(p))) injure(p, injMult(p));

function maybeRandomEvent() {
  if (G.pending.length >= 2 || !chance(0.16)) return;
  const ks = Object.keys(EVENTS).filter(k => EVENTS[k].w > 0 && EVENTS[k].cond() && !(G.evCool[k] > 0));
  if (!ks.length) return;
  const k = wpick(ks, x => EVENTS[x].w);
  const data = EVENTS[k].prep ? EVENTS[k].prep() : {};
  queueEvent(k, data);
  G.evCool[k] = 20;
}
function resolveEvent(i, ci) {
  const e = G.pending[i]; if (!e) return '';
  const def = EVENTS[e.id]; const c = def.ch[ci] || def.ch[def.ch.length - 1];
  const msg = c.f(e.data) || '';
  addNews('event', `${def.t}：${c.l}。${msg}`, { tid: G.user.tid });
  G.pending.splice(i, 1);
  return msg;
}
function eventsWeekly() {
  for (const k in G.evCool) if (G.evCool[k] > 0) G.evCool[k]--;
  for (const e of G.pending) e.age++;
  // 2週間放置したイベントは無難な選択で自動処理
  for (let i = G.pending.length - 1; i >= 0; i--) if (G.pending[i].age >= 3) { const def = EVENTS[G.pending[i].id]; resolveEvent(i, def.ch.length - 1); }
  if (G.flags.goodsWeeks > 0) { G.flags.goodsWeeks--; if (G.flags.goodsWeeks === 0) G.flags.goodsBoost = 0; }
  maybeRandomEvent();
  maybeTradeOffer();
}
function maybeTradeOffer() {
  if (!tradeOpen() || !chance(0.05) || G.pending.some(e => e.id === 'tradeOffer')) return;
  const ut = G.user.tid;
  const mine = shihai(ut).filter(p => { const v = pVal(p); return v > 120 && v < 520 && p.injW === 0; });
  if (!mine.length) return;
  const want = pick(mine);
  const T = pick(G.teams.filter(t => t.id !== ut));
  const target = pVal(want, T.id);
  const cands = shihai(T.id).filter(p => p.injW === 0 && isP(p) !== isP(want) || (p.injW === 0 && p.pos !== want.pos)).filter(p => { const v = pVal(p, T.id); return v > target * 0.85 && v < target * 1.1; });
  if (!cands.length) return;
  const give = pick(cands);
  queueEvent('tradeOffer', { tid: T.id, want: want.id, give: give.id });
}

function aiPayBudget(T) { return Math.round((150000 + T.market * 100000 + T.pop * 1500) * (0.9 + (T.lastPct || 0.5) * 0.2)); }
function aiWeekly() {
  const t = curTurn();
  for (const T of G.teams) {
    if (isUser(T.id)) continue;
    autoRoster(T.id);
    if (t === 22) {
      const ik = rosterLv(T.id, 3).filter(p => ovr(p) >= 46).sort((a, b) => ovr(b) - ovr(a));
      if (ik.length && shihai(T.id).length < 68) promoteIkusei(ik[0]);
    }
    if (t >= 18 && t <= 27 && G.foreign.length && chance(0.04)) {
      const inj = rosterLv(T.id, 2).filter(p => p.injW > 4 && ovr(p) >= 62).length;
      const frn = shihai(T.id).filter(p => p.frn).length;
      if (inj && frn < 5 && shihai(T.id).length < 70) {
        const room = T.payBudget - teamPayroll(T.id);
        const c = G.foreign.filter(p => p.fa.ask < Math.max(5000, room * 0.5));
        if (c.length) signForeign(maxBy(c, p => ovr(p)).id, T.id);
      }
    }
  }
  // ユーザー：故障者の自動入れ替え・全面おまかせ
  const ut = G.user.tid;
  if (G.user.autoRoster) autoRoster(ut);
  else if (G.user.autoSwap) swapInjured(ut);
}
function aiReleases() {
  for (const T of G.teams) {
    if (isUser(T.id)) continue;
    const tid = T.id;
    for (const p of shihai(tid).filter(p => p.frn && (ovr(p) < 57 || p.age >= 35) && p.yrs <= 1)) releasePlayer(p, true);
    const sh = shihai(tid);
    const target = 62;
    if (sh.length > target) {
      const cands = sh.filter(p => p.yrs <= 1).sort((a, b) => pVal(a, tid) - pVal(b, tid));
      let n = sh.length - target;
      for (const p of cands) { if (n <= 0) break; releasePlayer(p, true); n--; }
    }
    const ik = rosterLv(tid, 3).sort((a, b) => pVal(a, tid) - pVal(b, tid));
    let extra = ik.length - 12;
    for (const p of ik) { if ((p.age >= 24 && ovr(p) < 44) || extra > 0) { releasePlayer(p, true); extra--; } }
  }
}
function aiForeignSignings() {
  for (const T of G.teams) {
    if (isUser(T.id)) continue;
    const frn = shihai(T.id).filter(p => p.frn).length;
    if (frn >= 5 || shihai(T.id).length >= 69) continue;
    const room = T.payBudget - teamPayroll(T.id, true);
    const cands = G.foreign.filter(p => p.fa.ask < Math.max(4000, room * 0.6));
    if (!cands.length) continue;
    const best = maxBy(cands, p => ovr(p) + rn(0, 4) - p.fa.ask / 5000);
    if (chance(frn <= 2 ? 0.9 : 0.55)) signForeign(best.id, T.id);
  }
}

  for (const T of G.teams) {
    if (isUser(T.id)) continue;

    const c = G.fapool.map(P_).filter(p => p && ovr(p) >= 50 && p.age <= 33).sort((a, b) => ovr(b) - ovr(a));

function prunePool() {
  const keep = G.fapool.map(P_).filter(Boolean).sort((a, b) => ovr(b) - ovr(a)).slice(0, 12).map(p => p.id);

  G.fapool = keep;
}

function sampleAge() { return wpick(AGE_W, x => x[1])[0]; }

}

/* ---------- グラフ（SVG） ---------- */
function lineChart(series, labels, o) {
  o = o || {}; const W = o.w || 640, H = o.h || 200, pl = 52, pr = 10, pt = 10, pb = 24;
  const all = series.flatMap(s => s.v.filter(v => v != null));
  if (!all.length) return '<div class="empty">データがまだありません</div>';
  let mn = Math.min(0, ...all), mx = Math.max(...all); if (o.min != null) mn = o.min; if (mx === mn) mx = mn + 1;
  const n = labels.length; const x = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)); const y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; const yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${o.fmt ? o.fmt(v) : Math.round(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  for (const s of series) {
    const pts = s.v.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    s.v.forEach((v, i) => { if (v != null && n <= 30) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.c}"><title>${esc(labels[i])}：${o.fmt ? o.fmt(v) : v}</title></circle>`; });
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'グラフ')}" style="color:var(--ink2)">${g}</svg>` +
    (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : '');
}
function barChart(items, o) {
  o = o || {}; const W = o.w || 640, rowH = 22, H = items.length * rowH + 8, pl = o.pl || 110;
  const mx = Math.max(1, ...items.map(i => Math.abs(i.v)));
  let g = '';
  items.forEach((it, i) => {
    const yy = 4 + i * rowH; const w = Math.abs(it.v) / mx * (W - pl - 90);
    g += `<text x="${pl - 8}" y="${yy + 14}" text-anchor="end">${esc(it.l)}</text><rect x="${pl}" y="${yy + 3}" width="${Math.max(1, w)}" height="${rowH - 8}" rx="2" fill="${it.c || 'var(--lamp)'}"/><text x="${pl + w + 6}" y="${yy + 14}">${esc(it.s || '')}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'グラフ')}">${g}</svg>`;
}

function storageOK() { try { const k = '__kyudan_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } }
function b64enc(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function packStr(str) {
  if (typeof CompressionStream === 'undefined') return str;
  try { const st = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip')); return 'gz:' + b64enc(await new Response(st).arrayBuffer()); } catch (e) { return str; }
}
async function unpackStr(str) {
  if (!str.startsWith('gz:')) return str;
  const st = new Blob([b64dec(str.slice(3))]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
async function saveTo(slot) {
  try {
    const data = await packStr(serialize());
    localStorage.setItem(SAVE_KEY + slot, data);
    localStorage.setItem(SAVE_KEY + slot + '_meta', JSON.stringify({ t: Date.now(), team: tName(G.user.tid), date: nowStr(), name: G.user.name, tid: G.user.tid }));
    return true;
  } catch (e) { return false; }
}
async function loadFrom(slot) {
  try { const s = localStorage.getItem(SAVE_KEY + slot); if (!s) return false; deserialize(await unpackStr(s)); return true; }
  catch (e) { console.error(e); return false; }
}
let autosaveWarned = false;
function autosave() { if (!G || G.gameOver) return; saveTo('auto').then(ok => { if (!ok && !autosaveWarned) { autosaveWarned = true; toast('ブラウザに保存できませんでした。「セーブ・設定」からファイルに書き出せます', 'bad'); } }); }

  const keyTurns = [0, 4, 11, 36, 39, 40, 44];
  aheadStop = false; UI.busy = true; render();
  const step = () => {
    let stop = aheadStop || G.gameOver || blockingTasks().length > 0;
    if (!stop && n > 0) {
      const t = curTurn();
      if (m === '4' && n >= 4) stop = true;
      if (m === 'event' && (G.pending.length || keyTurns.includes(t) || (G.compPending && G.compPending.length))) stop = true;
      if (m === 'season' && ((startT < MAKEUP_TURN && t >= 36) || (startT >= MAKEUP_TURN && t === 0) || G.year > startY + 1)) stop = true;
      if (n >= 60) stop = true;
    }
    if (stop) {
      UI.busy = null; busyHide();
      const R = uT().rec;
      const msg = `${n}週進めました` + (R.w + R.l > r0.w + r0.l ? `（${R.w - r0.w}勝${R.l - r0.l}敗）` : '');
      afterAdvance(G.weekly, true); toast(msg, 'good');
      return;
    }
    advanceWeek(); n++;
    busyShow(phaseLabel() + (curTurn() >= SEASON_START && curTurn() <= MAKEUP_TURN ? `　${uT().rec.w}勝${uT().rec.l}敗` : ''));
    setTimeout(step, 0);
  };
  busyShow('');
  setTimeout(step, 30);
};

function roleOf(p) {
  if (!isP(p)) return POS_S[p.pos];
  if (p.team < 0 || p.lv !== 1) return p.pt === 'SP' ? '先' : '救';
  const R = getRoles(p.team);
  if (R.rot.includes(p.id)) return '先発';
  if (R.cl === p.id) return '抑え';
  if (R.su.includes(p.id)) return '勝継';
  return '中継';
}

  if (isP(p)) { if (!s.g) return '<span class="faint">―</span>'; return `${s.g}試 ${s.w}勝${s.l}敗${s.sv ? ' ' + s.sv + 'S' : ''}${s.hld ? ' ' + s.hld + 'H' : ''} 防${fmtEra(pEra(s))}`; }

  return `${fmtAvg(bAvg(s))} ${s.hr}本 ${s.rbi}点${s.sb ? ' ' + s.sb + '盗' : ''}`;
}

}

function awardsView() {
  const yrs = G.hist.seasons.slice().reverse();
  const cur = G.awards ? [{ y: G.year, awards: G.awards, titles: G.seasonTitles, names: null }] : [];
  const all = cur.concat(yrs);
  if (!all.length) return '<div class="empty">表彰はシーズン終了後（11月）に発表されます。</div>';
  const nm = (s, id) => { const p = P_(id); if (p) return pLink(p); const n = s.names && s.names[id]; return n ? esc(n.n) : '―'; };
  return all.map(s => {
    if (!s.awards && !s.titles) return '';
    const cols = [0, 1].map(lg => {
      const A = s.awards ? s.awards[lg] : null; const T = s.titles ? s.titles[lg] : null;
      let h = `<h4 style="margin:0 0 6px">${LEAGUES[lg]}</h4><table class="t compact"><tbody>`;
      if (A) { h += `<tr><td>MVP</td><td>${A.mvp != null ? nm(s, A.mvp) : '―'}</td></tr><tr><td>新人王</td><td>${A.roy != null ? nm(s, A.roy) : '該当なし'}</td></tr><tr><td>ゴールデンアーム賞</td><td>${A.ace != null ? nm(s, A.ace) : '―'}</td></tr>`; }
      if (T) for (const k in T) h += `<tr><td>${esc(T[k].n)}</td><td>${T[k].ids.map(id => nm(s, id)).join('、')} <span class="num faint">${STAT_DEFS[k] && STAT_DEFS[k].fmt ? STAT_DEFS[k].fmt(T[k].v) : T[k].v}</span></td></tr>`;
      if (A) { h += `<tr><td>ベストナイン</td><td class="small">${Object.entries(A.b9).map(([k, v]) => `${POS_S[k] || k}:${[].concat(v).map(id => nm(s, id)).join('・')}`).join('　')}</td></tr>`; }
      return h + '</tbody></table>';
    }).join('');
    return panel(`${s.y}年`, `<div class="grid g2">${cols}</div>`) + '<div style="height:14px"></div>';
  }).join('');
}

function accHint(p, off, yrs) {
  const need = demandFor(p, yrs); const r = off / need;
  if (r >= 1) return '<span class="pos">合意できます</span>';
  const th = p.per === 'money' ? 0.9 : p.per === 'loyal' ? 0.8 : 0.85;
  if (r >= th + (1 - th) * 0.6) return '<span class="warn">合意できそう</span>';
  if (r >= th) return '<span class="warn">五分五分より厳しい</span>';
  return '<span class="neg">まず合意できない</span>';
}

  if (t !== 39 || !D) {
    const marked = G.prospects.filter(p => p.pr.mark);
    const last = D && D.picks ? draftSummary(D) : '';
    return head + `<p class="lead">10月第4週に開催。1位指名は12球団が同時に入札し、重複したら抽選。2位以降は成績の低い球団から順に指名（3位は逆順）。最後に育成選手の指名があります。</p>` +
      (last || panel(`指名候補（★） ${marked.length}人`, marked.length ? prospectTable('dboard', marked) : '<div class="empty">スカウト画面で、気になる選手に★をつけておきましょう。</div>', { flush: true, act: '<button class="btn sm" data-a="go" data-v="scout">スカウト</button>' }));
  }
  if (D.stage === 'done') return head + `<p class="lead">ドラフト会議が終わりました。指名した選手は2軍（育成は育成）に入団し、来季から公式戦に出られます。</p>` + draftSummary(D);
  const av2 = availableProspects().filter(prospectVisible);
  let main = '';
  const r1log = D.r1log.map((r, i) => panel(i === 0 ? '1位指名の結果' : `外れ1位（${i + 1}回目）の結果`, `<div class="lot">${r.picks.map(x => { const p = G.prospects.find(y => y.id === x.pid); return `<div class="lot-row reveal ${x.teams.includes(ut) ? 'win' : ''}"><div style="flex:1"><b>${p ? esc(p.name) : '?'}</b> <span class="small muted">${p ? esc(p.pr.school) : ''}</span></div><div class="row small">${x.teams.map(tid => `<span class="${tid === x.win ? 'tag team' : 'tag'}">${esc(tShort(tid))}${x.teams.length > 1 && tid === x.win ? ' 交渉権' : ''}</span>`).join('')}</div>${x.teams.length > 1 ? `<span class="tag lamp">${x.teams.length}球団競合</span>` : ''}</div>`; }).join('')}</div>`)).join('<div style="height:12px"></div>');
  if (D.stage === 'r1') {
    const userPending = D.pending.includes(ut);
    main = (r1log ? r1log + '<div style="height:16px"></div>' : '') + (userPending ? panel(D.r1log.length ? '外れ1位を指名してください' : '1位指名する選手を選んでください', prospectTable('d1', av2, p => `<button class="btn xs pri" data-a="dPick" data-id="${p.id}">指名</button>`), { flush: true, cls: 'hl' }) :
      `<div class="row"><button class="btn pri" data-a="dNext">2位以降の指名へ進む</button></div>`);
  } else {
    const myTurn = D.order[D.idx] === ut && !D.userStop;
    const mine = D.picks.filter(x => x.tid === ut);
    main = `<div class="row sp" style="margin-bottom:10px"><div><b>${D.ik ? '育成選手ドラフト' : '支配下ドラフト'} ${D.round}巡目</b>　<span class="small muted">指名済み ${mine.filter(x => !x.ik).length}人（育成${mine.filter(x => x.ik).length}人）／支配下 ${shihai(ut).length + mine.filter(x => !x.ik).length}人見込み</span></div>
      <div class="row">${myTurn ? `<button class="btn" data-a="dStop">${D.ik ? '育成指名を終える' : '支配下の指名を終える'}</button>` : `<button class="btn pri" data-a="dNext">自分の番まで進める</button>`}<button class="btn" data-a="dAuto">残りを自動で指名</button></div></div>` +
      (myTurn ? panel(`あなたの番です（${D.round}巡目）`, prospectTable('dr', av2, p => `<button class="btn xs pri" data-a="dPick" data-id="${p.id}">指名</button>`), { flush: true, cls: 'hl' }) : '') +
      '<div style="height:14px"></div>' + draftPickLog(D);
  }
  return head + `<p class="lead">${D.stage === 'r1' ? '1位は12球団が同時に入札します。人気の選手は抽選になります。' : '指名順は成績の低い球団から。巡目ごとに順番が入れ替わります。'}</p>` + main;
};
function draftPickLog(D) {
  const rows = D.picks.slice().reverse().slice(0, 40).map(x => { const p = G.prospects.find(y => y.id === x.pid) || P_(x.pid); return `<tr class="${x.tid === G.user.tid ? 'me' : ''}"><td class="small">${x.ik ? '育成' : ''}${x.round}位</td><td>${tMark(x.tid)}</td><td>${p ? esc(p.name) : esc(x.name || '?')}</td><td class="small muted">${esc(p ? (p.pr || p.prInfo || {}).school || '' : x.school || '')}</td><td class="small">${p ? (isP(p) ? '投手' : POS_JP[p.pos]) : (x.pos ? POS_JP[x.pos] : '')}</td></tr>`; }).join('');

}
function draftSummary(D) {
  const ut = G.user.tid;
  const mine = D.picks.filter(x => x.tid === ut);
  const rows = mine.map(x => { const p = P_(x.pid) || G.prospects.find(y => y.id === x.pid); return `<tr><td>${x.ik ? '育成' : ''}${x.round}位</td><td>${x.refused || !p ? esc(x.name || (p ? p.name : '?')) : pLink(p)}</td><td class="small muted">${esc(p ? (p.prInfo || p.pr || {}).school || '' : x.school || '')}</td><td>${p ? (isP(p) ? '投手' : POS_JP[p.pos]) : (x.pos ? POS_JP[x.pos] : '')}</td><td class="num">${p ? p.age : ''}</td><td>${x.refused ? '<span class="tag o">入団拒否</span>' : x.lot ? `<span class="tag lamp">${x.lot.length}球団競合</span>` : ''}</td></tr>`; }).join('');
  const others = G.teams.filter(t => t.id !== ut).map(T => { const f = D.picks.find(x => x.tid === T.id && x.round === 1 && !x.ik); const p = f ? (P_(f.pid) || G.prospects.find(y => y.id === f.pid)) : null; return `<tr><td>${tMark(T.id)}</td><td>${p ? esc(p.name) : f && f.name ? esc(f.name) : '―'}</td><td class="num">${D.picks.filter(x => x.tid === T.id && !x.ik).length}人</td><td class="num">${D.picks.filter(x => x.tid === T.id && x.ik).length}人</td></tr>`; }).join('');
  return `<div class="grid g2">${panel('自球団の指名', `<table class="t compact"><tbody>${rows || '<tr><td class="muted">指名なし</td></tr>'}</tbody></table>`, { flush: true })}${panel('他球団の1位と指名数', `<table class="t compact"><thead><tr><th>球団</th><th>1位</th><th class="num">支配下</th><th class="num">育成</th></tr></thead><tbody>${others}</tbody></table>`, { flush: true })}</div>`;
}
ACT.dPick = el => {

SCREENS.finance = () => {
  const tab = getTab('finance', 'sum');
  const tb = tabs('finance', [['sum', '収支'], ['budget', '予算'], ['ticket', 'チケット価格'], ['loan', '融資'], ['hist', '過去の決算']], tab);

function projectYear() {
  const F = G.fin; const t = curTurn(); const last = F.hist[F.hist.length - 1];
  const rev = yearTotal('rev') - (F.y.rev.subsidy || 0), exp = yearTotal('exp') - (F.y.exp.capex || 0) - (F.y.exp.land || 0);
  if (last && t < 20) { const k = t / 48; return { rev: Math.max(rev, last.rev * (1 - k) + rev), exp: Math.max(exp, last.exp * (1 - k) + exp) }; }
  const f = Math.max(1, 48 / Math.max(1, t));
  return { rev: rev * (t >= 11 ? 48 / Math.max(12, t) : f), exp: exp * f };
}

/* 10段階の一覧。上ほど発展した姿 */
function townStageLadder() {
  const tw = G.town; const s = townStage(); const log = tw.stageLog || []; const top = Math.max(tw.stageMax || 0, s.i);
  const rows = TOWN_STAGES.map(([t, n], k) => {
    const i = k + 1; const at = log.find(l => l.i === i);
    const cls = i === s.i ? 'cur' : i <= top ? 'done' : '';
    const note = i === s.i ? 'いま' : at ? `${at.y}年${at.m}月` : i <= top ? '到達' : `賑わい${t}`;
    return `<li class="${cls}"><span class="no">${i}</span><span class="nm">${n}</span><span class="th">${note}</span></li>`;
  }).reverse().join('');
  const prog = s.next != null
    ? `<p class="small" style="margin:0 0 6px">次の「${s.nextN}」まで、いつもの賑わいがあと <b>${Math.max(1, s.next - Math.floor(s.v))}</b></p>${bar(s.v - s.cur, s.next - s.cur)}`
    : '<p class="small" style="margin:0">最後の段階に到達しました。</p>';
  return `${prog}<ol class="ladder">${rows}</ol><p class="small muted" style="margin:10px 0 0">段階は、建物と民間の店でできた「いつもの賑わい」で決まります（イベント中の上乗せは含みません）。新しい段階に届くたびに、地域の愛着・人気・ファンが少し増えます。</p>`;
}
function evEffects(d, m) {
  const out = [];
  if (d.vib) out.push(`開催中の賑わい+${d.vib}`);
  out.push(`発展の勢い+${Math.round(d.dev * m)}`);
  if (d.attach) out.push(`地域の愛着+${r1(d.attach * m)}`);
  if (d.fans) out.push(`ファン+${r1(d.fans * m)}`);
  if (d.pop) out.push(`人気+${r1(d.pop * m)}`);
  if (d.acc) out.push(`アクセス+${d.acc}（ずっと）`);
  if (d.rev) out.push(`収入 約${fmtOku(d.rev * m)}`);
  return `<div class="evfx">${out.join('　')}</div>`;
}
function townEventsView() {
  const tw = G.town; const evs = tw.events || [];

  const list = Object.entries(TOWN_EVENTS).map(([k, d]) => {
    const c = eventCanHost(k); const m = eventMult(k); const on = evs.some(e => e.k === k);
    const when = [d.months ? d.months.join('・') + '月' : '通年', d.off ? 'オフ限定' : '', `${d.wk}週間`].filter(Boolean).join('・');
    return `<div class="evrow ${on ? 'on' : ''}${hasArt('ev_' + k) ? ' pic' : ''}">${hasArt('ev_' + k) ? art('ev_' + k, { h: 'thumb' }) : `<div class="ei">${d.i}</div>`}<div><b>${d.n}</b> <span class="small muted">${fmtOku(d.cost)}・${when}</span><div class="small muted">${d.d}</div>${evEffects(d, m)}</div>
      <button class="btn sm pri" data-a="hostEv" data-k="${k}" ${c.ok ? '' : 'disabled'}>開催する</button>${c.ok ? '' : `<div class="why">${esc(c.why)}</div>`}</div>`;
  }).join('');
  const log = (tw.evLog || []).slice(0, 8);
  const logHtml = log.length ? `<ul class="tasks">${log.map(l => `<li><span>${TOWN_EVENTS[l.k].i} ${TOWN_EVENTS[l.k].n}</span><span class="small muted">${l.y}年${l.m}月・約${fmtPeople(l.visit)}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">まだ開催していません。</p>';
  return `<div class="grid g2 evgrid"><div class="stack">${panel('開催できるイベント', `<div class="lot">${list}</div>`)}</div>
    <div class="stack">${panel('開催中', running)}${panel('発展の勢いと街の段階', devHtml)}${panel('これまでのイベント', logHtml, { flush: !!log.length })}</div></div>`;
}
function bldEffects(d, m) {
  const L = { acc: 'アクセス', vib: '賑わい', pop: '住民', attach: '地域の愛着', fans: 'ファン', food: '飲食売上', goods: 'グッズ売上', heal: '故障回復', sat: '満足度', popw: '人気' };
  const out = [];
  for (const k in L) if (d[k]) out.push(`${L[k]}+${k === 'food' || k === 'goods' || k === 'heal' ? Math.round(d[k] * m * 100) + '%' : k === 'popw' ? '' : r1(d[k] * m)}`);
  if (d.rev) out.push(`収入${fmtOku(d.rev * m)}/週`);
  if (d.offrev) out.push(`オフ収入${fmtOku(d.offrev * m)}/週`);
  if (d.game) out.push(`試合日${fmtOku(d.game * m)}`);
  if (d.academy) out.push('地元の有望株が増える');
  return `<div class="small" style="color:var(--ball)">${out.join('　')}</div>`;
}
