/* 通算記録の節目。大台（MS_BIG 以上）は演出と記念イベントつき */
const MILESTONES = { hr: [100, 200, 300, 400, 500, 600], h: [1000, 1500, 2000, 2500, 3000], sb: [200, 300, 400], w: [100, 150, 200, 250], sv: [100, 200, 250, 300, 400], so: [1000, 1500, 2000, 2500, 3000], hld: [100, 200, 300] };
const MS_BAT = { hr: 1, h: 1, sb: 1 };
const MS_BIG = { hr: 400, h: 2000, sb: 400, w: 200, sv: 250, so: 2000, hld: 300 };
const MS_NEAR = { hr: 3, h: 10, sb: 3, w: 1, sv: 3, so: 15, hld: 3 };
const MS_NAME = { hr: '本塁打', h: '安打', sb: '盗塁', w: '勝', sv: 'セーブ', so: '奪三振', hld: 'ホールド' };
const MS_UNIT = { hr: '本', h: '本', sb: '個', w: '勝', sv: '', so: '', hld: '' };
function msLabel(key) { const k = key.replace(/[0-9]+$/, ''); const m = key.slice(k.length); return MS_NAME[k] ? '通算' + m + MS_NAME[k] : ''; }
/* ゲーム開始前に越えていた節目は、達成済みにしておく */
function markPastMilestones(p) { p.ms = p.ms || {}; for (const k in MILESTONES) for (const m of MILESTONES[k]) if ((p.car[k] || 0) >= m) p.ms[k + m] = p.ms[k + m] || 'pre'; }
function milestoneCheck(res) {
  const ids = new Set(res.bp.concat(res.pp.map(x => x.id)));
  for (const id of ids) {
    const p = P_(id); if (!p) continue;
    for (const k in MILESTONES) {
      if (!!MS_BAT[k] === isP(p)) continue;
      const tot = (p.car[k] || 0) + (p.st[k] || 0);
      for (const m of MILESTONES[k]) {
        const key = k + m;
        if (tot < m || (p.ms && p.ms[key])) continue;
        p.ms = p.ms || {}; p.ms[key] = G.year;
        const big = m >= MS_BIG[k]; const user = isUser(p.team); const nm = '通算' + m + MS_NAME[k];
        p.pop = clamp(p.pop + (big ? 6 : 3), 0, 100);
        if (user || big || !LG.mlb || m >= MILESTONES[k][1]) addNews('record', `${tShort(p.team)}の${p.name}が${nm}を達成`, { important: user || big, tid: p.team, note: user ? (big ? 'hi' : true) : false, pid: p.id });
        if (!user) continue;
        uT().pop = clamp(uT().pop + (big ? 1.5 : 0.5), 0, 99);
        goodsBuzz(big ? 3 : 2, big ? 0.3 : 0.12);
        if (big) {
          G.celeQ.push({ art: 'feat', kicker: '偉業達成', title: `${p.name}、${nm}`, sub: `${p.age}歳・プロ${Math.max(1, G.year - (p.join || G.year) + 1)}年目の大台`, body: 'チームメイトから花束が贈られ、スタンドからは大きな拍手。記念グッズを求めるファンが球場に集まっています。', pid: p.id });
          queueEvent('msCele', { pid: p.id, name: p.name, label: nm });
        }
      }
    }
  }
}
/* 大台が近づいたら知らせる（自球団）。記録の瞬間を見ようと観客が増える */
function msCountdown(p) {
  const c = careerOf(p);
  for (const k in MILESTONES) {
    if (!!MS_BAT[k] === isP(p)) continue;
    for (const m of MILESTONES[k]) {
      if (m < MS_BIG[k] || (p.ms && p.ms[k + m])) continue;
      const need = m - (c[k] || 0);
      if (need > 0 && need <= MS_NEAR[k]) {
        p.cd = p.cd || {}; const key = 'ms' + k + m;
        if (!p.cd[key]) { p.cd[key] = 1; notify('record', `${p.name}、通算${m}${MS_NAME[k]}まであと${need}${MS_UNIT[k]}。大台の瞬間を見ようと注目が集まっています`, { pid: p.id, note: 'hi', go: 'roster' }); crowdBuzz(2, 0.08); }
      }
      break;
    }
  }
}

function maybeRandomEvent() {
  if (G.pending.length >= 2 || !chance(0.16)) return;
  const ks = Object.keys(EVENTS).filter(k => EVENTS[k].w > 0 && EVENTS[k].cond() && !(G.evCool[k] > 0));
  if (!ks.length) return;
  const k = wpick(ks, x => EVENTS[x].w);
  const data = EVENTS[k].prep ? EVENTS[k].prep() : {};
  queueEvent(k, data);
  G.evCool[k] = 20;
}
function resolveEvent(i, ci) {
  const e = G.pending[i]; if (!e) return '';
  const def = EVENTS[e.id]; const c = def.ch[ci] || def.ch[def.ch.length - 1];
  const msg = c.f(e.data) || '';
  addNews('event', `${def.t}：${c.l}。${msg}`, { tid: G.user.tid });
  G.pending.splice(i, 1);
  return msg;
}
function eventsWeekly() {
  for (const k in G.evCool) if (G.evCool[k] > 0) G.evCool[k]--;
  for (const e of G.pending) e.age++;
  // 2週間放置したイベントは無難な選択で自動処理
  for (let i = G.pending.length - 1; i >= 0; i--) if (G.pending[i].age >= 3) { const def = EVENTS[G.pending[i].id]; resolveEvent(i, def.ch.length - 1); }
  if (G.flags.goodsWeeks > 0) { G.flags.goodsWeeks--; if (G.flags.goodsWeeks === 0) G.flags.goodsBoost = 0; }
  if (G.flags.buzzW > 0) { G.flags.buzzW--; if (G.flags.buzzW === 0) G.flags.buzz = 0; }
  maybeRandomEvent();
  maybeTradeOffer();
}
function maybeTradeOffer() {
  if (!tradeOpen() || !chance(0.05) || G.pending.some(e => e.id === 'tradeOffer')) return;
  const ut = G.user.tid;
  const mine = shihai(ut).filter(p => { const v = pVal(p); return v > 120 && v < 520 && p.injW === 0; });
  if (!mine.length) return;
  const want = pick(mine);
  const T = pick(G.teams.filter(t => t.id !== ut));
  const target = pVal(want, T.id);
  const cands = shihai(T.id).filter(p => p.injW === 0 && isP(p) !== isP(want) || (p.injW === 0 && p.pos !== want.pos)).filter(p => { const v = pVal(p, T.id); return v > target * 0.85 && v < target * 1.1; });
  if (!cands.length) return;
  const give = pick(cands);
  queueEvent('tradeOffer', { tid: T.id, want: want.id, give: give.id });
}

  cycle: { n: 'サイクルヒット', big: true }, hr3: { n: '1試合3本塁打' }, h5: { n: '1試合5安打' }, k15: { n: '1試合15奪三振' }, sayogs: { n: 'サヨナラ満塁本塁打' }
};
const RET_POOL = [1, 3, 8, 10, 11, 14, 16, 18, 19, 21, 23, 27, 34, 41, 44, 51, 55];
const TITLE_NAMES = ['首位打者', '本塁打王', '打点王', '盗塁王', '最多安打', '最高出塁率', '最優秀防御率', '最多勝', '最多奪三振', '最多セーブ', '最優秀中継ぎ'];

function recFmt(k, v, car) { const d = car ? CAR_DEFS[k] : REC_DEFS[k]; if (!d) return String(v); return d.fmt ? d.fmt(v) : comma(v) + (d.u || ''); }
function histYears(a, b) { const y = G.year; return ri(Math.min(a, b), Math.max(a, b)); }

/* ---------- ゲーム開始時の歴史（歴代記録・殿堂・永久欠番） ---------- */
function seedHistory(keepNumbers) {
  const y = G.year;
  G.recs = { lg: {}, tm: {}, car: {}, feats: [] };
  const nt = G.teams.length - 1;
  for (const k in REC_SEED_LG) G.recs.lg[k] = { v: REC_SEED_LG[k], name: genJpName(), tid: ri(0, nt), y: histYears(y - (LG.mlb ? 110 : 75), y - 8), seed: true };
  for (const k in REC_SEED_CAR) G.recs.car[k] = { v: REC_SEED_CAR[k], name: genJpName(), tid: ri(0, nt), y: histYears(y - (LG.mlb ? 90 : 60), y - 10), seed: true };
  for (const T of G.teams) {
    const r = {};
    for (const k in REC_SEED_TM) { const [a, b] = REC_SEED_TM[k]; r[k] = { v: REC_DEFS[k].rate ? Math.round(rf(a, b) * 1000) / 1000 : ri(a, b), name: genJpName(), tid: T.id, y: histYears(y - 70, y - 3), seed: true }; }
    G.recs.tm[T.id] = r;
  }
  G.hof = { members: seedHof(), ballot: [], last: null };
  G.retNums = {};
  for (const T of G.teams) {
    const used = keepNumbers ? new Set(roster(T.id).map(p => p.num)) : new Set();
    const n = wpick([0, 1, 2, 3], x => [20, 40, 28, 12][x]); const list = [];
    for (const num of shuffle(RET_POOL.slice())) { if (list.length >= n) break; if (used.has(num)) continue; list.push({ num, name: genJpName(), pos: pick(['P', 'P', 'C', '1B', '2B', '3B', 'SS', 'OF', 'OF']), y: histYears(y - 60, y - 5), seed: true }); }
    G.retNums[T.id] = list.sort((a, b) => a.num - b.num);
  }
}
function seedHof() {
  const out = []; const y = G.year;
  const n = LG.mlb ? ri(30, 38) : ri(14, 18);
  for (let i = 0; i < n; i++) {
    const kind = wpick(['bat', 'sp', 'rp'], k => ({ bat: 55, sp: 35, rp: 10 })[k]);
    const end = histYears(y - 60, y - 6), yrs = ri(15, 22);
    let line, pos;
    if (kind === 'bat') { const h = LG.mlb ? ri(2300, 3600) : ri(1850, 2950), hr = LG.mlb ? ri(180, 690) : ri(140, 560); line = `通算${comma(h)}安打 ${hr}本塁打 打率${fmtAvg(rf(0.278, 0.322))}`; pos = pick(['C', '1B', '2B', '3B', 'SS', 'OF', 'OF']); }
    else if (kind === 'sp') { line = `通算${LG.mlb ? ri(210, 360) : ri(180, 330)}勝 防御率${rf(2.1, 3.1).toFixed(2)} ${comma(ri(1900, 3600))}奪三振`; pos = 'P'; }
    else { line = `通算${LG.mlb ? ri(300, 600) : ri(230, 400)}セーブ 防御率${rf(1.9, 2.8).toFixed(2)}`; pos = 'P'; }
    out.push({ key: 'seed' + i, name: genJpName(), pos, team: ri(0, G.teams.length - 1), from: end - yrs + 1, to: end, y: Math.min(y - 1, end + ri(5, 12)), pct: r1(rf(76, 97)), line, seed: true });
  }
  return out.sort((a, b) => a.y - b.y);
}
/* ---------- 永久欠番 ---------- */
function retiredNums(tid) { return (G.retNums && G.retNums[tid]) || []; }
function isRetiredNum(tid, num) { return retiredNums(tid).some(r => r.num === num); }
function retireNumber(tid, info, quiet) {
  if (info.num == null || info.num < 0 || isRetiredNum(tid, info.num)) return false;
  G.retNums[tid] = retiredNums(tid).concat([{ num: info.num, name: info.name, pid: info.pid, pos: info.pos, y: G.year }]).sort((a, b) => a.num - b.num);
  const L = G.legends.find(x => (info.pid != null && x.pid === info.pid)); if (L) L.retNum = true;
  const cur = roster(tid).find(p => p.num === info.num);
  if (cur) { cur.num = -1; assignNumber(cur, tid); if (isUser(tid)) notify('contract', `${cur.name}の背番号は${numStr(cur)}に変わりました（${info.num}が永久欠番になったため）`, { pid: cur.id, go: 'roster' }); }
  if (isUser(tid)) {
    const T = uT(); T.pop = clamp(T.pop + (quiet ? 1 : 2), 0, 99); T.fans += 2;
    addNews('record', `背番号${info.num}を${info.name}の永久欠番に`, { important: true, tid, note: 'hi', go: 'records', tab: 'retnum' });
    G.celeQ.push({ art: 'retnum', kicker: `背番号${info.num}`, title: `${info.name}の背番号が永久欠番に`, sub: '球団の歴史に刻まれ、もう誰も背負うことはありません', body: 'セレモニーではファンの大きな拍手が送られました。人気とファンが増えています。' });
  } else addNews('record', `${tShort(tid)}が${info.name}の背番号${info.num}を永久欠番に`, { tid });
  return true;
}
/* 自球団の名選手のうち、まだ永久欠番にしていない人（球団史から指定できる） */
function retNumCands(tid) {
  return G.legends.filter(L => L.team === tid && L.num != null && L.num >= 0 && L.num < 100 && !L.retNum && !isRetiredNum(tid, L.num));
}

/* ---------- 記録の確認 ---------- */
function recOf(scope, k, tid) { return scope === 'tm' ? (G.recs.tm[tid] || {})[k] : G.recs[scope][k]; }
function setRecOf(scope, k, tid, r) { if (scope === 'tm') { G.recs.tm[tid] = G.recs.tm[tid] || {}; G.recs.tm[tid][k] = r; } else G.recs[scope][k] = r; }
function better(k, v, r, car) { if (!r) return true; const asc = !car && REC_DEFS[k].asc; return asc ? v < r.v : v > r.v; }
/* 記録を塗り替えたら新しい記録を返す（同じ選手が更新し続けているときは静かに数字だけ直す） */
function tryRecord(p, scope, k, v) {
  const tid = p.team; const r = recOf(scope, k, tid); const car = scope === 'car';
  if (!better(k, v, r, car)) return null;
  const mine = r && r.pid === p.id && (car || r.y === G.year);
  const nr = { v, name: p.name, tid, y: G.year, pid: p.id, prev: mine ? r.prev : r ? { v: r.v, name: r.name, y: r.y, tid: r.tid } : null };
  setRecOf(scope, k, tid, nr);
  return mine ? null : nr;
}
function goodsBuzz(w, b) { G.flags.goodsWeeks = Math.max(G.flags.goodsWeeks || 0, w); G.flags.goodsBoost = Math.max(G.flags.goodsBoost || 0, b); }
function crowdBuzz(w, b) { G.flags.buzzW = Math.max(G.flags.buzzW || 0, w); G.flags.buzz = Math.max(G.flags.buzz || 0, b); }
function recNews(p, scope, k, nr) {
  const car = scope === 'car'; const d = car ? CAR_DEFS[k] : REC_DEFS[k];
  const old = nr.prev; const user = isUser(p.team);
  const where = scope === 'tm' ? `${tShort(p.team)}の球団記録` : car ? '歴代最多' : 'リーグ記録';
  const t = `${tShort(p.team)}の${p.name}が${d.n}の${where}を更新（${recFmt(k, nr.v, car)}${old ? `。これまでは${old.name}の${recFmt(k, old.v, car)}・${old.y}年` : ''}）`;
  if (scope === 'tm') { if (user) notify('record', t, { pid: p.id, go: 'records', tab: 'recs' }); return; }
  addNews('record', t, { important: true, tid: p.team, note: user ? 'hi' : false, pid: p.id, go: 'records', tab: 'recs' });
  p.pop = clamp(p.pop + 6, 0, 100);
  if (!user) return;
  const T = uT(); T.pop = clamp(T.pop + 2, 0, 99); T.fans += 2;
  crowdBuzz(3, 0.08); goodsBuzz(3, 0.3);
  G.celeQ.push({ art: 'feat', kicker: scope === 'car' ? '歴代最多' : 'リーグ新記録', title: `${p.name}、${d.n}の新記録`, sub: `${recFmt(k, nr.v, car)}${old ? `（これまで ${recFmt(k, old.v, car)}・${old.name}）` : ''}`, body: '球場は総立ちの拍手。記録の瞬間を見ようと、しばらく観客とグッズの売上が増えます。', pid: p.id });
  queueEvent('recCele', { pid: p.id, name: p.name, label: d.n + 'の新記録' });
}
/* 毎週：記録の更新とカウントダウン（シーズン中） */
function recordsWeekly() {
  const t = curTurn(); if (t < SEASON_START || t > MAKEUP_TURN || !G.recs) return;
  for (const T of G.teams) for (const p of roster(T.id)) {
    const P = isP(p); const user = isUser(T.id);
    for (const k in REC_DEFS) {
      const d = REC_DEFS[k]; if (d.rate || (!!d.bat) === P) continue;
      const v = d.streak ? (p.hstr || 0) : d.f(p.st); if (!v) continue;
      const lg = tryRecord(p, 'lg', k, v);
      const tm = tryRecord(p, 'tm', k, v);
      if (lg) recNews(p, 'lg', k, lg); else if (tm) recNews(p, 'tm', k, tm);
      if (user && d.near) recCountdown(p, k, v);
    }
    if (user) msCountdown(p);
    if (user || ovr(p) >= 70) {
      const c = careerOf(p);
      for (const k in CAR_DEFS) { const d = CAR_DEFS[k]; if ((!!d.bat) === P || !c[k]) continue; const r = tryRecord(p, 'car', k, c[k]); if (r) recNews(p, 'car', k, r); }
    }
    if (user && !P) streakNotes(p);
  }
}
function recCountdown(p, k, v) {
  const d = REC_DEFS[k];
  for (const scope of ['lg', 'tm']) {
    const r = recOf(scope, k, p.team); if (!r || r.pid === p.id) continue;
    const need = r.v - v + 1; if (need <= 0 || need > d.near) continue;
    p.cd = p.cd || {}; const key = scope + k + G.year; if (p.cd[key]) continue;
    p.cd[key] = 1;
    notify('record', `${p.name}、${d.n}の${scope === 'lg' ? 'リーグ記録' : '球団記録'}（${recFmt(k, r.v)}）まであと${need}${d.u}。新記録の瞬間を見ようと注目が集まっています`, { pid: p.id, note: scope === 'lg' ? 'hi' : true, go: 'records', tab: 'recs' });
    if (scope === 'lg') crowdBuzz(2, 0.06);
    break;
  }
}
function streakNotes(p) {
  const s = p.hstr || 0; const steps = [15, 20, 25, 30];
  const hit = steps.filter(x => s >= x).pop();
  if (hit && (p.hsN || 0) < hit) { p.hsN = hit; notify('record', `${p.name}が${s}試合連続安打。リーグ記録は${recFmt('hstr', G.recs.lg.hstr.v)}`, { pid: p.id, note: hit >= 25 ? 'hi' : true, go: 'records', tab: 'recs' }); if (hit >= 25) crowdBuzz(1, 0.05); }
  if (!s) p.hsN = 0;
}
/* シーズン終了：打率・防御率など率の記録を確定し、連続記録などを片づける */
function seasonRecordsEnd() {
  if (!G.recs) return;
  for (const T of G.teams) for (const p of roster(T.id)) {
    for (const k of ['avg', 'era']) {
      const d = REC_DEFS[k]; if ((!!d.bat) === isP(p) || !qualified(p, d.bat ? 'bat' : 'pit')) continue;
      const v = Math.round(d.f(p.st) * 1000) / 1000;
      const lg = tryRecord(p, 'lg', k, v); const tm = tryRecord(p, 'tm', k, v);

    p.hstr = 0; p.hsN = 0; p.cd = null;
  }
}

/* ---------- 1試合の偉業 ---------- */
function featCheck(res, g) {
  if (!res.feats || !res.feats.length || !G.recs) return;
  for (const f of res.feats) {
    const p = P_(f.pid); if (!p) continue;
    const F = FEATS[f.k]; const opp = f.tid === g.h ? g.a : g.h;
    G.recs.feats.unshift({ y: G.year, m: G.month, w: G.week, k: f.k, pid: p.id, name: p.name, tid: f.tid, opp, v: f.v || 0 });
    if (G.recs.feats.length > 200) G.recs.feats.length = 200;
    p.feats = (p.feats || []).concat([{ y: G.year, k: f.k }]);
    const user = isUser(f.tid);
    const t = `${tShort(f.tid)}の${p.name}が${tShort(opp)}戦で${F.n}を達成${f.k === 'k15' ? `（${f.v}奪三振）` : ''}`;
    // メジャー版は30球団あるので、ほかの球団の小さな偉業はニュースにしない（偉業の記録には残る）
    if (user || F.big || !LG.mlb) addNews('record', t, { important: F.big || user, tid: f.tid, note: user ? (F.big ? 'hi' : true) : false, pid: p.id, go: 'records', tab: 'feats' });
    p.pop = clamp(p.pop + (F.big ? 6 : 2), 0, 100);
    if (!user) continue;
    uT().pop = clamp(uT().pop + (F.big ? 1.5 : 0.5), 0, 99);
    if (F.big) {
      goodsBuzz(3, 0.3);
      G.celeQ.push({ art: 'feat', kicker: `${tShort(opp)}戦`, title: `${p.name}、${F.n}`, sub: f.k === 'cycle' ? '単打・二塁打・三塁打・本塁打をすべて記録' : f.k === 'perfect' ? '27人の打者を1人も塁に出さず' : 'ひとりで9回を投げ、1本の安打も許さず', body: '翌日のスポーツ紙は一面で大きく報じています。記念グッズの注文が入り始めました。', pid: p.id });
      queueEvent('featCele', { pid: p.id, name: p.name, label: F.n });
    }
  }
}

/* ---------- タイトル争い（9月） ---------- */
const RACE_KEYS = [['avg', '首位打者', .006], ['hr', '本塁打王', 2], ['rbi', '打点王', 5], ['sb', '盗塁王', 3], ['era', '最優秀防御率', .25], ['w', '最多勝', 1], ['so', '最多奪三振', 8], ['sv', '最多セーブ', 2]];
function titleRaceNotes() {
  const ut = G.user.tid; const lg = uT().league; const lines = [];
  for (const [k, n, m] of RACE_KEYS) {
    const l = leaders(lg, k, 3); if (l.length < 2) continue;
    const d = STAT_DEFS[k]; const f = v => d.fmt ? d.fmt(v) : v;
    const i = l.findIndex(x => x.p.team === ut); if (i < 0 || i > 1) continue;
    const gap = Math.abs(l[0].v - l[1].v);
    if (i === 0 && gap <= m) lines.push(`${n}：${l[0].p.name}が${f(l[0].v)}でトップ（2位の${tShort(l[1].p.team)}・${l[1].p.name}と${d.fmt ? f(gap) : gap}差）`);
    else if (i === 1 && gap <= m) lines.push(`${n}：${l[1].p.name}が${f(l[1].v)}で2位（トップの${tShort(l[0].p.team)}・${l[0].p.name}と${d.fmt ? f(gap) : gap}差）`);

}
/* 最終週：首位打者・最優秀防御率がかかる選手を休ませるか */
function titleSitCheck() {
  const ut = G.user.tid; const lg = uT().league;
  for (const [k, m] of [['avg', .006], ['era', .25]]) {
    const l = leaders(lg, k, 2); if (l.length < 2) continue;
    const top = l[0]; if (top.p.team !== ut || Math.abs(top.v - l[1].v) > m) continue;
    queueEvent('titleSit', { pid: top.p.id, k, name: top.p.name, v: top.v, v2: l[1].v, rival: l[1].p.name });

}
function benched(p) { return p.sit === G.year && curTurn() <= MAKEUP_TURN; }
/* タイトルの表彰（シーズン終了時） */
function titleCelebrate() {

  for (const k in T[uT().league]) { const t = T[uT().league][k]; for (const id of t.ids) { const p = P_(id); if (p && p.team === ut) mine.push({ p, n: t.n }); } }

  queueEvent('titleCele', { pids: mine.map(x => x.p.id), text: names.join('、') });

/* ---------- 引退表明と引退試合 ---------- */
function isLegendNow(p) { return isLegend(p, careerOf(p)); }

  for (const T of G.teams) for (const p of roster(T.id)) {
    if (p.age < 33 || p.retAnn) continue;
    const lgd = isLegendNow(p);
    if (!(lgd || p.pop >= 40 || p.svc >= 12)) continue;

    p.retAnn = G.year;

}

/* ---------- 野球殿堂（毎年1月に記者投票） ---------- */
function legendKey(L) { return L.pid != null ? 'p' + L.pid : L.name + '_' + L.y; }
function hofScore(L) {
  const c = L.c || {};
  if (LG.mlb) return (L.war || 0) * 1.4 + (c.h >= 3000 ? 24 : c.h >= 2500 ? 9 : 0) + (c.hr >= 500 ? 24 : c.hr >= 400 ? 10 : c.hr >= 300 ? 3 : 0) + (c.w >= 300 ? 26 : c.w >= 250 ? 12 : c.w >= 200 ? 5 : 0) +
    (c.sv >= 400 ? 18 : c.sv >= 300 ? 7 : 0) + (c.so >= 3000 ? 10 : 0) + (L.awards || 0) * 1.3 + (L.titles || 0) * 2 + (L.feats || 0) * 2;
  return (L.war || 0) * 1.6 + (c.h >= 2000 ? 18 : c.h >= 1500 ? 6 : 0) + (c.hr >= 500 ? 22 : c.hr >= 400 ? 14 : c.hr >= 300 ? 6 : 0) + (c.w >= 200 ? 22 : c.w >= 150 ? 8 : 0) +
    (c.sv >= 250 ? 16 : c.sv >= 150 ? 5 : 0) + (L.awards || 0) * 1.5 + (L.titles || 0) * 2 + (L.feats || 0) * 2;
}
function hofVote() {
  if (!G.hof) return;
  const H = G.hof; const y = G.year;
  for (const L of G.legends) {
    const key = legendKey(L);
    if (L.y > y - (LG.hofWait || 3) || L.hofOut || H.members.some(m => m.key === key) || H.ballot.some(b => b.key === key)) continue;
    H.ballot.push({ key, L, yrs: 0, pct: 0 });
  }
  const res = [];
  for (const b of H.ballot.slice()) {
    b.yrs++;
    b.pct = r1(clamp((hofScore(b.L) - 30) * 1.3 + (b.yrs - 1) * 2.5 + rn(0, 3), 0, 99.5));

}
/* 古いセーブを今の仕組みに合わせる */
function migrateSave() {

  if (G.user) { if (G.user.noteStop == null) G.user.noteStop = true; if (G.user.noteToast == null) G.user.noteToast = true; if (G.user.osNote == null) G.user.osNote = false; }
  const all = Object.values(G.players).concat(G.prospects || [], G.foreign || [], G.mlbAway.map(m => m.p));
  // 球速の水準をリーグに合わせる前のセーブ（メジャー版は日本より速い）

}
function saveSlot(slot) {

/* =========================================================
   メジャー版の決まりごと
   日程（162試合）・地区順位・ポストシーズン（12球団）・年俸（調停とFA）・ぜいたく税・
   ドラフトの指名順と契約金・海外選手・選手の生成
   ========================================================= */

/* ---------- 日程：3連戦×54カード＝162試合 ----------
   リーグ内総当たり2周（15カード×2）＋地区内総当たり3周（5カード×3）＋インターリーグ9カード。
   奇数で余った球団どうしはインターリーグのカードを組む。どのカードも30球団が一斉に戦う */
function rrOdd(ids) {
  const arr = ids.concat([-1]); const n = arr.length; const out = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = []; let bye = null;
    for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; if (a < 0) bye = b; else if (b < 0) bye = a; else pairs.push([a, b]); }
    out.push({ pairs, bye });
    arr.splice(1, 0, arr.pop());
  }
  return out;
}
function genScheduleMLB() {
  const lgIds = lg => G.teams.filter(t => t.league === lg).map(t => t.id);
  const divIds = (lg, d) => G.teams.filter(t => t.league === lg && t.div === d).map(t => t.id);
  const rounds = [];
  for (let c = 0; c < 2; c++) {
    const R = [rrOdd(shuffle(lgIds(0))), rrOdd(shuffle(lgIds(1)))];
    for (let r = 0; r < R[0].length; r++) rounds.push(R[0][r].pairs.concat(R[1][r].pairs, [[R[0][r].bye, R[1][r].bye]]));
  }
  for (let c = 0; c < 3; c++) {
    const D = [0, 1].map(lg => [0, 1, 2].map(d => rrOdd(shuffle(divIds(lg, d)))));
    for (let r = 0; r < 5; r++) {
      const pairs = [];
      for (let lg = 0; lg < 2; lg++) for (let d = 0; d < 3; d++) pairs.push(...D[lg][d][r].pairs);
      for (let d = 0; d < 3; d++) pairs.push([D[0][d][r].bye, D[1][(d + r + c) % 3][r].bye]);
      rounds.push(pairs);
    }
  }
  const L0 = shuffle(lgIds(0)), L1 = shuffle(lgIds(1));
  const shifts = shuffle(Array.from({ length: 15 }, (_, i) => i)).slice(0, 9);
  for (const k of shifts) rounds.push(L0.map((a, i) => [a, L1[(i + k) % 15]]));
  shuffle(rounds);
  // 同じ相手とのカードが続かないように並べ替える
  const key = p => Math.min(p[0], p[1]) * 100 + Math.max(p[0], p[1]);
  for (let it = 0; it < 200; it++) {
    let bad = -1;
    for (let i = 1; i < rounds.length && bad < 0; i++) { const s = new Set(rounds[i - 1].map(key)); if (rounds[i].some(p => s.has(key(p)))) bad = i; }
    if (bad < 0) break;
    const j = ri(0, rounds.length - 1); const t = rounds[bad]; rounds[bad] = rounds[j]; rounds[j] = t;
  }
  // ホームとビジター：同じ相手とは交互、初対戦はホームの少ない側
  const home = {}; for (const T of G.teams) home[T.id] = 0;
  const last = {};
  const series = [];
  for (const rd of rounds) {
    const row = [];
    for (const [a, b] of rd) {
      const k = key([a, b]);
      let h;
      if (last[k] != null) h = last[k] === a ? b : a;
      else h = home[a] < home[b] ? a : home[b] < home[a] ? b : (chance(0.5) ? a : b);
      last[k] = h; home[h]++;
      row.push({ h, a: h === a ? b : a });
    }
    series.push(row);
  }
  for (let it = 0; it < 6; it++) {
    for (const row of series) for (const s of row) {
      if (home[s.h] > 27 && home[s.a] < 27) { home[s.h]--; home[s.a]++; const t = s.h; s.h = s.a; s.a = t; }
    }
  }
  // 162日＋休み6日（オールスター休みを含む）＝24週
  const OFF = new Set([24, 59, 105, 106, 107, 139]);
  const days = []; let si = 0, gi = 0;
  for (let d = 0; d < 24 * 7; d++) {
    if (OFF.has(d) || si >= series.length) { days.push([]); continue; }
    days.push(series[si].map(s => ({ h: s.h, a: s.a, done: false })));
    gi++; if (gi >= 3) { gi = 0; si++; }
  }
  G.sched = { days, makeup: [], mkDays: [] };
  G.day = 0;
}

/* ---------- 地区の順位とポストシーズン進出 ---------- */
function recCmp(a, b) { return pctOf(b.rec) - pctOf(a.rec) || b.rec.w - a.rec.w || (b.rec.rs - b.rec.ra) - (a.rec.rs - a.rec.ra) || a.id - b.id; }
function grpStandings(g) {
  const ts = G.teams.filter(t => grpOf(t) === g).sort(recCmp);
  const top = ts[0].rec;
  return ts.map((t, i) => ({ t, rank: i + 1, gb: ((top.w - t.rec.w) + (t.rec.l - top.l)) / 2 }));
}
/* リーグの6シード：地区1位3球団（勝率順）＋ワイルドカード3球団 */
function mlbSeeds(lg) {
  const divW = [0, 1, 2].map(d => grpStandings(lg * 3 + d)[0].t).sort(recCmp);
  const rest = G.teams.filter(t => t.league === lg && !divW.includes(t)).sort(recCmp);
  return divW.concat(rest.slice(0, 3)).map(t => t.id);
}
/* ワイルドカード争い（地区1位以外の勝率順。3位とのゲーム差つき） */
function wildCard(lg) {
  const divW = new Set([0, 1, 2].map(d => grpStandings(lg * 3 + d)[0].t.id));
  const rest = G.teams.filter(t => t.league === lg && !divW.has(t.id)).sort(recCmp);
  const third = rest[2] ? rest[2].rec : rest[0].rec;
  return rest.map((t, i) => ({ t, rank: i + 1, gb: ((third.w - t.rec.w) + (t.rec.l - third.l)) / 2 }));
}
function inPostField(tid) {
  if (G.post && G.post.field) return G.post.field.includes(tid);
  const T = G.teams[tid]; return mlbSeeds(T.league).includes(tid);
}
const SERIES_CFG = {
  cs1: { need: 2, max: 3, adv: 0, n: 'プレーオフ1st' }, cs2: { need: 4, max: 6, adv: 1, n: 'プレーオフ最終' }, gs: { need: 4, max: 8, adv: 0, n: 'グランドシリーズ' },
  wc: { need: 2, max: 3, adv: 0, n: 'ワイルドカードシリーズ', home: [1, 1, 1] }, ds: { need: 3, max: 5, adv: 0, n: '地区シリーズ', home: [1, 1, 0, 0, 1] },
  lcs: { need: 4, max: 7, adv: 0, n: 'リーグ優勝決定シリーズ', home: [1, 1, 0, 0, 0, 1, 1] }, ws: { need: 4, max: 7, adv: 0, n: 'ワールドシリーズ', home: [1, 1, 0, 0, 0, 1, 1] }
};
function startPostMLB() {
  const seeds = [mlbSeeds(0), mlbSeeds(1)];
  const divChamp = [];
  for (let g = 0; g < 6; g++) divChamp.push(grpStandings(g)[0].t.id);
  G.post = { stage: 'wc', series: [], lgChamp: [], divChamp, seeds, field: seeds[0].concat(seeds[1]), champ: null, mvp: null };
  for (let lg = 0; lg < 2; lg++) { const s = seeds[lg]; G.post.series.push(mkSeries('wc', lg, s[2], s[5]), mkSeries('wc', lg, s[3], s[4])); }
}
function seedOf(lg, tid) { return G.post.seeds[lg].indexOf(tid); }
function advancePostMLB(turn) {
  const P = G.post; const fin = (k, lg) => P.series.filter(x => x.kind === k && x.lg === lg);
  if (turn === 36) {
    playSeries('wc');
    for (let lg = 0; lg < 2; lg++) {
      const s = P.seeds[lg]; const w36 = fin('wc', lg).find(x => x.hi === s[2]).winner, w45 = fin('wc', lg).find(x => x.hi === s[3]).winner;
      P.series.push(mkSeries('ds', lg, s[0], w45), mkSeries('ds', lg, s[1], w36));
    }
    P.stage = 'ds';
  } else if (turn === 37) {
    playSeries('ds');
    for (let lg = 0; lg < 2; lg++) {
      const w = fin('ds', lg).map(x => x.winner).sort((a, b) => seedOf(lg, a) - seedOf(lg, b));
      P.series.push(mkSeries('lcs', lg, w[0], w[1]));
    }
    P.stage = 'lcs';
  } else if (turn === 38) {
    playSeries('lcs');
    P.lgChamp = [0, 1].map(lg => fin('lcs', lg)[0].winner);
    for (const tid of P.lgChamp) {
      const T = G.teams[tid]; T.titles.lg = (T.titles.lg || 0) + 1; T.pop = clamp(T.pop + 1.5, 0, 99); T.popBonus = (T.popBonus || 0) + 4;
      if (isUser(tid)) { book('rev', 'prize', 10000); addNews('post', `${tName(tid)}が${LEAGUES[T.league]}優勝！ ワールドシリーズへ進みます`, { important: true, tid, note: 'hi' }); }
    }
    const [a, b] = P.lgChamp; const hi = recCmp(G.teams[a], G.teams[b]) <= 0 ? a : b;
    P.series.push(mkSeries('ws', -1, hi, hi === a ? b : a));
    P.stage = 'ws';
  } else if (turn === 39) {
    playSeries('ws');
    const s = P.series.find(x => x.kind === 'ws');
    P.champ = s.winner; P.mvp = s.mvp; P.stage = 'done';
    const champ = G.teams[s.winner];
    champ.titles.gs = (champ.titles.gs || 0) + 1;
    champ.pop = clamp(champ.pop + 2, 0, 99); champ.popBonus = (champ.popBonus || 0) + 6;
    addNews('post', `${tName(s.winner)}がワールドシリーズを制覇！ シリーズMVPは${s.mvp != null && P_(s.mvp) ? P_(s.mvp).name : '―'}`, { important: true, tid: s.winner });
    if (isUser(s.winner)) { book('rev', 'prize', 20000); G.flags.gsWin = (G.flags.gsWin || 0) + 1; G.flags.goodsWeeks = 6; G.flags.goodsBoost = 0.5; }
    else if (isUser(s.hi) || isUser(s.lo)) book('rev', 'prize', 8000);
  }
}
/* そのチームのポストシーズンの結果（'ws'優勝・'pen'リーグ優勝・'lcs'・'ds'・'wc'・null） */
function postResult(tid) {
  const P = G.post; if (!P || !P.field || !P.field.includes(tid)) return null;
  if (P.champ === tid) return 'champ';
  if (P.lgChamp.includes(tid)) return 'pen';
  for (const k of ['lcs', 'ds', 'wc']) if (P.series.some(s => s.kind === k && (s.hi === tid || s.lo === tid))) return k;
  return 'wc';

/* ---------- 年俸：サービスタイム（メジャー在籍年数）で決まる ----------
   0〜2年：最低年俸に近い額で球団が更新／3〜5年：年俸調停／6年以上：FA */
function valueSalaryMLB(o) { const usd = 0.78 + 52 / (1 + Math.exp(-(o - 79) / 6.5)); return usd * 1e6 / 300; }
function svcClass(p) { if (p.lv === 3) return 'minor'; if (p.intlFA) return 'fa'; return p.svc >= 6 ? 'fa' : p.svc >= (LG.arbYears || 3) ? 'arb' : 'pre'; }
const SVC_LABEL = { minor: 'マイナー契約', pre: '調停権なし', arb: '年俸調停', fa: 'FA権' };
function ageFactorMLB(age) { return age <= 31 ? 1 : age === 32 ? 0.95 : age === 33 ? 0.88 : age === 34 ? 0.8 : 0.7; }
function preArbSal(p) { return roundSal(MIN_SAL * (1 + 0.05 * Math.min(p.svc, 3)) + Math.max(0, ovr(p) - 68) * 60); }
function salByWarMLB(w) { return MIN_SAL + Math.max(0, w) * 26700 + Math.max(0, w - 4) * 8000; }
/* 調停の相場（成績と能力から） */
function arbFair(p) {
  const o = ovr(p); const base = seasonPlayed(p) ? salByWarMLB(war(p)) * 0.55 + valueSalaryMLB(o) * 0.45 : valueSalaryMLB(o) * 0.8;
  const k = [0.30, 0.45, 0.62][clamp(p.svc - 3, 0, 2)];
  return Math.max(base * k, p.sal * 0.95, MIN_SAL * 1.15);
}
function marketSalaryMLB(p) {
  if (p.lv === 3) return MIN_SAL_IK;
  const c = svcClass(p);
  if (c === 'pre') return preArbSal(p);
  if (c === 'arb') return roundSal(Math.max(MIN_SAL * 1.15, valueSalaryMLB(ovr(p)) * [0.30, 0.45, 0.62][clamp(p.svc - 3, 0, 2)]));
  let s = valueSalaryMLB(ovr(p)) * ageFactorMLB(p.age);
  if (p.team >= 0 && G.teams[p.team]) s *= 0.92 + G.teams[p.team].market * 0.03;
  return roundSal(Math.max(MIN_SAL, s));
}
/* FAで求める年数 */
function faAskYears(p) {
  const o = ovr(p), a = p.age;
  if (a >= 35) return 1;
  if (a >= 33) return ri(1, 2);
  if (a >= 31) return ri(2, 4);
  if (a >= 28) return o >= 78 ? ri(5, 7) : ri(3, 5);
  return o >= 80 ? ri(7, 10) : o >= 70 ? ri(5, 7) : ri(2, 4);
}

/* ---------- ぜいたく税 ---------- */
function luxTaxCalc(pay, yrsOver) {
  const L = LG.lux; if (!L || pay <= L.th) return 0;
  const over = pay - L.th;
  let t = over * L.rates[Math.min(yrsOver, L.rates.length - 1)];
  for (const [th, r] of L.sur) if (over > th) t += (over - th) * r;
  return Math.round(t);
}
function luxTaxYearEnd() {
  if (!LG.mlb) return;
  const hits = [];
  for (const T of G.teams) {
    const pay = teamPayroll(T.id);
    const tax = luxTaxCalc(pay, T.luxY || 0);
    if (tax > 0) {
      T.luxY = (T.luxY || 0) + 1; hits.push(T.id);
      if (isUser(T.id)) { book('exp', 'lux', tax); notify('biz', `年俸総額${fmtOku(pay)}がぜいたく税の基準額（${fmtOku(LG.lux.th)}）を超えたため、ぜいたく税${fmtOku(tax)}を支払いました（${T.luxY}年連続）`, { go: 'finance', note: 'hi' }); }
    } else T.luxY = 0;
  }
  if (hits.length) addNews('league', `今季のぜいたく税の対象：${hits.map(tShort).join('、')}`, {});

/* ---------- ドラフト：前年の成績の逆順。プレーオフに出なかった球団で上位6つを抽選 ---------- */
const LOTTERY_ODDS = [16.5, 16.5, 16.5, 13.25, 10, 7.5, 5.5, 3.9, 2.7, 1.8, 1.4, 1.1, 0.9, 0.7, 0.5, 0.4, 0.2, 0.1];
function mlbDraftOrder(byPower) {
  let teams;
  if (byPower) teams = G.teams.slice().sort((a, b) => teamPower(a.id).total - teamPower(b.id).total || a.id - b.id);
  else teams = G.teams.slice().sort((a, b) => recCmp(b, a));
  const field = byPower ? [] : ((G.post && G.post.field) || []);
  const non = teams.filter(t => !field.includes(t.id)); const po = teams.filter(t => field.includes(t.id));
  const rk = { wc: 0, ds: 1, lcs: 2, pen: 3, champ: 4 };
  if (!byPower) po.sort((a, b) => (rk[postResult(a.id)] || 0) - (rk[postResult(b.id)] || 0) || recCmp(b, a));
  const pool = non.map((t, i) => ({ t, w: LOTTERY_ODDS[Math.min(i, LOTTERY_ODDS.length - 1)] }));
  const top = [];
  for (let k = 0; k < 6 && pool.length; k++) { const x = wpick(pool, y => y.w); top.push(x.t); pool.splice(pool.indexOf(x), 1); }
  const order = top.concat(pool.map(x => x.t), po).map(t => t.id);
  return { y: G.year + (byPower ? 0 : 1), order, lot: top.map(t => t.id) };
}
/* 指名順位ごとの契約金の目安（ドル→内部の単位） */
function mlbSlot(n) {
  const usd = n <= 30 ? 2.6e6 + 7.9e6 * Math.exp(-(n - 1) / 7) : Math.max(1.6e5, 1.9e6 * Math.exp(-(n - 31) / 55));
  return usd / 300;
}

/* ---------- 選手の生成 ---------- */
function natPick() { return wpick(['US', 'LAT', 'JP', 'KR', 'TW'], x => ({ US: 70, LAT: 26, JP: 2.5, KR: 1, TW: 0.5 })[x]); }
function nameFor(nat) { return nat === 'JP' ? genJpReal() : nat === 'KR' || nat === 'TW' ? genAsName(nat) : genUsName(nat); }
function setNat(p, nat) { NAMESET.delete(p.name); p.nat = nat; p.name = nameFor(nat); if (nat === 'LAT') p.home = 5; }
function genRosterMLB(T) {
  const shift = T.shift * 0.5 + rf(-1.5, 1.5);
  const add = (pos, pt, o) => {
    const age = o.age || sampleAge(); const gt = wpick([0, 1, 2], x => [25, 50, 25][x]);
    const P = clamp(rn(o.mu || 58 + shift, o.sd || 10), 30, 93);
    const cur = clamp(curFromPeak(P, age, gt), 18, 92);
    const pot = age < GT[gt].g ? P : cur;
    const p = makePlayer({ pos, pt, age, cur, pot, gt, from: pick(['高校', '大学', '大学', '短大', '海外']) });
    setNat(p, natPick());
    p.svc = o.lv === 3 ? 0 : clamp(Math.round((age - 22 - ri(0, 2)) * (cur >= 55 ? 1 : 0.5)), 0, 18);
    p.pop = clamp(Math.round((ovr(p) - 50) * 1.6 + p.svc * 1.5 + rn(0, 8)), 0, 95);
    p.join = G.year - Math.max(0, Math.min(p.svc + ri(0, 3), age - 18));
    G.players[p.id] = p;
    addToTeam(p, T.id, o.lv || 2);
    p.orig = chance(0.55) ? T.id : ri(0, G.teams.length - 1);
    p.sal = marketSalaryMLB(p);
    p.yrs = 1;
    if (svcClass(p) === 'fa' && ovr(p) >= 64) p.yrs = ri(1, p.age <= 30 ? 6 : 3);
    else if (svcClass(p) === 'arb' && ovr(p) >= 74 && chance(0.4)) p.yrs = ri(2, 5);
    synthCareer(p);
    markPastMilestones(p);
    return p;
  };
  for (let i = 0; i < 9; i++) add('P', 'SP', {});
  for (let i = 0; i < 12; i++) add('P', 'RP', {});
  const bp = { C: 3, '1B': 2, '2B': 2, '3B': 2, SS: 3, OF: 7 };
  for (const pos in bp) for (let i = 0; i < bp[pos]; i++) add(pos, '', {});
  for (let i = 0; i < 24; i++) {
    const p = add(i < 10 ? 'P' : pick(['C', '2B', 'SS', 'OF', '3B', '1B', 'OF']), i < 4 ? 'SP' : 'RP', { age: ri(18, 24), mu: 50, sd: 9, lv: 3 });
    p.svc = 0; p.sal = MIN_SAL_IK; p.yrs = ri(1, 5); p.pop = ri(0, 10);
  }

/* 海外のプロ選手（日本・韓国・台湾・キューバなど）。日本と韓国はポスティングで移籍金がかかる */

/* ---------- 契約更改・延長・FA（メジャー版） ---------- */
/* 1年あたりの妥当な額 */
function mlbTarget(p) {
  const c = svcClass(p);
  if (c === 'minor') return MIN_SAL_IK;
  if (c === 'pre') return preArbSal(p);
  if (c === 'arb') return arbFair(p);
  const o = ovr(p); const base = seasonPlayed(p) ? salByWarMLB(war(p)) * 0.5 + valueSalaryMLB(o) * 0.5 : valueSalaryMLB(o);
  return base * ageFactorMLB(p.age) * (p.team >= 0 && G.teams[p.team] ? 0.92 + G.teams[p.team].market * 0.03 : 1);
}
function calcDemandMLB(p) {
  const c = svcClass(p); const t = mlbTarget(p);
  let d = c === 'pre' || c === 'minor' ? t : t * 1.08 * (PERS[p.per].demand || 1);
  if (p.titleRew === G.year) d *= 1.05;
  if (p.mor < 35) d *= 1.05;
  return roundSal(Math.max(d, minSal(p)));
}
function teamOfferMLB(p) { const c = svcClass(p); const t = mlbTarget(p); return roundSal(Math.max(c === 'arb' ? t * 0.92 : t * 0.95, minSal(p))); }
/* 複数年の要求（1年あたり）。保有できる年（調停まで）をこえる年はFAの相場で考える */
function demandForMLB(p, yrs, d) {
  const c = svcClass(p);
  if (c === 'fa') return d * (p.age >= 31 ? (1 - 0.03 * (yrs - 1)) : (1 + 0.01 * (yrs - 1)));
  const ctrl = clamp(LG.faYears - p.svc, 0, yrs); const faY = yrs - ctrl;
  const ctrlAvg = d * (1 + 0.28 * Math.max(0, ctrl - 1) / 2);
  const faV = valueSalaryMLB(Math.max(ovr(p), Math.round((ovr(p) + potv(p)) / 2))) * ageFactorMLB(p.age + ctrl) * 0.9;
  return Math.max(d, (ctrl * ctrlAvg + faY * faV) / yrs);
}
function aiRenewalsMLB(tid) {
  const T = G.teams[tid];
  for (const p of roster(tid)) {
    if (p.yrs > 1 || (p.ren && p.ren.st === 'signed')) continue;
    const c = svcClass(p);
    if (c === 'minor') { p.ren = { st: 'signed', sal: MIN_SAL_IK, yrs: 1 }; continue; }
    if (c === 'pre') {
      if (ovr(p) >= 72 && p.age <= 27 && chance(0.12)) { const yrs = ri(5, 8); p.ren = { st: 'signed', sal: roundSal(demandForMLB(p, yrs, mlbTarget(p))), yrs }; }
      else p.ren = { st: 'signed', sal: preArbSal(p), yrs: 1 };
      continue;
    }
    const fair = arbFair(p);
    if (c === 'arb' && ovr(p) >= 72 && p.age <= 29 && chance(0.2)) { const yrs = ri(3, 6); p.ren = { st: 'signed', sal: roundSal(demandForMLB(p, yrs, fair)), yrs }; }
    else p.ren = { st: 'signed', sal: roundSal(fair * rf(0.97, 1.03)), yrs: 1 };
  }
  // 予算オーバーなら、調停を迎える割高な選手と契約しない（ノンテンダー）
  let over = teamPayroll(tid, true) - T.payBudget;
  if (over > 0) {
    const c = roster(tid).filter(p => p.ren && p.ren.st === 'signed' && !p.ren.faNew && p.yrs <= 1 && svcClass(p) === 'arb').sort((a, b) => pVal(a, tid) / a.ren.sal - pVal(b, tid) / b.ren.sal);
    for (const p of c.slice(0, 4)) { if (over <= 0) break; over -= p.ren.sal; releasePlayer(p, true); if (ovr(p) >= 62) addNews('contract', `${tShort(tid)}が${p.name}と契約しないと発表（ノンテンダー）`, {}); }
  }
}
/* シーズン後：保有6年を過ぎて契約が切れる選手は、みなFAになる（AI球団は一部を先に引き留める） */
function declareFAMLB() {
  G.faMarket = []; G.compPending = [];
  for (const T of G.teams) for (const p of shihai(T.id)) {
    if (!faEligible(p)) continue;
    const o = ovr(p);

      const room = T.payBudget - teamPayroll(T.id, true);
      if (room > want * 0.6 && chance(0.25 + (p.per === 'loyal' ? 0.2 : 0) - (p.per === 'money' ? 0.1 : 0))) {
        const yrs = faAskYears(p); p.ren = { st: 'signed', sal: roundSal(want * rf(0.95, 1.08)), yrs }; p.intlFA = false;
        if (o >= 76) addNews('fa', `${tShort(T.id)}がFA目前の${p.name}と${yrs}年総額${fmtOku(p.ren.sal * yrs)}で再契約`, {});

    const ask = roundSal(Math.max(MIN_SAL, valueSalaryMLB(o) * ageFactorMLB(p.age) * (PERS[p.per].demand || 1) * rf(0.95, 1.1)));
    G.faMarket.push({ id: p.id, from: T.id, rank: '', ask, askYrs: faAskYears(p), offers: {}, done: false, prevSal: p.sal });

/* AI球団のFAへの提示（メジャー版）：必要な位置と予算に合う選手を数人に絞って声をかける */
function aiFABidsMLB() {
  const open = G.faMarket.filter(x => !x.done && P_(x.id));
  for (const T of shuffle(G.teams.filter(t => !isUser(t.id)))) {
    const tid = T.id;
    const mine = open.filter(f => f.offers[tid]);
    let room = T.payBudget - teamPayroll(tid, true) - sum(mine, f => f.offers[tid].sal) * 0.5;
    let slots = 2 + Math.ceil(T.market / 2) - mine.length;
    if (slots <= 0 || room <= 0) continue;
    const cand = open.filter(f => !f.offers[tid]).map(f => {
      const p = P_(f.id); const o = ovr(p); const need = faNeed(T, p);
      return { f, p, o, need, v: (o - 60) / 10 + need * 3 + (f.from === tid ? 1 : 0) + rn(0, 0.8) - (p.age >= 33 ? 0.6 : 0) };
    }).filter(x => x.o >= 58 && x.f.ask <= room * (x.o >= 72 ? 1.3 : 1)).sort((a, b) => b.v - a.v);
    for (const x of cand) {
      if (slots <= 0 || room <= 0) break;
      if (!chance(clamp((x.o - 60) / 18 + x.need + (T.market - 3) * 0.06 + (x.f.from === tid ? 0.2 : 0), 0.05, 0.85))) continue;
      const sal = roundSal(x.f.ask * rf(0.92, 1.1) * (1 + (T.market - 3) * 0.03));
      x.f.offers[tid] = { sal, yrs: clamp(x.f.askYrs + ri(-1, 1), 1, LG.maxYrs) };
      room -= sal * 0.5; slots--;
    }
  }
}

/* ---------- グラフ（SVG） ---------- */
function lineChart(series, labels, o) {
  o = o || {}; const W = o.w || 640, H = o.h || 200, pl = 52, pr = 10, pt = 10, pb = 24;
  const all = series.flatMap(s => s.v.filter(v => v != null));
  if (!all.length) return '<div class="empty">データがまだありません</div>';
  let mn = Math.min(0, ...all), mx = Math.max(...all); if (o.min != null) mn = o.min; if (mx === mn) mx = mn + 1;
  const n = labels.length; const x = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)); const y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; const yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${o.fmt ? o.fmt(v) : Math.round(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  for (const s of series) {
    const pts = s.v.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    s.v.forEach((v, i) => { if (v != null && n <= 30) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.c}"><title>${esc(labels[i])}：${o.fmt ? o.fmt(v) : v}</title></circle>`; });
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'グラフ')}" style="color:var(--ink2)">${g}</svg>` +
    (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : '');
}
function barChart(items, o) {
  o = o || {}; const W = o.w || 640, rowH = 22, H = items.length * rowH + 8, pl = o.pl || 110;
  const mx = Math.max(1, ...items.map(i => Math.abs(i.v)));
  let g = '';
  items.forEach((it, i) => {
    const yy = 4 + i * rowH; const w = Math.abs(it.v) / mx * (W - pl - 90);
    g += `<text x="${pl - 8}" y="${yy + 14}" text-anchor="end">${esc(it.l)}</text><rect x="${pl}" y="${yy + 3}" width="${Math.max(1, w)}" height="${rowH - 8}" rx="2" fill="${it.c || 'var(--lamp)'}"/><text x="${pl + w + 6}" y="${yy + 14}">${esc(it.s || '')}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'グラフ')}">${g}</svg>`;
}

/* ---------- 保存（圧縮して localStorage へ） ---------- */
const SLOT_NAMES = { auto: 'オートセーブ', 1: 'スロット1', 2: 'スロット2', 3: 'スロット3' };
function storageOK() { try { const k = '__kyudan_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } }
function b64enc(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function packStr(str) {
  if (typeof CompressionStream === 'undefined') return str;
  try { const st = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip')); return 'gz:' + b64enc(await new Response(st).arrayBuffer()); } catch (e) { return str; }
}
async function unpackStr(str) {
  if (!str.startsWith('gz:')) return str;
  const st = new Blob([b64dec(str.slice(3))]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
async function saveTo(slot) {
  try {
    const data = await packStr(serialize());
    localStorage.setItem(SAVE_KEY + slot, data);
    localStorage.setItem(SAVE_KEY + slot + '_meta', JSON.stringify({ t: Date.now(), team: tName(G.user.tid), date: nowStr(), name: G.user.name, tid: G.user.tid, mode: LG.mode }));
    return true;
  } catch (e) { return false; }
}
async function loadFrom(slot) {
  try { const s = localStorage.getItem(SAVE_KEY + slot); if (!s) return false; deserialize(await unpackStr(s)); return true; }
  catch (e) { console.error(e); return false; }
}
let autosaveWarned = false;
function autosave() { if (!G || G.gameOver) return; saveTo('auto').then(ok => { if (!ok && !autosaveWarned) { autosaveWarned = true; toast('ブラウザに保存できませんでした。「セーブ・設定」からファイルに書き出せます', 'bad'); } }); }
function anySave() { return ['auto', '1', '2', '3'].some(s => slotMeta(s)); }
function fmtTime(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

  const fresh = notesSince(since != null ? since : rep ? rep.note0 || 0 : G.noteSeq);

    if (G.post && G.post.champ === T.id && G.flags.celGs !== G.year) { G.flags.celGs = G.year; openModal('cele', { k: 'gs' }); }

    else if (LG.mlb && G.post && curTurn() === 36 && G.post.divChamp && G.post.divChamp.includes(T.id) && G.flags.celDiv !== G.year) { G.flags.celDiv = G.year; openModal('cele', { k: 'div' }); }
    if (curTurn() === 0 && G.owner.review && !G.owner.review.seen) openModal('review');
    if (curTurn() === SEASON_START && G.flags.openY !== G.year) { G.flags.openY = G.year; openModal('scene', { k: 'open' }); }
    if (curTurn() === LG.draftT && G.flags.draftY !== G.year) { G.flags.draftY = G.year; openModal('scene', { k: 'draft' }); }

    for (const it of cq.slice(quiet ? -2 : -4)) openModal('cele2', it);

ACT.ahead = el => {
  const m = el.dataset.m; closeAllModals(); renderModalRoot();
  const startT = curTurn(), startY = G.year; let n = 0; const ut = G.user.tid; const r0 = { w: uT().rec.w, l: uT().rec.l }; const seq0 = G.noteSeq || 0;
  const keyTurns = LG.mlb ? [0, 4, 11, LG.draftT, 36, 40, 44] : [0, 4, 11, 36, 39, 40, 44];
  aheadStop = false; UI.busy = true; render();
  const step = () => {
    let stop = aheadStop || G.gameOver || blockingTasks().length > 0;
    if (!stop && n > 0) {
      const t = curTurn();
      if (m === '4' && n >= 4) stop = true;
      if (m === 'event' && (G.pending.length || keyTurns.includes(t) || (G.compPending && G.compPending.length))) stop = true;
      if (m === 'season' && ((startT < MAKEUP_TURN && t >= 36) || (startT >= MAKEUP_TURN && t === 0) || G.year > startY + 1)) stop = true;
      if (m !== 'season' && G.user.noteStop && notesSince(seq0).some(x => x.pr === 'hi')) stop = true;
      if (n >= 60) stop = true;
    }
    if (stop) {
      UI.busy = null; busyHide();
      const R = uT().rec;
      const msg = `${n}週進めました` + (R.w + R.l > r0.w + r0.l ? `（${R.w - r0.w}勝${R.l - r0.l}敗）` : '');
      afterAdvance(G.weekly, true, seq0, n); toast(msg, 'good');
      return;
    }
    advanceWeek(); n++;
    busyShow(phaseLabel() + (curTurn() >= SEASON_START && curTurn() <= MAKEUP_TURN ? `　${uT().rec.w}勝${uT().rec.l}敗` : ''));
    setTimeout(step, 0);
  };
  busyShow('');
  setTimeout(step, 30);
};

/* 注目の記録：大台・連続試合安打・シーズン記録に迫る自球団の選手 */
function recWatchHtml() {
  if (!G.recs) return '';
  const t = curTurn(); const ut = G.user.tid; const items = [];
  for (const p of roster(ut)) {
    const c = careerOf(p);
    for (const k in MILESTONES) {
      if (!!MS_BAT[k] === isP(p)) continue;
      const m = MILESTONES[k].find(x => x >= MS_BIG[k] && !(p.ms && p.ms[k + x])); if (!m) continue;
      const need = m - (c[k] || 0); if (need > 0 && need <= MS_NEAR[k] * 4) items.push({ s: need / MS_NEAR[k], h: `${pLink(p)} 通算${m}${MS_NAME[k]}まで<b>あと${need}${MS_UNIT[k]}</b>` });
    }
    if (t >= SEASON_START && t <= MAKEUP_TURN) {
      if ((p.hstr || 0) >= 10) items.push({ s: 2 - p.hstr / 20, h: `${pLink(p)} <b>${p.hstr}試合連続安打</b>中（リーグ記録${recFmt('hstr', G.recs.lg.hstr.v)}）` });
      for (const k of ['hr', 'h', 'sb', 'so', 'sv']) {
        const d = REC_DEFS[k]; if ((!!d.bat) === isP(p)) continue; const r = G.recs.lg[k]; const v = d.f(p.st);
        if (r && r.pid !== p.id && v >= r.v * 0.8 && v > 0) items.push({ s: (r.v - v) / Math.max(1, r.v * 0.1), h: `${pLink(p)} ${d.n} <b>${recFmt(k, v)}</b>（リーグ記録${recFmt(k, r.v)}）` });
      }
    }
  }
  if (!items.length) return '';
  items.sort((a, b) => a.s - b.s);
  return panel('注目の記録', `<ul class="watch">${items.slice(0, 5).map(x => `<li>${x.h}</li>`).join('')}</ul>`, { act: '<button class="btn sm" data-a="go" data-v="records" data-tab="recs">記録</button>' });
}
function homeLead() {
  const t = curTurn();
  if (LG.mlb) {
    if (t <= 3) return '新しいシーズンの準備期間です。予算、中期計画、スプリングトレーニングを決めましょう。';
    if (t <= 7) return 'スプリングトレーニングで選手を鍛えています。オープン戦は3月から。';
    if (t <= 10) return 'オープン戦で開幕に向けた最終調整中。26人のメジャー登録とオーダーを確認しましょう。';
    if (t === LG.draftT) return 'オールスターとドラフトの週です。指名する選手を決めましょう。';
    if (t <= MAKEUP_TURN) return '毎週6〜7試合を戦います。トレードの期限は7月末。地区優勝かワイルドカードで、ポストシーズンを目指しましょう。';
    if (t <= 39) return '12球団によるポストシーズン。ワールドシリーズで頂点を争います。';
    if (t <= 43) return 'FA市場が開いています。保有6年を過ぎた選手はみなFAです。来季に向けた編成を進めましょう。';
    return '契約の季節です。年俸調停の選手と12月第4週までに合意しましょう。合意できなければ調停の公聴会で決まります。';
  }
  if (t <= 3) return '新しいシーズンの準備期間です。予算、中期計画、春季キャンプを決めましょう。';
  if (t <= 7) return 'キャンプで選手を鍛えています。オープン戦は3月から。';
  if (t <= 10) return 'オープン戦で開幕に向けた最終調整中。1軍の顔ぶれとオーダーを確認しましょう。';
  if (t <= MAKEUP_TURN) return '毎週6試合を戦います。故障者の入れ替えや補強（7月末まで）も考えましょう。';
  if (t <= 38) return '上位3球団によるプレーオフと、日本一を決めるグランドシリーズの期間です。';

  if (t <= 43) return '戦力外通告、FA、秋季キャンプの時期です。来季に向けた編成を進めましょう。';
  return '契約更改の季節です。12月第4週までに全選手と合意しましょう。';
}
function thisWeekGames() {
  const t = curTurn(); if (t < SEASON_START || t > SEASON_END) return '';
  const ut = G.user.tid; const w = t - SEASON_START; const out = []; const n = LG.dpw || 6;
  for (let i = 0; i < n; i++) { const d = w * n + i; const day = G.sched.days[d]; if (!day) continue; const g = day.find(x => x.h === ut || x.a === ut); if (g) out.push(`<div class="row sp" style="padding:6px 14px;border-bottom:1px solid var(--line)"><span class="small muted">${DOW[d % DOW.length]}</span><span style="flex:1;margin-left:10px">${g.h === ut ? 'vs' : '@'} ${tMark(g.h === ut ? g.a : g.h)}</span><span class="small muted">${g.h === ut ? esc(stadiumName()) : esc(stadiumNameOf(g.h))}</span></div>`); }
  return out.join('');
}
function homeLeaders() {
  const ut = G.user.tid; const ps = roster(ut);
  if (!ps.some(p => isP(p) ? p.st.outs > 0 : p.st.pa > 0)) return '';
  const bats = ps.filter(p => !isP(p) && p.st.pa >= 30).sort((a, b) => bOps(b.st) - bOps(a.st)).slice(0, 3);
  const pits = ps.filter(p => isP(p) && p.st.outs >= 30).sort((a, b) => war(b) - war(a)).slice(0, 3);
  return `<table class="t compact"><tbody>${bats.map(p => `<tr><td>${pLink(p)}</td><td class="num">${fmtAvg(bAvg(p.st))}</td><td class="num">${p.st.hr}本</td><td class="num">${p.st.rbi}点</td></tr>`).join('')}${pits.map(p => `<tr><td>${pLink(p)}</td><td class="num">防${fmtEra(pEra(p.st))}</td><td class="num">${p.st.w}勝${p.st.l}敗</td><td class="num">${p.st.sv ? p.st.sv + 'S' : p.st.hld ? p.st.hld + 'H' : p.st.so + 'K'}</td></tr>`).join('')}</tbody></table>`;
}

function honorsHtml(p) {

  for (const [n, c] of Object.entries(cnt)) out.push(`<span class="hon ${TITLE_NAMES.includes(n) ? 't' : 'a'}">${esc(n)}${c > 1 ? '×' + c : ''}</span>`);
  const top = {};
  for (const key of Object.keys(p.ms || {})) { const k = key.replace(/[0-9]+$/, ''), m = +key.slice(k.length); if (MS_NAME[k] && (!top[k] || m > top[k])) top[k] = m; }

  for (const f of p.feats || []) out.push(`<span class="hon f">${f.y} ${esc(FEATS[f.k] ? FEATS[f.k].n : f.k)}</span>`);
  if (G.recs) {

SCREENS.schedule = () => {
  const ut = G.user.tid; const list = userSchedule();
  const tab = getTab('sched', 'mine');
  if (tab === 'league') return scheduleLeague();
  const byMonth = {};
  for (const x of list) {
    const d = typeof x.d === 'number' ? x.d : null;
    const m = d != null ? Math.floor(dayTurn(d) / 4) + 1 : 9;
    (byMonth[m] = byMonth[m] || []).push(x);
  }
  const done = list.filter(x => x.g.done && !x.g.rain);
  const home = done.filter(x => x.g.h === ut);
  const att = sum(home, x => x.g.att || 0);
  const html = Object.keys(byMonth).sort((a, b) => a - b).map(m => {
    const rows = byMonth[m].map(x => {
      const g = x.g; const hm = g.h === ut; const opp = hm ? g.a : g.h;
      let res = '';
      if (g.rain) res = '<span class="faint">雨天中止</span>';
      else if (g.done) { const my = hm ? g.hs : g.as, op = hm ? g.as : g.hs; res = `<span class="wl ${my > op ? 'w' : my < op ? 'l' : 'd'}" style="width:24px;height:24px;font-size:12px">${my > op ? '勝' : my < op ? '敗' : '分'}</span> <span class="num">${my}-${op}</span>`; }
      const box = g.id != null && G.boxes[g.id] ? `<button class="btn xs" data-a="box" data-id="${g.id}">詳細</button>` : '';
      return `<tr class="${g.done ? '' : 'dim'}"><td class="small">${x.mk ? '予備日' : dayLabel(x.d)}</td><td>${hm ? 'vs' : '@'} ${tMark(opp)}</td><td class="small muted">${esc(hm ? stadiumName() : stadiumNameOf(g.h))}</td><td>${res}</td><td class="num">${g.done && hm && g.att ? comma(g.att) : ''}</td><td>${box}</td></tr>`;
    }).join('');
    return panel(m + '月', `<div class="tw"><table class="t compact"><thead><tr><th>日付</th><th>対戦</th><th>球場</th><th>結果</th><th class="num">観客</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`, { flush: true });
  }).join('');
  return `<h1 class="h1">日程・結果</h1><p class="lead">公式戦${LG.games}試合。ホーム${home.length}試合の観客は合計${fmtPeople(att)}（平均${home.length ? comma(att / home.length) : 0}人）。</p>

};

function draftPickLog(D) {

  const ordY = D && D.mlb && D.stage !== 'done' ? G.year : (G.draftOrder ? G.draftOrder.y : G.year);
  const lot = G.draftOrder && G.draftOrder.y === ordY ? G.draftOrder.lot || [] : [];
  const orderHtml = ord.length ? panel(`${ordY}年の指名順`, `<div class="dorder">${ord.map((tid, i) => `<span class="${tid === ut ? 'me' : ''}${lot.includes(tid) && i < 6 ? ' lot' : ''}"><b>${i + 1}</b>${esc(tShort(tid))}</span>`).join('')}</div><p class="small muted" style="margin:8px 0 0">ポストシーズンに出なかった球団の中で上位6つを抽選します（成績の悪い球団ほど当たりやすい）。あとは成績の低い順で、どの巡目も同じ順番です。</p>`) : '';

      (last ? last + '<div style="height:14px"></div>' : '') + orderHtml + '<div style="height:14px"></div>' +
      panel(`指名候補（★） ${marked.length}人`, marked.length ? prospectTable('dboard', marked) : '<div class="empty">スカウト画面で、気になる選手に★をつけておきましょう。</div>', { flush: true, act: '<button class="btn sm" data-a="go" data-v="scout">スカウト</button>' });
  }
  if (D.stage === 'done') return head + `<p class="lead">ドラフトが終わりました。指名した選手はマイナー契約で入団しています。</p>` + draftSummaryMLB(D);
  const av2 = availableProspects().filter(prospectVisible);

  const main = `<div class="row sp" style="margin-bottom:10px"><div><b>${D.round}巡目</b>　<span class="small muted">全体${no}番目　指名済み ${mine.length}人／マイナー契約 ${rosterLv(ut, 3).length + mine.length}人見込み（上限${LIM.ikusei}人）</span></div>
      <div class="row">${myTurn ? '<button class="btn" data-a="dStop">指名を終える</button>' : '<button class="btn pri" data-a="dNext">自分の番まで進める</button>'}<button class="btn" data-a="dAuto">残りを自動で指名</button></div></div>` +
    (myTurn ? panel(`あなたの番です（${D.round}巡目・全体${no}番目・契約金の目安 ${fmtSal(mlbSlot(no))}）`, prospectTable('dr', av2, p => `<button class="btn xs pri" data-a="dPick" data-id="${p.id}">指名</button>`), { flush: true, cls: 'hl' }) : '') +

function projectYear() {
  const F = G.fin; const t = curTurn(); const last = F.hist[F.hist.length - 1];

  if (last && t < 20) { const k = t / 48; return { rev: Math.max(rev, last.rev * (1 - k) + rev), exp: Math.max(exp, last.exp * (1 - k) + exp) }; }

  return { rev: rev * (t >= 11 ? 48 / Math.max(12, t) : f), exp: exp * f };
}

/* 10段階の一覧。上ほど発展した姿 */
function townStageLadder() {
  const tw = G.town; const s = townStage(); const log = tw.stageLog || []; const top = Math.max(tw.stageMax || 0, s.i);
  const rows = TOWN_STAGES.map(([t, n], k) => {
    const i = k + 1; const at = log.find(l => l.i === i);
    const cls = i === s.i ? 'cur' : i <= top ? 'done' : '';
    const note = i === s.i ? 'いま' : at ? `${at.y}年${at.m}月` : i <= top ? '到達' : `賑わい${t}`;
    return `<li class="${cls}"><span class="no">${i}</span><span class="nm">${n}</span><span class="th">${note}</span></li>`;
  }).reverse().join('');
  const prog = s.next != null
    ? `<p class="small" style="margin:0 0 6px">次の「${s.nextN}」まで、いつもの賑わいがあと <b>${Math.max(1, s.next - Math.floor(s.v))}</b></p>${bar(s.v - s.cur, s.next - s.cur)}`
    : '<p class="small" style="margin:0">最後の段階に到達しました。</p>';
  return `${prog}<ol class="ladder">${rows}</ol><p class="small muted" style="margin:10px 0 0">段階は、建物と民間の店でできた「いつもの賑わい」で決まります（イベント中の上乗せは含みません）。新しい段階に届くたびに、地域の愛着・人気・ファンが少し増えます。</p>`;
}
function evEffects(d, m) {
  const out = [];
  if (d.vib) out.push(`開催中の賑わい+${d.vib}`);
  out.push(`発展の勢い+${Math.round(d.dev * m)}`);
  if (d.attach) out.push(`地域の愛着+${r1(d.attach * m)}`);
  if (d.fans) out.push(`ファン+${r1(d.fans * m)}`);
  if (d.pop) out.push(`人気+${r1(d.pop * m)}`);
  if (d.acc) out.push(`アクセス+${d.acc}（ずっと）`);
  if (d.rev) out.push(`収入 約${fmtOku(d.rev * m)}`);
  return `<div class="evfx">${out.join('　')}</div>`;
}
function townEventsView() {
  const tw = G.town; const evs = tw.events || [];
  const evPic = evs.find(e => hasArt('ev_' + e.k));
  const running = evs.length ? (evPic ? art('ev_' + evPic.k, { h: 'mini', title: TOWN_EVENTS[evPic.k].n, sub: '開催中' }) : '') + `<div class="lot">${evs.map(e => { const d = TOWN_EVENTS[e.k]; return `<div class="lot-row"><span style="font-size:22px">${d.i}</span><div style="flex:1;min-width:160px"><b>${d.n}</b> <span class="small muted">残り${e.wk}週</span>${bar(e.tot - e.wk, e.tot)}</div></div>`; }).join('')}</div>`

  const list = Object.entries(TOWN_EVENTS).map(([k, d]) => {

    return `<div class="evrow ${on ? 'on' : ''}${hasArt('ev_' + k) ? ' pic' : ''}">${hasArt('ev_' + k) ? art('ev_' + k, { h: 'thumb' }) : `<div class="ei">${d.i}</div>`}<div><b>${d.n}</b> <span class="small muted">${fmtOku(d.cost)}・${when}</span><div class="small muted">${d.d}</div>${evEffects(d, m)}</div>
      <button class="btn sm pri" data-a="hostEv" data-k="${k}" ${c.ok ? '' : 'disabled'}>開催する</button>${c.ok ? '' : `<div class="why">${esc(c.why)}</div>`}</div>`;
  }).join('');
  const log = (tw.evLog || []).slice(0, 8);
  const logHtml = log.length ? `<ul class="tasks">${log.map(l => `<li><span>${TOWN_EVENTS[l.k].i} ${TOWN_EVENTS[l.k].n}</span><span class="small muted">${l.y}年${l.m}月・約${fmtPeople(l.visit)}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">まだ開催していません。</p>';
  return `<div class="grid g2 evgrid"><div class="stack">${panel('開催できるイベント', `<div class="lot">${list}</div>`)}</div>
    <div class="stack">${panel('開催中', running)}${panel('発展の勢いと街の段階', devHtml)}${panel('これまでのイベント', logHtml, { flush: !!log.length })}</div></div>`;
}
function bldEffects(d, m) {
  const L = { acc: 'アクセス', vib: '賑わい', pop: '住民', attach: '地域の愛着', fans: 'ファン', food: '飲食売上', goods: 'グッズ売上', heal: '故障回復', sat: '満足度', popw: '人気' };
  const out = [];
  for (const k in L) if (d[k]) out.push(`${L[k]}+${k === 'food' || k === 'goods' || k === 'heal' ? Math.round(d[k] * m * 100) + '%' : k === 'popw' ? '' : r1(d[k] * m)}`);
  if (d.rev) out.push(`収入${fmtOku(d.rev * m)}/週`);
  if (d.offrev) out.push(`オフ収入${fmtOku(d.offrev * m)}/週`);
  if (d.game) out.push(`試合日${fmtOku(d.game * m)}`);
  if (d.academy) out.push('地元の有望株が増える');
  return `<div class="small" style="color:var(--ball)">${out.join('　')}</div>`;
}

function recWho(r) { if (!r) return ''; const p = r.pid != null ? P_(r.pid) : null; return (p ? pLink(p) : esc(r.name)) + (r.y === G.year && !r.seed ? ' <span class="tag lamp">今季</span>' : ''); }
function recRow(k, r, car, extra) {
  const d = car ? CAR_DEFS[k] : REC_DEFS[k]; const p = r && r.pid != null ? P_(r.pid) : null;
  return `<tr class="${p && isUser(p.team) ? 'me' : ''}"><td>${d.n}</td><td class="num"><b>${r ? recFmt(k, r.v, car) : '―'}</b></td><td>${recWho(r)}</td><td>${r ? tMark(r.tid) : ''}</td><td class="num">${r ? r.y : ''}</td>${extra != null ? `<td class="small">${extra}</td>` : ''}</tr>`;
}
function activeTop(k) {
  let best = null, bv = 0;
  for (const T of G.teams) for (const p of roster(T.id)) { if ((!!CAR_DEFS[k].bat) === isP(p)) continue; const v = (p.car[k] || 0) + (p.st[k] || 0); if (v > bv) { bv = v; best = p; } }
  return best ? `${pLink(best)} ${recFmt(k, bv, true)}` : '';
}
function recordsTab() {
  const R = G.recs; if (!R) return '<div class="empty">記録はまだありません。</div>';

  const lg = panel('リーグ記録（シーズン）', `<div class="tw"><table class="t compact">${head}<tbody>${Object.keys(REC_DEFS).map(k => recRow(k, R.lg[k])).join('')}</tbody></table></div>`, { flush: true });
  const car = panel('歴代最多（通算）', `<div class="tw"><table class="t compact"><thead><tr><th>記録</th><th class="num">数字</th><th>選手</th><th>球団</th><th class="num">年</th><th>現役トップ</th></tr></thead><tbody>${Object.keys(CAR_DEFS).map(k => recRow(k, R.car[k], true, activeTop(k))).join('')}</tbody></table></div>`, { flush: true });
  const tm = panel('球団記録（シーズン）', `<div class="tw"><table class="t compact">${head}<tbody>${Object.keys(REC_DEFS).map(k => recRow(k, (R.tm[tid] || {})[k])).join('')}</tbody></table></div>`,
    { flush: true, act: `<select class="inp" data-c="recTeam" aria-label="球団">${G.teams.map(t => opt(t.id, tName(t.id), tid)).join('')}</select>` });
  return `<p class="small muted">シーズン中に記録を塗り替えると、その場でお知らせと演出があります。記録が近づくと「あと○本」のお知らせが届き、観客も増えます。打率と防御率は規定打席・規定投球回に届いた選手だけで、シーズン終了時に決まります。</p><div class="grid g2">${lg}${tm}</div><div style="height:16px"></div>${car}`;
}

      ${edFld('故障のしやすさ', `<input type="range" min="5" max="95" value="${d.inj}" data-i="peRange" data-k="inj" aria-label="故障のしやすさ"><span class="small" id="peInj">${injLabel(d.inj)}</span>`, 'w2')}
    </div>`;
  const con = onTeam ? `<div class="ed-grid">${edFld(`年俸（${moneyUnit()}）`, edNum('sal', moneyShow(d.sal), 0, LG.mlb ? 99999 : 999999, LG.mlb ? 1 : 10))}${edFld('契約の残り年数', edNum('yrs', d.yrs, 1, 10))}${edFld('1軍在籍年数（FA権の計算）', edNum('svc', d.svc, 0, 30), 'w2')}</div>` : '';
  return { title: `選手を編集：${esc(p.name)}`, size: 'wide edit',
    body: `<div class="ed"><div class="ed-col">
      <section class="ed-sec"><h4>基本</h4>${basic}</section>
      <section class="ed-sec"><h4>能力 <span class="small muted">総合 <b id="peOvr">${draftOvr(d)}</b>　伸びしろ <b id="pePot">${draftPot(d)}</b></span></h4>${attrs}</section>
      <section class="ed-sec"><h4>サブポジション</h4>${subs}</section>
    </div><div class="ed-col">
      <section class="ed-sec"><h4>特殊能力</h4><div class="small muted" style="margin-bottom:6px">段階つき（A〜G。Dがふつう）</div>${lvSel}${chk('b', 'プラス')}${chk('r', 'マイナス')}${chk('au', '金（特別）')}</section>
      <section class="ed-sec"><h4>育成・性格</h4>${grow}</section>
      ${con ? `<section class="ed-sec"><h4>契約</h4>${con}</section>` : ''}
    </div></div>`,
    foot: `<button class="btn" data-a="peCancel" data-id="${id}">やめる</button><button class="btn pri" data-a="peSave" data-id="${id}">保存する</button>` };
};
function peLive() {
  const d = UI.f.pe; if (!d) return;
  const o = $('#peOvr'), t = $('#pePot'); if (o) o.textContent = draftOvr(d); if (t) t.textContent = draftPot(d);
  for (const k of editKeys(d)) { const el = document.querySelector(`[data-gr="${k}"]`); if (el) el.innerHTML = gr(d.a[k]); }
}
ACT.peTxt = el => { UI.f.pe[el.dataset.k] = el.value; };
ACT.peNum = el => { UI.f.pe[el.dataset.k] = el.dataset.k === 'sal' ? moneyFrom(+el.value) : +el.value; };
ACT.peAttr = el => { const d = UI.f.pe; const [lo, hi] = attrRange(el.dataset.k); d[el.dataset.w][el.dataset.k] = clamp(+el.value || lo, lo, el.dataset.w === 'cap' && el.dataset.k === 'vel' ? velCapMax() : hi); peLive(); };
ACT.peRange = el => { UI.f.pe.inj = +el.value; const s = $('#peInj'); if (s) s.textContent = injLabel(+el.value); };
ACT.peSel = el => {
  const d = UI.f.pe; const k = el.dataset.k;
  d[k] = k === 'gt' ? +el.value : el.value;
  if (k === 'pt') for (const x of Object.keys(d.sk)) if (SKILLS[x] && SKILLS[x].sp && d.pt !== 'SP') delete d.sk[x];
  renderModalRoot();
};
ACT.pePos = el => {
  const d = UI.f.pe; const np = el.value; const old = d.pos;
  if ((old === 'P') !== (np === 'P')) draftSwitchType(d, np);
  else if (np !== 'P') { d.pos = np; delete d.sub[np]; d.sub[old] = Math.max(d.sub[old] || 0, 3); }
  for (const x of Object.keys(d.sk)) if (!skOk({ pos: d.pos, pt: d.pt }, x)) delete d.sk[x];
  renderModalRoot();
};
ACT.peChk = el => { UI.f.pe[el.dataset.k] = el.checked; };
ACT.peSub = el => { UI.f.pe.sub[el.dataset.k] = +el.value; };
ACT.peSkL = el => {
  const d = UI.f.pe; const k = el.dataset.k; const v = +el.value;
  if (v) d.sk[k] = v; else delete d.sk[k];
  if (v) for (const g in SKILLS) if (SKILLS[g].up === k) delete d.sk[g];
  renderModalRoot();
};
ACT.peSk = el => {
  const d = UI.f.pe; const k = el.dataset.k; const def = SKILLS[k];
  if (!el.checked) { delete d.sk[k]; renderModalRoot(); return; }
  d.sk[k] = 1;
  for (const x of def.x || []) delete d.sk[x];
  if (def.up) delete d.sk[def.up];
  for (const g in SKILLS) if (SKILLS[g].up === k) delete d.sk[g];
  renderModalRoot();
};
ACT.peAll = el => {
  const d = UI.f.pe; const v = +el.dataset.v;
  for (const k of editKeys(d)) { const [lo, hi] = attrRange(k); d.a[k] = clamp(d.a[k] + (k === 'vel' ? v * 0.6 : v), lo, hi); d.cap[k] = Math.max(d.cap[k], d.a[k]); }
  renderModalRoot();
};
ACT.peCap = el => {
  const d = UI.f.pe; const v = +el.dataset.v;
  for (const k of editKeys(d)) d.cap[k] = v ? clamp(Math.max(d.cap[k], d.a[k]) + (k === 'vel' ? v * 0.4 : v), d.a[k], k === 'vel' ? velCapMax() : 99) : d.a[k];
  renderModalRoot();
};
ACT.peCancel = el => { const id = +el.dataset.id; UI.f.pe = null; replaceModal('player', { id }); render(); };
ACT.peSave = el => {
  const id = +el.dataset.id; const p = findPlayer(id); const d = UI.f.pe; if (!p || !d) return;
  const r = applyEdit(p, d);
  if (!r.ok) { toast(r.why, 'bad'); return; }
  UI.f.pe = null;
  toast(`${p.name}を保存しました${r.msgs.length ? '。' + r.msgs.join('。') : ''}`, 'good');
  replaceModal('player', { id });
  render();
};

/* =========================================================
   お知らせ：ベル・一覧・週のまとめ・トースト・ブラウザの通知
   ========================================================= */
function noteLi(n, fresh) {
  const p = n.pid != null ? findPlayer(n.pid) : null;
  const isNew = fresh ? fresh.includes(n.id) : !n.rd;
  return `<li class="note${isNew ? ' new' : ''}${n.pr === 'hi' ? ' hi' : ''}">
    <span class="d">${n.y}/${n.m}月${n.w}週</span>
    <span class="tx"><span class="ty">${NEWS_TYPES[n.type] || 'お知らせ'}</span>${esc(n.t)}</span>
    <span class="acts">${p ? `<button class="btn xs" data-a="player" data-id="${p.id}">選手</button>` : ''}${n.go && SCREENS[n.go] ? `<button class="btn xs" data-a="noteGo" data-v="${n.go}"${n.tab ? ` data-tab="${n.tab}"` : ''}>開く</button>` : ''}</span></li>`;
}
function notesList(list, fresh) { return list.length ? `<ul class="notes">${list.map(n => noteLi(n, fresh)).join('')}</ul>` : '<div class="empty">お知らせはありません。工事の完了・選手の成長や故障・契約の変化などがここに届きます。</div>'; }
ACT.notes = () => {
  const fresh = (G.notes || []).filter(n => !n.rd).map(n => n.id);
  markNotesRead();
  openModal('notes', { fresh });
  render();
};
ACT.noteGo = el => { closeAllModals(); go(el.dataset.v, el.dataset.tab); };
ACT.notesAll = () => go('notes');
/* fresh：開いた時点で未読だったもの。since：まとめて進めた間に届いたものだけを見せる */
MODALS.notes = ({ fresh, since, n }) => {
  const all = G.notes || [];
  const list = since != null ? all.filter(x => x.id > since) : all.slice(0, 40);
  const title = since != null ? `${n ? n + '週の間の' : ''}お知らせ ${list.length}件` : 'お知らせ';
  return { title, body: notesList(list, fresh || []),
    foot: `<button class="btn" data-a="notesAll">すべてのお知らせ</button><button class="btn" data-a="go" data-v="system">通知の設定</button><button class="btn pri" data-a="closeModal">閉じる</button>` };
};
SCREENS.notes = () => {
  const f = getTab('notesF', 'all');
  const all = G.notes || [];
  const list = f === 'hi' ? all.filter(n => n.pr === 'hi') : f === 'all' ? all : all.filter(n => n.type === f);
  const types = [...new Set(all.map(n => n.type))];
  const fresh = UI.notesFresh || [];
  return `<h1 class="h1">お知らせ</h1><p class="lead">工事や練習が終わった、選手が成長した・故障した、契約が決まった・切れたなど、自球団にかかわる「完了」と「変化」をまとめています。直近${NOTE_MAX}件まで残ります。</p>
  <div class="row" style="margin-bottom:12px">${seg('notesF', [['all', 'すべて'], ['hi', '大事なもの']].concat(types.map(t => [t, NEWS_TYPES[t] || t])), f)}</div>
  ${panel('', notesList(list, fresh), { flush: true })}`;
};
ACT.notesF = el => { UI.tab.notesF = el.dataset.v; render(); };
ON_GO.notes = () => { UI.notesFresh = (G.notes || []).filter(n => !n.rd).map(n => n.id); markNotesRead(); };

/* 画面の下に短く出す（大事なものを優先して2件まで） */
function toastNotes(list) {
  if (!list.length || !G.user.noteToast) return;
  const s = list.slice().sort((a, b) => (b.pr === 'hi') - (a.pr === 'hi'));
  for (const n of s.slice(0, 2)) toast(n.t, n.pr === 'hi' ? 'good' : '');
  if (list.length > 2) toast(`ほかにお知らせが${list.length - 2}件あります（右上のベル）`);
}
/* 別のタブを見ているときは、ブラウザの通知で知らせる（設定で許可したとき） */
function osNotify(list) {
  try {
    if (!G.user.osNote || typeof Notification === 'undefined' || Notification.permission !== 'granted' || !document.hidden) return;
    const hi = list.filter(n => n.pr === 'hi');
    if (!hi.length) return;
    const body = mlbText(hi.length === 1 ? hi[0].t : `${hi[0].t}　ほか${hi.length - 1}件`);
    new Notification(`球団社長：${tName(G.user.tid)}`, { body, tag: 'kyudan-' + hi[0].id });
  } catch (e) { }
}
function osNoteState() {
  if (typeof Notification === 'undefined') return 'この環境では使えません';
  return Notification.permission === 'granted' ? '許可されています' : Notification.permission === 'denied' ? 'ブラウザでブロックされています（ブラウザの設定から許可できます）' : 'まだ許可していません';
}
ACT.osNote = el => {
  const on = el.checked;
  if (!on) { G.user.osNote = false; render(); return; }
  try {
    if (typeof Notification === 'undefined') { el.checked = false; toast('このブラウザでは通知を使えません', 'bad'); return; }
    if (Notification.permission === 'granted') { G.user.osNote = true; toast('ブラウザの通知を使います', 'good'); render(); return; }
    Notification.requestPermission().then(r => { G.user.osNote = r === 'granted'; toast(r === 'granted' ? 'ブラウザの通知を使います' : '通知が許可されませんでした', r === 'granted' ? 'good' : 'bad'); render(); });
  } catch (e) { el.checked = false; toast('通知を設定できませんでした', 'bad'); }
};
ACT.noteTest = () => {
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') { new Notification('球団社長', { body: 'お知らせのテストです。大事なお知らせはこのように届きます。' }); return; }
  } catch (e) { }
  toast('お知らせのテストです。ブラウザの通知を使うには、上のチェックを入れて許可してください');
};

/* =========================================================
   起動
   ========================================================= */
(function boot() {
  try { const th = localStorage.getItem('kyudan_theme'); if (th) document.documentElement.dataset.theme = th === 'day' ? 'day' : 'night'; } catch (e) { }
  setLeague(typeof START_LEAGUE !== 'undefined' ? START_LEAGUE : 'npb');
  UI.title.mode = LG.mode;
  UI.screen = 'title';
  render();
  window.addEventListener('hashchange', () => { if (!G) return; const h = location.hash.slice(1); if (SCREENS[h] && h !== UI.screen && h !== 'title') go(h); });
})();

</script>
</body>
</html>
