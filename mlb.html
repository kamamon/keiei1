<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球団社長 メジャーリーグ経営シミュレーション</title>
<meta name="description" content="162試合・地区制・年俸調停・FA・ぜいたく税・ドラフトまで、メジャーリーグ球団のすべてを動かす経営シミュレーションゲーム">
<meta name="theme-color" content="#133F31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23133F31'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fff'/%3E%3Cpath d='M20 22c5 6 5 14 0 20M44 22c-5 6-5 14 0 20' stroke='%23E5383B' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* ===== 球団社長 — スコアボードをモチーフにした画面 ===== */
:root {
  --bg: #0B241D; --bg2: #0E2C24; --panel: #11342A; --panel2: #0F2E25; --hover: rgba(255, 255, 255, .045);
  --line: rgba(228, 236, 224, .11); --line2: rgba(228, 236, 224, .22);
  --ink: #E8EEE3; --ink2: #A9BBAF; --ink3: #7C9084;
  --lamp: #FFB547; --lamp-ink: #2A1A00; --ball: #4FD48B; --strike: #F2CF48; --out: #FF6655;
  --board: #133F31; --board2: #0A271E; --board-ink: #EEF3EA;
  --team: #E5383B; --team2: #F6C744; --team-ink: #fff; --team-soft: rgba(229, 56, 59, .16);
  --f-disp: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-body: "BIZ UDPGothic", system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-num: "BIZ UDGothic", "BIZ UDPGothic", ui-monospace, "Hiragino Sans", "Meiryo", monospace;
  --r: 4px; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
:root[data-theme="day"] {
  --bg: #E5EBE3; --bg2: #DAE2D8; --panel: #F8FAF6; --panel2: #EEF2EB; --hover: rgba(0, 40, 20, .04);
  --line: rgba(18, 40, 30, .12); --line2: rgba(18, 40, 30, .24);
  --ink: #13221B; --ink2: #44584D; --ink3: #6A7D72;
  --lamp: #B86E00; --lamp-ink: #fff; --ball: #1B8A4B; --strike: #8F7000; --out: #C83A29;
  --board: #174636; --board2: #0F3328;
  --shadow: 0 10px 30px rgba(10, 40, 25, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== スコアボード（ヘッダー） ===== */
.sb { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 18px;
  padding: 8px 16px; background: linear-gradient(var(--board), var(--board2)); color: var(--board-ink); border-bottom: 3px solid var(--team); min-height: 64px; }
.sb-menu { display: none; background: none; border: 1px solid rgba(255, 255, 255, .2); color: inherit; border-radius: var(--r); width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
.sb-team { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
.sb-name { font-family: var(--f-disp); font-size: 19px; line-height: 1.15; white-space: nowrap; letter-spacing: .02em; }
.sb-sub { font-size: 12px; opacity: .78; white-space: nowrap; }
.sb-date { display: flex; align-items: baseline; gap: 4px; }
.lit { display: inline-block; min-width: 1.6em; padding: 2px 6px; background: #071d16; border: 1px solid rgba(255, 255, 255, .08); border-radius: 3px; text-align: center;
  font-family: var(--f-disp); font-size: 20px; color: #FFB547; line-height: 1.2; text-shadow: 0 0 10px rgba(255, 181, 71, .45); }
.lit.flip { animation: flip .45s ease; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); opacity: .4; } 100% { transform: rotateX(0); } }
.sl { font-size: 12px; opacity: .75; margin-right: 4px; }
.sb-phase { font-size: 12px; opacity: .85; margin-left: 8px; white-space: nowrap; }
.sb-mini { display: none; margin-left: auto; font-size: 12px; white-space: nowrap; opacity: .9; font-family: var(--f-num); }
.sb-mini b { font-weight: 400; color: #FFB547; }
.sb-read { display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap; min-width: 0; }
.rd { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.rk { font-size: 11px; opacity: .7; }
.rv { font-family: var(--f-num); font-size: 15px; white-space: nowrap; }
.rv.neg { color: #FF8A7A; }
.sb-go { display: flex; }
.go { background: var(--lamp); color: var(--lamp-ink); border: 0; border-radius: var(--r) 0 0 var(--r); padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
:root[data-theme="day"] .go { background: #FFB547; color: #2A1A00; }
.go:hover { filter: brightness(1.08); }
.go2 { background: #d9932f; color: #2A1A00; border: 0; border-left: 1px solid rgba(0, 0, 0, .2); border-radius: 0 var(--r) var(--r) 0; padding: 0 10px; cursor: pointer; }
.go:disabled, .go2:disabled { opacity: .5; cursor: wait; }

/* ===== 全体レイアウト ===== */
.wrap { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.nav { position: sticky; top: 67px; align-self: start; height: calc(100vh - 67px); z-index: 5; overflow-y: auto; padding: 12px 10px 40px; border-right: 1px solid var(--line); background: var(--bg2); }
.nav-g { font-size: 11px; color: var(--ink3); margin: 14px 8px 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: var(--r); text-decoration: none; color: var(--ink2); cursor: pointer; font-size: 13.5px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { background: var(--team-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--team); }
.nav .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--out); color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
.main { padding: 20px 24px 80px; min-width: 0; }
.h1 { font-family: var(--f-disp); font-size: 26px; line-height: 1.25; margin: 0 0 4px; letter-spacing: .01em; }
.lead { color: var(--ink2); margin: 0 0 18px; max-width: 70ch; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-home { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--ball); } .neg { color: var(--out); } .warn { color: var(--strike); }
.nowrap { white-space: nowrap; }
.right { text-align: right; } .center { text-align: center; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ===== パネル ===== */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; margin: 0; font-weight: 700; }
.panel-b { padding: 12px 14px; }
.panel-b.flush { padding: 0; }
.panel.hl { border-color: var(--team); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--ink2); font-size: 13px; } .kv dd { margin: 0; text-align: right; font-family: var(--f-num); }
.stat-big { font-family: var(--f-disp); font-size: 28px; line-height: 1.1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.tile { background: var(--panel); padding: 10px 14px; }
.tile .k { font-size: 12px; color: var(--ink2); } .tile .v { font-family: var(--f-num); font-size: 18px; white-space: nowrap; } .tile .s { font-size: 11px; color: var(--ink3); }
.tile .v.txt { font-family: var(--f-body); font-size: 15px; font-weight: 700; white-space: normal; line-height: 1.35; padding-top: 2px; }

/* ===== ボタン・入力 ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--line2); background: transparent; color: var(--ink);
  border-radius: var(--r); cursor: pointer; font-size: 13.5px; white-space: nowrap; line-height: 1.3; text-decoration: none; }
.btn:hover { background: var(--hover); border-color: var(--ink3); }
.btn.pri { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.team { background: var(--team); border-color: var(--team); color: var(--team-ink); font-weight: 700; }
.btn.danger { border-color: rgba(255, 102, 85, .6); color: var(--out); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.xs { padding: 2px 7px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { background: var(--team-soft); border-color: var(--team); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--team); color: var(--team-ink); }
.inp, select.inp { background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 9px; color: var(--ink); min-width: 0; }
.inp.num { text-align: right; }
input[type=range] { accent-color: var(--lamp); width: 100%; }
input[type=checkbox] { accent-color: var(--lamp); width: 16px; height: 16px; vertical-align: middle; }
label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.field { display: grid; gap: 4px; } .field > span { font-size: 12px; color: var(--ink2); }

/* ===== タブ ===== */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; padding: 9px 14px; color: var(--ink2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--team); font-weight: 700; }
.tabs .cnt { font-size: 11px; color: var(--ink3); margin-left: 4px; }

/* ===== 表 ===== */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--ink); }
table.t th.sorted { color: var(--lamp); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.t tr:hover td { background: var(--hover); }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.t tr.me td { background: var(--team-soft); }
table.t tr.me td:first-child { box-shadow: inset 3px 0 0 var(--team); }
table.t tr.dim td { opacity: .5; }
table.t.compact td { padding: 4px 6px; } table.t.compact th { padding: 5px 6px; }
.pl { cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--ink3); }
.pl:hover { color: var(--lamp); border-bottom-color: var(--lamp); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink2); }

/* ===== 評価記号・バー ===== */
.gr { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px; border-radius: 3px; font-family: var(--f-disp); font-size: 12px; line-height: 1; color: #1a1a1a; }
.gr.S { background: #FFD54A; } .gr.A { background: #FF6B57; color: #fff; } .gr.B { background: #FF9F43; } .gr.C { background: #F2D24E; }
.gr.D { background: #9BD35A; } .gr.E { background: #4CC38A; } .gr.F { background: #5BA4D9; color: #fff; } .gr.G { background: #8A97A0; color: #fff; } .gr.Q { background: transparent; border: 1px dashed var(--ink3); color: var(--ink3); }
.av { display: inline-flex; align-items: center; gap: 4px; }
.av .n { font-family: var(--f-num); min-width: 2.1em; text-align: right; }
.bar { position: relative; height: 8px; background: rgba(128, 128, 128, .2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lamp); border-radius: 4px; }
.bar > b { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--ink); opacity: .55; }
.bar.team > i { background: var(--team); }
.bar.ball > i { background: var(--ball); } .bar.strike > i { background: var(--strike); } .bar.out > i { background: var(--out); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); vertical-align: middle; }
.dot.b { background: var(--ball); box-shadow: 0 0 6px var(--ball); } .dot.s { background: var(--strike); box-shadow: 0 0 6px var(--strike); } .dot.o { background: var(--out); box-shadow: 0 0 6px var(--out); }
.form { font-weight: 700; } .form.f2 { color: #FF6B57; } .form.f1 { color: #FF9F43; } .form.f0 { color: var(--ink2); } .form.fm1 { color: #5BA4D9; } .form.fm2 { color: #8a7cff; }
.tag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.tag.team { background: var(--team); color: var(--team-ink); border-color: var(--team); }
.tag.b { border-color: var(--ball); color: var(--ball); } .tag.s { border-color: var(--strike); color: var(--strike); } .tag.o { border-color: var(--out); color: var(--out); }
.tag.lamp { border-color: var(--lamp); color: var(--lamp); }

/* ===== ラインスコア（試合結果） ===== */
.ls { background: var(--board2); color: var(--board-ink); border-radius: var(--r); padding: 10px 12px; overflow-x: auto; }
.ls table { border-collapse: collapse; font-family: var(--f-disp); }
.ls th { font-family: var(--f-body); font-weight: 400; font-size: 11px; opacity: .7; padding: 2px 6px; text-align: center; }
.ls td { padding: 3px 7px; text-align: center; font-size: 17px; color: #FFB547; min-width: 26px; }
.ls td.tn { text-align: left; color: var(--board-ink); font-size: 14px; white-space: nowrap; padding-right: 14px; }
.ls td.tot { color: #fff; font-size: 20px; border-left: 1px solid rgba(255, 255, 255, .15); }
.ls td.he { color: rgba(255, 255, 255, .7); font-size: 14px; }
.mini-ls { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mini-ls:hover { background: var(--hover); }
.wl { font-family: var(--f-disp); font-size: 14px; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.wl.w { background: var(--team); color: var(--team-ink); } .wl.l { border: 1px solid var(--line2); color: var(--ink2); } .wl.d { border: 1px dashed var(--line2); color: var(--ink2); }
.score { font-family: var(--f-disp); font-size: 18px; }

/* ===== エンブレム ===== */
.emb { flex: none; display: inline-block; vertical-align: middle; }

/* ===== モーダル・トースト ===== */
.mback { position: fixed; inset: 0; background: rgba(2, 12, 8, .62); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; width: 100%; max-width: 860px; box-shadow: var(--shadow); animation: pop .18s ease; }
.modal.wide { max-width: 1080px; } .modal.narrow { max-width: 560px; }
.modal.still { animation: none; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 17px; }
.modal-b { padding: 16px 18px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.x { background: none; border: 0; color: var(--ink2); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: var(--r); }
.x:hover { background: var(--hover); color: var(--ink); }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--board); color: var(--board-ink); border-left: 4px solid var(--lamp); padding: 10px 14px; border-radius: var(--r); box-shadow: var(--shadow); animation: pop .2s ease; font-size: 13.5px; }
.toast.bad { border-left-color: var(--out); } .toast.good { border-left-color: var(--ball); }
.busy { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: rgba(2, 12, 8, .55); }
.busy-box { background: var(--board); color: var(--board-ink); border-radius: 6px; padding: 18px 26px; text-align: center; min-width: 260px; box-shadow: var(--shadow); }
.busy-box .lit { font-size: 22px; margin: 6px 2px; }

/* ===== タイトル・球団選択 ===== */
.title { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; background:
  radial-gradient(1200px 600px at 50% 0%, rgba(255, 181, 71, .08), transparent 60%), var(--bg); }
.title-board { background: linear-gradient(var(--board), var(--board2)); border: 6px solid #0a1f18; outline: 1px solid rgba(255, 255, 255, .06); border-radius: 8px; padding: 34px 44px 28px; text-align: center; color: var(--board-ink); box-shadow: var(--shadow); max-width: 640px; width: 100%; }
.title-board h1 { font-family: var(--f-disp); font-size: clamp(44px, 9vw, 78px); margin: 0; letter-spacing: .08em; color: #FFB547; text-shadow: 0 0 22px rgba(255, 181, 71, .35); line-height: 1.1; }
.title-board p { margin: 10px 0 0; opacity: .85; }
.lamps { display: flex; justify-content: center; gap: 22px; margin: 20px 0 6px; font-size: 12px; opacity: .9; }
.lamps span { display: inline-flex; align-items: center; gap: 6px; }
.title-actions { display: grid; gap: 10px; margin-top: 26px; width: 100%; max-width: 340px; }
.title-actions .btn { padding: 12px 16px; font-size: 15px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; cursor: pointer; display: grid; gap: 8px; border-top: 4px solid var(--c); color: var(--ink); }
.tcard:hover { border-color: var(--c); background: var(--panel2); }
.tcard.on { outline: 2px solid var(--lamp); }
.tcard .nm { font-family: var(--f-disp); font-size: 17px; line-height: 1.2; }
.stars { color: var(--lamp); letter-spacing: 1px; }
.tcard.custom { border: 1px dashed var(--lamp); border-top: 4px dashed var(--lamp); align-content: center; background: transparent; }
.tcard.custom:hover { background: var(--panel); }
.tcard.custom .nm { color: var(--lamp); }

/* ===== カスタムスタート ===== */
.cs { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; --team: var(--lamp); --team-ink: var(--lamp-ink); }
.cs-side { position: sticky; top: 16px; display: grid; gap: 12px; }
.cs-plate { position: relative; overflow: hidden; background: linear-gradient(var(--board), var(--board2)); color: var(--board-ink); border-radius: 8px; border-top: 8px solid var(--c); padding: 20px 16px 22px; text-align: center; box-shadow: var(--shadow); }
.cs-plate::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--c2); }
.cs-plate .nm { font-family: var(--f-disp); font-size: 22px; line-height: 1.25; margin-top: 10px; overflow-wrap: anywhere; }
.cs-plate .sub { font-size: 12px; opacity: .75; margin-top: 4px; overflow-wrap: anywhere; white-space: normal; }
.cs-side .stars { font-family: var(--f-body); font-size: 17px; letter-spacing: 2px; }
.cf { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.cf:first-child { padding-top: 0; } .cf:last-child { border-bottom: 0; padding-bottom: 0; }
.cf-l { color: var(--ink2); font-size: 13px; }
.cf-v { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.cf-v > .inp { flex: 1 1 180px; }
.cf-v .note { flex-basis: 100%; font-size: 12px; color: var(--ink3); }
.cf input[type=color] { width: 46px; height: 32px; padding: 2px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--panel2); cursor: pointer; }
.cf input[type=range] { flex: 1 1 160px; accent-color: var(--lamp); min-width: 0; }
.cf output { font-family: var(--f-num); min-width: 5.5em; text-align: right; }
@media (max-width: 860px) { .cs { grid-template-columns: minmax(0, 1fr); } .cs-side { position: static; order: -1; } .cf { grid-template-columns: minmax(0, 1fr); } }

/* ===== 街づくり ===== */
.town { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cell { aspect-ratio: 1 / 1; border-radius: 6px; border: 1px dashed var(--line2); background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; padding: 4px; text-align: center; min-width: 0; }
.cell:hover { border-color: var(--lamp); }
.cell.own { border-style: solid; border-color: var(--line2); background: rgba(79, 212, 139, .07); }
.cell.sel { outline: 2px solid var(--lamp); }
.cell .ic { font-size: clamp(18px, 3.4vw, 30px); line-height: 1.1; }
.cell .lb { font-size: 10.5px; color: var(--ink2); line-height: 1.2; margin-top: 2px; overflow: hidden; max-width: 100%; text-overflow: ellipsis; white-space: nowrap; }
.cell .lvb { position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--lamp); font-family: var(--f-num); }
.cell.stadium { background: var(--team-soft); border: 2px solid var(--team); }
.cell.station { background: rgba(255, 181, 71, .08); border-style: solid; }
.cell.wip .ic { opacity: .45; }
.cell.priv { border-style: solid; border-color: transparent; background: rgba(140, 160, 200, .10); }
.cell.priv .lb { color: var(--ink3); }
.cell.priv::after { content: "民"; position: absolute; top: 3px; left: 5px; font-size: 9.5px; color: var(--ink3); }
/* ===== 場面の画像（Canva で生成） ===== */
.art { position: relative; isolation: isolate; overflow: hidden; margin: 0 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--art-bg); }
.art img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.art::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(3, 16, 11, .88) 0%, rgba(3, 16, 11, .62) 42%, rgba(3, 16, 11, .12) 100%); }
.art.banner { min-height: clamp(150px, 19vw, 220px); display: flex; align-items: flex-end; }
.art.cut { margin: -16px -18px 14px; border: 0; border-radius: 0; min-height: clamp(150px, 34vw, 220px); display: flex; align-items: flex-end; }
.art.cut::after { background: linear-gradient(0deg, rgba(3, 16, 11, .9) 0%, rgba(3, 16, 11, .45) 48%, rgba(3, 16, 11, .05) 100%); }
.art.mini { margin: 0 0 10px; min-height: 120px; display: flex; align-items: flex-end; }
.art.mini::after { background: linear-gradient(0deg, rgba(3, 16, 11, .85), rgba(3, 16, 11, .1) 70%); }
.art.thumb { flex: none; width: 84px; height: 60px; margin: 0; border-radius: 5px; }
.art.thumb::after { background: none; }
.art figcaption { display: grid; gap: 4px; padding: 18px 22px; max-width: min(720px, 100%); color: #F4F7F1; }
.art.cut figcaption, .art.mini figcaption { padding: 14px 18px; }
.art .k { font-family: var(--f-num); font-size: 12px; color: #FFB547; letter-spacing: .04em; }
.art .t { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: clamp(22px, 3vw, 32px); line-height: 1.2; text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
.art.mini .t { font-size: 18px; }
.art .s { font-size: 13.5px; line-height: 1.6; opacity: .93; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); max-width: 60ch; }
/* 画像がまだない場面の色 */
.art.tone-night { --art-bg: radial-gradient(38% 70% at 12% -10%, rgba(255, 244, 214, .38), transparent 70%), radial-gradient(38% 70% at 88% -10%, rgba(255, 244, 214, .32), transparent 70%), linear-gradient(180deg, #0b1b33 0%, #0e3428 64%, #1d6a45 100%); }
.art.tone-sun { --art-bg: radial-gradient(30% 60% at 85% 0%, rgba(255, 236, 160, .7), transparent 70%), linear-gradient(180deg, #3d8fd1 0%, #8cc8ea 55%, #3e9a57 100%); }
.art.tone-gold { --art-bg: radial-gradient(55% 90% at 75% 10%, rgba(255, 206, 92, .6), transparent 70%), linear-gradient(160deg, #241604 0%, #5e420f 58%, #b98b25 100%); }
.art.tone-navy { --art-bg: radial-gradient(40% 80% at 70% 0%, rgba(160, 190, 255, .35), transparent 70%), linear-gradient(160deg, #081026 0%, #18295a 100%); }
.art.tone-ice { --art-bg: radial-gradient(45% 80% at 80% 0%, rgba(255, 255, 255, .55), transparent 70%), linear-gradient(180deg, #5f88a6 0%, #a9c6da 60%, #d6e4ec 100%); }
.art.tone-dusk { --art-bg: radial-gradient(40% 70% at 82% 100%, rgba(255, 190, 110, .55), transparent 70%), linear-gradient(180deg, #221c45 0%, #7a3f63 58%, #d98a55 100%); }
/* イラスト（SVG） */
.art .ilw, .title-il { position: absolute; inset: 0; z-index: -2; overflow: hidden; }
.art .ilw svg, .title-il svg { display: block; width: 100%; height: 100%; }
.title.art-il { position: relative; isolation: isolate; background: var(--bg); }
.title-il { z-index: -1; }
.title-il::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 18, 12, .35), rgba(4, 18, 12, .82)); }
.il .twk { animation: il-twk 3s ease-in-out infinite alternate; }
.il .fall { animation: il-fall 8s linear infinite; }
.il .burst { transform-box: fill-box; transform-origin: center; animation: il-burst 4s ease-out infinite; }
.il .sway { transform-box: fill-box; transform-origin: 50% 0; animation: il-sway 3s ease-in-out infinite alternate; }
.il .spin { animation: il-spin 60s linear infinite; }
.il .beam { transform-box: fill-box; transform-origin: 50% 100%; animation: il-beam 6s ease-in-out infinite alternate; }
.il .beamt { transform-box: fill-box; transform-origin: 50% 0; animation: il-beam 7s ease-in-out infinite alternate; }
.il .glow { animation: il-glow 4s ease-in-out infinite alternate; }
.il .wave { transform-box: fill-box; transform-origin: 50% 100%; animation: il-wave 1.6s ease-in-out infinite alternate; }
.il .hop { animation: il-hop .9s ease-in-out infinite alternate; }
.il .drift { animation: il-drift 60s ease-in-out infinite alternate; }
.il .rise { animation: il-rise 4s ease-out infinite; }
@keyframes il-twk { from { opacity: .2; } to { opacity: 1; } }
@keyframes il-fall { from { transform: translateY(0); } to { transform: translateY(1000px); } }
@keyframes il-burst { 0% { transform: scale(.05); opacity: 0; } 8% { opacity: 1; } 60% { opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
@keyframes il-sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes il-spin { to { transform: rotate(360deg); } }
@keyframes il-beam { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
@keyframes il-glow { from { opacity: .65; } to { opacity: 1; } }
@keyframes il-wave { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes il-hop { from { transform: translateY(0); } to { transform: translateY(-26px); } }
@keyframes il-drift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
@keyframes il-rise { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-120px); opacity: 0; } }
.art.thumb .il * { animation: none !important; }
.title.art-bg { background: linear-gradient(180deg, rgba(4, 18, 12, .55), rgba(4, 18, 12, .9)), var(--art) center / cover no-repeat, var(--bg); }
.evrow.pic { grid-template-columns: 84px minmax(0, 1fr) auto; }
@media (max-width: 860px) { .art figcaption { padding: 14px 16px; } .art .s { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } .art.cut { margin: -16px -18px 12px; } }
@media (max-width: 480px) { .evrow.pic { grid-template-columns: 64px minmax(0, 1fr); } .evrow.pic .art.thumb { width: 64px; height: 48px; } }

/* ===== 球場の広告マップ ===== */
.admap { width: 100%; height: auto; display: block; max-width: 560px; margin: 0 auto; }
.admap .grass { fill: rgba(79, 212, 139, .10); }
.admap .dirt { fill: rgba(196, 150, 96, .16); }
.admap .foul { stroke: var(--line2); stroke-width: 1.2; fill: none; }
.admap .base { fill: var(--ink3); }
.admap .ad { cursor: pointer; --c: var(--ink3); }
.admap .ad > :not(text):not(title) { fill: var(--c); fill-opacity: .55; stroke: var(--c); stroke-width: 1.5; }
.admap .ad .ln { fill: none !important; stroke-width: 6; stroke-linecap: round; stroke-opacity: .85; }
.admap .ad .ln.dash { stroke-width: 4; stroke-dasharray: 7 5 !important; stroke-linecap: butt; }
.admap .ad text { fill: var(--ink2); font-size: 10.5px; text-anchor: middle; font-family: var(--f-body); pointer-events: none; }
.admap .ad text.in { fill: var(--ink); font-weight: 700; }
.admap .ad.sold { --c: var(--ball); }
.admap .ad.offer { --c: var(--lamp); }
.admap .ad.sol { --c: var(--strike); }
.admap .ad.open > :not(text):not(title) { fill-opacity: .12; stroke-dasharray: 4 3; }
.admap .ad.lock { --c: var(--line2); cursor: default; }
.admap .ad.lock > :not(text):not(title) { fill-opacity: .06; stroke-dasharray: 2 3; }
.admap .ad.lock text { fill: var(--ink3); }
.admap g.ad[data-k="seat"] > path { fill-opacity: .16; stroke-opacity: .5; }
.admap g.ad[data-k="seat"].open > path, .admap g.ad[data-k="seat"].lock > path { fill-opacity: .05; }
.admap .ad:hover > :not(text):not(title), .admap .ad:focus-visible > :not(text):not(title) { stroke: var(--ink); }
.admap .ad.on > :not(text):not(title) { stroke: var(--ink); stroke-width: 2.5; }
.admap .ad.on text { fill: var(--ink); font-weight: 700; }
.admap .ad:focus { outline: none; }
.adleg { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--ink2); }
.adleg i, .adrow i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--ink3); }
.adleg i.sold, .adrow i.sold { background: var(--ball); } .adleg i.offer, .adrow i.offer { background: var(--lamp); } .adleg i.sol, .adrow i.sol { background: var(--strike); }
.adleg i.open, .adrow i.open { background: transparent; border: 1px dashed var(--ink3); } .adleg i.lock, .adrow i.lock { background: var(--line); }
.adlist { display: grid; gap: 4px; }
.adrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); color: var(--ink); cursor: pointer; font-size: 13px; }
.adrow:hover { border-color: var(--lamp); }
.adrow .r { font-size: 12px; color: var(--ink2); font-family: var(--f-num); white-space: nowrap; }
.dlog { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.dlog li { padding: 5px 9px; border-radius: var(--r); background: var(--panel2); border-left: 3px solid var(--line2); }
.dlog li.me { border-left-color: var(--team); }
.dlog li.co { border-left-color: var(--lamp); }
.ladder { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 3px; }
.ladder li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: var(--r); background: var(--panel2); color: var(--ink3); font-size: 13px; }
.ladder li .no { font-family: var(--f-num); font-size: 12px; text-align: center; line-height: 20px; border: 1px solid var(--line2); border-radius: 3px; }
.ladder li .nm { min-width: 0; overflow-wrap: anywhere; }
.ladder li .th { font-family: var(--f-num); font-size: 11.5px; white-space: nowrap; }
.ladder li.done { color: var(--ink2); }
.ladder li.done .no { background: var(--ball); border-color: transparent; color: #04170d; }
.ladder li.cur { color: var(--ink); background: var(--team-soft); box-shadow: inset 3px 0 0 var(--team); font-weight: 700; }
.ladder li.cur .no { background: var(--lamp); border-color: transparent; color: var(--lamp-ink); }
.ladder li.cur .th { color: var(--lamp); }
.evrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
.evrow .ei { font-size: 24px; line-height: 1; text-align: center; }
.evrow .why { font-size: 11.5px; color: var(--ink3); grid-column: 2 / 4; }
.evrow.on { border-color: var(--lamp); }
.evfx { font-size: 12px; color: var(--ball); }
@media (max-width: 860px) { .evgrid > :last-child { order: -1; } }
@media (max-width: 480px) { .cell.priv::after { display: none; } }
@media (max-width: 480px) { .evrow { grid-template-columns: 28px minmax(0, 1fr); } .evrow > .btn { grid-column: 2; justify-self: start; } .evrow .why { grid-column: 2; } }

/* ===== チャート ===== */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink2); font-size: 11px; font-family: var(--f-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ===== ドラフト ===== */
.lot { display: grid; gap: 8px; }
.lot-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
.lot-row.win { border-color: var(--team); }
.reveal { animation: reveal .5s ease both; }
@keyframes reveal { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

/* ===== ニュース ===== */
.news { list-style: none; margin: 0; padding: 0; }
.news li { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.news li .d { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.news li.imp .tx { font-weight: 700; }
.news li .ty { font-size: 11px; color: var(--ink3); margin-right: 6px; }
.tasks { list-style: none; margin: 0; padding: 0; }
.tasks li { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.tasks li:last-child { border-bottom: 0; }

/* ===== スマホ ===== */
@media (max-width: 1100px) { .g-home { grid-template-columns: minmax(0, 1fr); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .sb { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "menu team go" "date date date"; gap: 6px 10px; padding: 6px 12px; min-height: 0; }
  .sb-menu { display: block; grid-area: menu; width: 34px; height: 34px; } .sb-team { grid-area: team; } .sb-go { grid-area: go; }
  .sb-team .emb { width: 32px; height: 32px; }
  .sb-date { grid-area: date; flex-wrap: nowrap; } .sb-read { display: none; }
  .sb-name { font-size: 15px; } .sb-sub { font-size: 11px; } .lit { font-size: 14px; padding: 1px 5px; min-width: 1.4em; } .go { padding: 8px 12px; font-size: 14px; }
  .sb-phase { display: none; } .sb-mini { display: block; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; height: 100vh; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .nav.open { transform: none; }
  .navback { position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, .5); }
  .main { padding: 14px 16px 90px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .h1 { font-size: 22px; }
  .mback { padding: 12px 8px; }
  .news li { grid-template-columns: 1fr; gap: 0; }
  .town { gap: 4px; }
  .title-board { padding: 26px 18px 22px; }
}
@media (max-width: 480px) { .g4 { grid-template-columns: minmax(0, 1fr); } .sb-read .rd:nth-child(n+5) { display: none; } }

/* ===== サブポジション・特殊能力・逸材 ===== */
:root { --sk-pos: #6FB6FF; --sk-pos-bg: rgba(111, 182, 255, .14); --sk-neg: #FF7A6B; --sk-neg-bg: rgba(255, 102, 85, .13); --sk-au: #F5C842; --sk-au-ink: #2A1E00; }
:root[data-theme="day"] { --sk-pos: #1F6FC2; --sk-pos-bg: rgba(31, 111, 194, .1); --sk-neg: #C83A29; --sk-neg-bg: rgba(200, 58, 41, .09); --sk-au: #D9A400; --sk-au-ink: #2A1E00; }
.subs { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: 1px; }
.sub { display: inline-flex; align-items: center; padding: 0 4px; border-radius: 3px; font-size: 11px; line-height: 16px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.sub.l3 { border-color: var(--ball); color: var(--ball); }
.sub.l2 { border-color: var(--line2); color: var(--ink); }
.sub.l1 { border-style: dashed; color: var(--ink3); }
.sub.main { background: var(--team); border-color: var(--team); color: var(--team-ink); }
.pdef { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pdef .sub { font-size: 12px; line-height: 20px; padding: 0 7px; }
.sks { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.sk { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 3px; font-size: 12px; line-height: 18px; white-space: nowrap; cursor: help; }
.sk.pos { background: var(--sk-pos-bg); color: var(--sk-pos); box-shadow: inset 0 0 0 1px var(--sk-pos); }
.sk.neg { background: var(--sk-neg-bg); color: var(--sk-neg); box-shadow: inset 0 0 0 1px var(--sk-neg); }
.sk.au { background: linear-gradient(180deg, #FFE27A, var(--sk-au)); color: var(--sk-au-ink); font-weight: 700; box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); }
.skn { display: inline-flex; gap: 3px; font-family: var(--f-num); font-size: 12px; }
.skn b { font-weight: 400; min-width: 18px; padding: 0 4px; border-radius: 3px; text-align: center; }
.skn .pos { color: var(--sk-pos); background: var(--sk-pos-bg); } .skn .neg { color: var(--sk-neg); background: var(--sk-neg-bg); }
.skn .au { color: var(--sk-au-ink); background: var(--sk-au); font-weight: 700; }
.tag.gen { background: linear-gradient(180deg, #FFE27A, var(--sk-au)); border-color: transparent; color: var(--sk-au-ink); font-weight: 700; margin-left: 4px; }
.gen-note { margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid var(--sk-au); background: rgba(245, 200, 66, .1); font-size: 13px; }
.prac { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; }
.prac select { max-width: 260px; }

/* ===== お知らせ（ベル） ===== */
.bell { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; margin-right: 8px; border-radius: var(--r); border: 1px solid rgba(255, 255, 255, .2); background: transparent; color: inherit; cursor: pointer; }
.bell:hover { background: rgba(255, 255, 255, .08); }
.bell.on { color: #FFB547; border-color: rgba(255, 181, 71, .55); }
.bell .bdg { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--out); color: #fff; font-size: 11px; line-height: 18px; font-family: var(--f-num); box-shadow: 0 0 0 2px var(--board2); }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.notes li .d { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.notes li .ty { font-size: 11px; color: var(--ink3); margin-right: 6px; }

/* ---------- 切り替え ---------- */
function lgTables() {
  return { REGIONS, REGION_W, PLACES, LEAGUES, TEAM_DEFS, COMPANIES, DOW, DRAFT_CATS, BONUS, ROOKIE_SAL, FRN_FROM, LIM, TIX, CAMP_SITES,
    REC_SEED_LG, REC_SEED_CAR, REC_SEED_TM, MILESTONES, MS_BIG, MS_NEAR };
}
let LG_NPB_DATA = null;
function lgCopy(v) { return JSON.parse(JSON.stringify(v)); }
function lgAssign(target, src) {
  if (Array.isArray(target)) { target.length = 0; for (const x of lgCopy(src)) target.push(x); }
  else { for (const k of Object.keys(target)) delete target[k]; Object.assign(target, lgCopy(src)); }
}
function setLeague(mode) {
  mode = mode === 'mlb' ? 'mlb' : 'npb';
  const tb = lgTables();
  if (!LG_NPB_DATA) {
    LG_NPB_DATA = {};
    for (const k in tb) LG_NPB_DATA[k] = lgCopy(tb[k]);
    LG_NPB_DATA.MIN_SAL = MIN_SAL; LG_NPB_DATA.MIN_SAL_IK = MIN_SAL_IK; LG_NPB_DATA.PERS_mlb = lgCopy(PERS.mlb);
    LG_NPB_DATA.GOALS = {}; for (const k of ['pennant', 'gs', 'aclass']) LG_NPB_DATA.GOALS[k] = { n: GOALS[k].n, d: GOALS[k].d };
  }
  const src = mode === 'mlb' ? MLB_DATA : LG_NPB_DATA;
  if (LG.mode === mode && LG.ready) return;
  for (const k in tb) lgAssign(tb[k], src[k]);
  MIN_SAL = src.MIN_SAL; MIN_SAL_IK = src.MIN_SAL_IK;
  PERS.mlb = lgCopy(src.PERS_mlb);
  for (const k in src.GOALS) Object.assign(GOALS[k], src.GOALS[k]);
  LG = Object.assign({ ready: true }, mode === 'mlb' ? LG_MLB : LG_NPB);
  setSimEnv();
  if (G && G.teams) for (const T of G.teams) { T._roles = null; T._lu = null; }
}
function isMLB() { return !!LG.mlb; }

/* ---------- 順位の単位（日本版はリーグ、メジャー版は地区） ---------- */
function grpOf(T) { return LG.mlb ? T.league * 3 + (T.div || 0) : T.league; }
function grpCount() { return LG.mlb ? 6 : 2; }
function grpName(g) { return LG.mlb ? LEAGUES[Math.floor(g / 3)] + ' ' + LG.divs[g % 3] : LEAGUES[g]; }
function grpShort(g) { return LG.mlb ? LEAGUES[Math.floor(g / 3)].replace('・リーグ', '') + LG.divs[g % 3] : LEAGUES[g]; }
function teamGrpName(tid) { return grpName(grpOf(G.teams[tid])); }
function rankStr(r) { return r ? (LG.mlb ? '地区' + r + '位' : r + '位') : '―'; }

let MIN_SAL = 440, MIN_SAL_IK = 240;   // メジャー版では setLeague が書き換える
const GT = [{ n: '早熟', g: 24, p: 27 }, { n: '普通', g: 27, p: 30 }, { n: '晩成', g: 29, p: 33 }];
const POS_DEFW = { C: .40, SS: .36, '2B': .30, CF: .26, '3B': .24, OF: .20, LF: .16, RF: .18, '1B': .12, DH: 0 };
const ARCH = {
  C: { con: -3, pow: 0, eye: 0, spd: -10, arm: 9, fld: 7 },
  '1B': { con: 3, pow: 10, eye: 3, spd: -9, arm: -6, fld: -6 },
  '2B': { con: 3, pow: -8, eye: 1, spd: 6, arm: -3, fld: 7 },
  '3B': { con: 0, pow: 5, eye: 0, spd: -2, arm: 6, fld: 2 },
  SS: { con: -1, pow: -9, eye: 0, spd: 7, arm: 6, fld: 10 },

function isP(p) { return p.pos === 'P'; }
/* 球速の水準のずれ（日本版0・メジャー版+5キロ）。評価はリーグの水準に合わせる */
function velOff() { return LG.velAdd || 0; }
function velScore(v) { return clamp((v - 122 - (LG.velAdd || 0)) * 2.5, 0, 100); }
function batOvr(a, pos) {
  const off = a.con * .40 + a.pow * .36 + a.eye * .12 + a.spd * .12;
  const def = a.fld * .65 + a.arm * .35;
  const w = POS_DEFW[pos] === undefined ? .2 : POS_DEFW[pos];
  return off * (1 - w) + def * w;
}
function pitOvr(a, t) {
  const vs = velScore(a.vel);
  return t === 'RP' ? vs * .32 + a.ctl * .26 + a.brk * .38 + a.sta * .04 : vs * .25 + a.ctl * .25 + a.brk * .32 + a.sta * .18;
}
function ovr(p) { return Math.round(isP(p) ? pitOvr(p.a, p.pt) : batOvr(p.a, p.pos)); }
function potv(p) { return Math.round(isP(p) ? pitOvr(p.cap, p.pt) : batOvr(p.cap, p.pos)); }
function spOvr(p) { return pitOvr(p.a, 'SP'); }
function rpOvr(p) { return pitOvr(p.a, 'RP'); }
function offVal(p) { const a = p.a; return a.con * .40 + a.pow * .36 + a.eye * .12 + a.spd * .12; }
function defVal(p) { return p.a.fld * .65 + p.a.arm * .35; }

/* その国のリーグの「ふつうの選手」の名前（日本版は日本人、メジャー版はアメリカ・中南米の名前） */
function genJpName() { return LG.mlb ? genUsName() : genJpReal(); }
function genJpReal() {
  for (let i = 0; i < 60; i++) {
    const n = pick(SURNAMES) + ' ' + pick(GIVEN);
    if (!NAMESET.has(n)) { NAMESET.add(n); return n; }
  }
  return pick(SURNAMES) + ' ' + pick(GIVEN) + pick(['之', '郎', '人', '也']);
}
function genUsName(nat) {
  nat = nat || (chance(0.27) ? 'LAT' : 'US');
  const F = nat === 'LAT' ? LAT_FIRST : US_FIRST, L = nat === 'LAT' ? LAT_LAST : US_LAST;
  for (let i = 0; i < 60; i++) {
    const n = pick(F) + '・' + pick(L);
    if (!NAMESET.has(n)) { NAMESET.add(n); return n; }
  }
  const n = pick(F) + '・' + pick(L) + pick(['Jr.', '2世', '3世']); NAMESET.add(n); return n;
}
/* 韓国・台湾の名前（姓・名の順） */
function genAsName(nat) {
  const F = nat === 'TW' ? TW_FAM : KR_FAM, Gv = nat === 'TW' ? TW_GIV : KR_GIV;
  for (let i = 0; i < 60; i++) { const n = pick(F) + '・' + pick(Gv); if (!NAMESET.has(n)) { NAMESET.add(n); return n; } }
  return pick(F) + '・' + pick(Gv) + pick(Gv);
}
function genFrName() {
  for (let i = 0; i < 60; i++) {
    const n = pick(F_FIRST) + '・' + pick(F_LAST);
    if (!NAMESET.has(n)) { NAMESET.add(n); return n; }
  }
  return pick(F_FIRST) + '・' + pick(F_LAST) + 'Jr.';
}
let NAMESET = new Set();
function lastName(p) {
  const n = p.name;
  if (p.nat === 'KR' || p.nat === 'TW') return n.split('・')[0];
  if (n.includes('・')) return n.split('・').pop().replace(/(Jr\.|2世|3世)$/, '');
  return n.split(' ')[0];
}
function pickPers() { const ks = Object.keys(PERS_W); return wpick(ks, k => PERS_W[k]); }

function blankBat() { return { g: 0, pa: 0, ab: 0, r: 0, h: 0, d: 0, t: 0, hr: 0, rbi: 0, bb: 0, hbp: 0, so: 0, sb: 0, cs: 0, sh: 0, sf: 0, gdp: 0, e: 0, pos: {} }; }
function blankPit() { return { g: 0, gs: 0, w: 0, l: 0, sv: 0, hld: 0, outs: 0, bf: 0, h: 0, hr: 0, bb: 0, hbp: 0, so: 0, r: 0, er: 0, cg: 0, sho: 0, qs: 0, np: 0 }; }

function makePlayer(o) {
  const frn = !!o.frn;
  const pos = o.pos;
  const p = {
    id: G.nid++, name: frn ? genFrName() : genJpName(), frn, age: o.age, pos, pt: pos === 'P' ? (o.pt || 'SP') : '',
    bats: 'R', thr: 'R', a: {}, cap: {}, gt: o.gt !== undefined ? o.gt : wpick([0, 1, 2], x => [25, 50, 25][x]),
    inj: clamp(Math.round(rn(40, 18)), 5, 95), per: pickPers(), pop: 0, mor: ri(52, 70), form: 0, fat: 0, injW: 0, injN: '',
    sal: MIN_SAL, yrs: 1, svc: 0, num: -1, team: -1, lv: 2, orig: -1, join: G.year, from: o.from || '', home: o.home !== undefined ? o.home : wpick([0, 1, 2, 3, 4, 5], i => REGION_W[i]),
    st: null, car: null, hist: [], focus: '', dr: null, faUsed: 0, wkG: 0, rel: null, ls: -99, adapt: 0, fa: null, ikusei: false,
    note: '', grow: 0, sub: {}, sx: {}, sk: {}, prac: null, gen: !!o.gen
  };
  if (pos === 'P') { p.thr = chance(0.3) ? 'L' : 'R'; p.bats = chance(0.25) ? 'L' : 'R'; }
  else {
    p.thr = (pos === 'C' || pos === '2B' || pos === 'SS' || pos === '3B') ? 'R' : (chance(0.22) ? 'L' : 'R');
    const r = rnd(); p.bats = r < 0.36 ? 'L' : (r < 0.40 ? 'S' : 'R');
    if (p.thr === 'L') p.bats = chance(0.85) ? 'L' : 'R';
  }
  genAttrs(p, o.cur, o.pot);
  genSubs(p);
  genSkills(p, o.gen ? 1 : 0);
  p.st = isP(p) ? blankPit() : blankBat();
  p.car = isP(p) ? blankPit() : blankBat();
  return p;
}

function genAttrs(p, cur, pot) {
  pot = Math.max(pot, cur);
  const g = pot - cur;
  if (isP(p)) {
    const rp = p.pt === 'RP', V = velOff();
    const a = { vel: clamp(145 + V + (cur - 60) * 0.30 + rn(0, 3.2) + (rp ? 2 : 0), 126 + V, 162 + V), ctl: cur + rn(0, 9), brk: cur + rn(0, 9), sta: rp ? cur - 16 + rn(0, 8) : cur + 8 + rn(0, 8) };
    for (let i = 0; i < 4; i++) { const d = cur - pitOvr(a, p.pt); a.ctl += d * 0.8; a.brk += d * 0.8; a.sta += d * 0.5; }
    for (const k of ['ctl', 'brk', 'sta']) a[k] = clamp(a[k], 5, 99);
    const c = {
      vel: clamp(a.vel + g * 0.24 + Math.abs(rn(0, 1.5)), a.vel, 165 + V),
      ctl: clamp(a.ctl + g + rn(0, 4), a.ctl, 99), brk: clamp(a.brk + g + rn(0, 4), a.brk, 99), sta: clamp(a.sta + g * 0.9 + rn(0, 4), a.sta, 99)
    };
    p.a = a; p.cap = c;
  } else {
    const ar = ARCH[p.pos]; const a = {};
    for (const k of BAT_KEYS) a[k] = cur + ar[k] + rn(0, 9);
    for (let i = 0; i < 4; i++) { const d = cur - batOvr(a, p.pos); for (const k of BAT_KEYS) a[k] += d; }
    for (const k of BAT_KEYS) a[k] = clamp(a[k], 5, 99);
    const c = {};
    for (const k of BAT_KEYS) c[k] = clamp(a[k] + g * (k === 'spd' ? 0.6 : 1) + rn(0, 4), a[k], 99);
    p.a = a; p.cap = c;
  }
}

/* 年俸の目安（能力ベース） */
function valueSalary(o) { if (LG.mlb) return valueSalaryMLB(o); const s = 1400 * Math.exp((o - 45) * 0.105); return s > 50000 ? 50000 + (s - 50000) * 0.35 : s; }
/* メジャー版はドルで切りのよい額（1000万ドル未満は1万ドル、それ以上は10万ドル単位）にそろえる */
function roundSal(s) {
  if (LG.mlb) { const usd = s * 300; const st = usd >= 1e7 ? 1e5 : 1e4; return Math.round(usd / st) * st / 300; }
  return s >= 10000 ? Math.round(s / 500) * 500 : Math.round(s / 10) * 10;
}
function marketSalary(p) {
  if (LG.mlb) return marketSalaryMLB(p);
  let s = valueSalary(ovr(p));
  s *= clamp(0.35 + p.svc * 0.11, 0.35, 1.0);
  if (p.frn) s *= 1.25;
  if (p.age >= 35) s *= 0.8;
  if (p.team >= 0 && G.teams[p.team]) s *= 0.88 + G.teams[p.team].market * 0.05;
  return roundSal(Math.max(p.lv === 3 ? MIN_SAL_IK : MIN_SAL, s));
}

/* 選手の価値（トレード・AI判断用） tidを渡すとそのチームの見立て（ポテンシャルに誤差） */
function pVal(p, tid) {
  const o = ovr(p);
  let pt = potv(p);
  if (tid !== undefined) pt += (hash2(p.id, tid + 7) - 0.5) * 12;
  let v = Math.pow(Math.max(0, o - 35), 1.7);
  if (p.age <= 27) { const room = Math.max(0, pt - o); v += Math.pow(room, 1.3) * (p.age <= 22 ? 2.2 : p.age <= 25 ? 1.6 : 0.9); }
  if (p.age >= 31) v *= Math.max(0.25, 1 - (p.age - 30) * 0.08);
  const fair = valueSalary(o);
  v -= Math.max(0, p.sal - fair) / (1000 * (LG.salK || 1)) * 0.8 * Math.max(1, p.yrs);
  if (p.injW > 8) v *= 0.8;
  return Math.max(0, v);
}

function mainPos(p) {
  if (isP(p)) return 'P';
  const m = p.st && p.st.pos; let best = null, bv = 0;
  if (m) for (const k in m) if (m[k] > bv) { bv = m[k]; best = k; }
  if (best) return best;
  return p.pos === 'OF' ? 'CF' : p.pos;
}
function potGrade(p) { return grade(potv(p)); }
function formArrow(f) { return ['↓', '↘', '→', '↗', '↑'][f + 2]; }
function formName(f) { return ['絶不調', '不調', '普通', '好調', '絶好調'][f + 2]; }
function handStr(p) { return (p.thr === 'L' ? '左' : '右') + '投' + (p.bats === 'L' ? '左' : p.bats === 'S' ? '両' : '右') + '打'; }
function displayName(p) { return p.name; }
function velMph(v) { return Math.round(v / 1.609344); }
function velStr(v) { return Math.round(v) + 'km/h'; }
/* 画面用：メジャー版はマイルも添える（two：2行にする） */
function velHtml(v, two) {
  const s = Math.round(v) + 'km/h';
  if (!LG.mlb) return s;
  return two ? `${s}<span class="small faint vmph">${velMph(v)}mph</span>` : `${s} <span class="small faint">${velMph(v)}mph</span>`;
}
/* ニュース用：メジャー版は「100マイル（161キロ）」 */
function velNews(v) { const k = Math.round(v); return LG.mlb ? `${velMph(k)}マイル（${k}キロ）` : `${k}キロ`; }

/* =========================================================
   サブポジション・特殊能力・特別練習
   p.sub  = { '2B': 2 }       本職以外に守れる位置（1=△ 2=○ 3=◎）
   p.sx   = { '2B': 61 }      その位置の経験（公式戦で守る・練習で増える）
   p.sk   = { chance: 2, power: 1 }  特殊能力（段階つきは -3〜+3＝G〜A。ほかは 1）
   p.prac = { k: 'sub'|'sk', key, xp }  特別練習（自球団の選手）
   ========================================================= */

/* ---------- サブポジション ---------- */
const SUB_KEYS = ['C', '1B', '2B', '3B', 'SS', 'OF'];
const SUB_FIT = [0, 0.86, 0.93, 0.98];
const SUB_MARK = ['', '△', '○', '◎'];
const SUB_LVN = ['', 'こなせる', '上手', '本職並み'];
const SUB_NEED = [0, 18, 50, 100];
const SUB_GEN = {
  C: { '1B': .14, '3B': .05, OF: .03 },
  '1B': { OF: .30, '3B': .18, C: .03 },
  '2B': { SS: .45, '3B': .30, OF: .20, '1B': .12 },
  '3B': { '1B': .40, SS: .20, '2B': .22, OF: .18 },
  SS: { '2B': .55, '3B': .45, OF: .14, '1B': .08 },
  OF: { '1B': .30, '3B': .05, '2B': .05 }
};
function subKey(slot) { return slot === 'LF' || slot === 'CF' || slot === 'RF' ? 'OF' : slot; }
function subLv(p, slot) { const k = subKey(slot); return (p.sub && p.sub[k]) || 0; }
function subNeed(k, lv) { return SUB_NEED[clamp(lv, 0, 3)] * (k === 'C' ? 1.6 : 1); }
function subLvFromXp(k, xp) { let l = 0; for (let i = 1; i <= 3; i++) if (xp >= subNeed(k, i)) l = i; return l; }
function canCatch(p) { return p.pos === 'C' || subLv(p, 'C') > 0; }
function setSub(p, k, lv) {
  p.sub = p.sub || {}; p.sx = p.sx || {};
  if (lv > 0 && k !== p.pos) { p.sub[k] = lv; p.sx[k] = subNeed(k, lv); }
  else { delete p.sub[k]; delete p.sx[k]; }
}
function genSubs(p) {
  p.sub = {}; p.sx = {};
  if (isP(p)) return;
  const row = SUB_GEN[p.pos] || {}; const ageF = clamp(0.75 + (p.age - 18) * 0.035, 0.75, 1.3);
  for (const k in row) {
    if (!chance(row[k] * ageF)) continue;
    const lv = wpick([1, 2, 3], x => (p.age >= 27 ? [35, 40, 25] : [52, 35, 13])[x - 1]);
    p.sub[k] = lv;
    p.sx[k] = Math.round(subNeed(k, lv) + (lv < 3 ? rf(0, (subNeed(k, lv + 1) - subNeed(k, lv)) * 0.6) : 0));
  }
}
/* 公式戦や練習で経験を積む。新しい段階に上がったらその段階を返す */
function addSubXp(p, k, x) {
  if (isP(p) || k === p.pos || k === 'DH') return 0;
  p.sx = p.sx || {}; p.sub = p.sub || {};
  p.sx[k] = (p.sx[k] || 0) + x;
  const lv = subLvFromXp(k, p.sx[k]);
  if (lv > (p.sub[k] || 0)) { p.sub[k] = lv; return lv; }
  return 0;
}
function subList(p) { return SUB_KEYS.filter(k => p.sub && p.sub[k]).map(k => ({ k, lv: p.sub[k] })); }
function subStr(p, sep) { return subList(p).map(x => POS_S[x.k] + SUB_MARK[x.lv]).join(sep === undefined ? '' : sep); }
function subLearned(p, k, lv) {
  if (p.team >= 0 && G.user && isUser(p.team)) notify('dev', `${p.name}が${POS_JP[k]}の守備を覚えました（${SUB_MARK[lv]} ${SUB_LVN[lv]}）`, { pid: p.id, go: 'training' });
}

/* ---------- 守備位置の適性 ---------- */
/* 本職＝1。サブポジション（△○◎）があればその分だけ守れる。経験のない位置は似た位置ほどましだが、サブより劣る */
function baseFit(pp, slot) {
  if (slot === 'LF' || slot === 'CF' || slot === 'RF') {
    if (pp === '2B' || pp === 'SS') return 0.82;
    if (pp === '1B' || pp === '3B') return 0.72;
    return 0.5;
  }
  const m = { SS: { '2B': 0.85, '3B': 0.8 }, '2B': { SS: 0.93, '3B': 0.85 }, '3B': { SS: 0.92, '2B': 0.85, '1B': 0.75 }, '1B': { '3B': 0.92, OF: 0.85, C: 0.88, '2B': 0.9, SS: 0.9 }, C: {} };
  const row = m[slot];
  if (row && row[pp]) return row[pp];
  if (slot === 'C') return 0.25;
  return 0.6;
}
function fitPos(p, slot) {
  if (slot === 'DH') return 1;
  const pp = p.pos;
  if (pp === 'P') return 0;
  if (subKey(slot) === pp) return 1;
  const b = baseFit(pp, slot) * 0.9;
  const lv = subLv(p, slot);
  return lv ? Math.max(SUB_FIT[lv], b) : b;
}
function fatPen(p) { return Math.max(0, (p.fat || 0) - 55) * 0.25; }
function slotScore(p, slot) {
  const f = fitPos(p, slot);
  const defv = defVal(p) * f - (1 - f) * 30;
  const w = POS_DEFW[slot];
  return offVal(p) * (1 - w) + defv * w - fatPen(p) + (p.form || 0) * 1.2;
}

/* ---------- 自動オーダー ---------- */
function luScore(p, s) {
  let v = slotScore(p, s);
  if (p.farewell === G.year) v += 60;
  if (s === 'CF') v += (p.a.spd - 60) * 0.15;
  if (s === 'C' && !canCatch(p)) v -= 25;
  return v;
}
/* 守備位置の入れ替え・控えとの交代で全体の得点が上がる限り直す（強打者を不慣れな守備に就かせない） */
function improveLineup(lu, bench) {
  for (let it = 0; it < 30; it++) {
    let best = 0, act = null;
    for (let i = 0; i < lu.length; i++) for (let j = i + 1; j < lu.length; j++) {
      const a = lu[i], b = lu[j];
      const d = luScore(a.p, b.pos) + luScore(b.p, a.pos) - luScore(a.p, a.pos) - luScore(b.p, b.pos);
      if (d > best + 0.01) { best = d; act = ['sw', i, j]; }
    }
    for (let i = 0; i < lu.length; i++) for (let k = 0; k < bench.length; k++) {
      const d = luScore(bench[k], lu[i].pos) - luScore(lu[i].p, lu[i].pos);
      if (d > best + 0.01) { best = d; act = ['in', i, k]; }
    }
    if (!act) break;
    if (act[0] === 'sw') { const a = lu[act[1]], b = lu[act[2]]; const t = a.pos; a.pos = b.pos; b.pos = t; }
    else { const out = lu[act[1]].p; lu[act[1]].p = bench[act[2]]; bench[act[2]] = out; }
  }
  return lu;
}
function autoLineup(tid, excludeIds) {
  const ex = excludeIds || new Set();
  const bats = rosterLv(tid, 1).filter(p => !isP(p) && p.injW === 0 && !ex.has(p.id) && !benched(p));
  const used = new Set(); const lu = [];
  const order = ['C', 'SS', '2B', 'CF', '3B', 'RF', 'LF', '1B', 'DH'];
  for (const s of order) {
    let best = null, bv = -1e9;
    for (const p of bats) {
      if (used.has(p.id)) continue;
      const v = luScore(p, s);
      if (v > bv) { bv = v; best = p; }
    }
    if (best) { lu.push({ p: best, pos: s }); used.add(best.id); }
  }
  improveLineup(lu, bats.filter(p => !used.has(p.id)));
  // 野手が足りない場合は2軍から（AIの緊急措置）
  if (lu.length < 9) {
    const extra = rosterLv(tid, 2).filter(p => !isP(p) && p.injW === 0 && !used.has(p.id)).sort((a, b) => offVal(b) - offVal(a));
    for (const s of order) { if (lu.find(x => x.pos === s)) continue; const p = extra.shift(); if (!p) break; lu.push({ p, pos: s }); used.add(p.id); }
  }

}
function battingOrder(list) {
  const arr = list.slice();
  const take = f => { let bi = 0, bv = -1e9; arr.forEach((x, i) => { const v = f(x.p); if (v > bv) { bv = v; bi = i; } }); return arr.splice(bi, 1)[0]; };

    const o3 = take(p => offVal(p));
    const o1 = take(p => p.a.spd * 0.35 + p.a.eye * 0.3 + p.a.con * 0.35);
    const o2 = take(p => p.a.con * 0.5 + p.a.eye * 0.2 + p.a.spd * 0.3);
    const o5 = take(p => p.a.pow * 0.5 + p.a.con * 0.5);
    res.push(o1, o2, o3, o4, o5);

/* ---------- 投手陣の役割 ---------- */
function autoRoles(tid) {

  const spScore = p => spOvr(p) + (p.pt === 'SP' ? 5 : -3) + (p.a.sta - 55) * 0.12;
  const sp = ps.filter(p => p.a.sta >= 38).sort((a, b) => spScore(b) - spScore(a)).slice(0, LG.rot || 6);
  const rest = ps.filter(p => !sp.includes(p)).sort((a, b) => rpOvr(b) - rpOvr(a));
  return { rot: sp.map(p => p.id), cl: rest[0] ? rest[0].id : null, su: rest.slice(1, 3).map(p => p.id), mr: rest.slice(3).map(p => p.id) };
}
function getRoles(tid) {
  const T = G.teams[tid];

  return T._roles;
}
function computeRoles(tid) {
  const auto = autoRoles(tid);
  if (!isUser(tid) || G.user.lineupMode !== 'manual') return auto;
  const ok = id => { const p = P_(id); return p && p.team === tid && p.lv === 1 && isP(p) && p.injW === 0; };
  const m = G.user.manual;
  const nr = LG.rot || 6;
  const rot = (m.rot || []).filter(ok).slice(0, nr);
  for (const id of auto.rot) if (rot.length < nr && !rot.includes(id)) rot.push(id);
  for (const id of auto.su.concat(auto.mr, auto.cl != null ? [auto.cl] : [])) if (rot.length < nr - 1 && !rot.includes(id)) rot.push(id);
  const usedR = new Set(rot);

  const su = (m.su || []).filter(id => ok(id) && !usedR.has(id) && id !== cl).slice(0, 2);
  const pool = rosterLv(tid, 1).filter(p => isP(p) && p.injW === 0 && !usedR.has(p.id) && p.id !== cl && !su.includes(p.id)).sort((a, b) => rpOvr(b) - rpOvr(a));

function getLineup(tid) {
  const T = G.teams[tid];
  if (!T._lu || T._luStamp !== G.stamp) { T._lu = computeLineup(tid); T._luStamp = G.stamp; }
  return T._lu;
}
function computeLineup(tid) {
  if (!isUser(tid) || G.user.lineupMode !== 'manual') return autoLineup(tid);
  const m = G.user.manual.lu || [];
  const out = []; const used = new Set(); const usedPos = new Set();
  for (let i = 0; i < 9; i++) {
    const e = m[i];
    if (!e) { out.push(null); continue; }
    const p = P_(e.id);
    if (!p || p.team !== tid || p.lv !== 1 || isP(p) || p.injW > 0 || benched(p) || used.has(p.id) || usedPos.has(e.pos)) { out.push({ hole: true, pos: e.pos }); continue; }
    out.push({ p, pos: e.pos }); used.add(p.id); usedPos.add(e.pos);

  const bench = rosterLv(tid, 1).filter(p => !isP(p) && p.injW === 0 && !used.has(p.id) && !benched(p));
  for (let i = 0; i < 9; i++) {

    let pos = out[i] && out[i].pos && freePos.includes(out[i].pos) ? out[i].pos : freePos[0];
    if (!pos) pos = 'DH';
    if (freePos.includes(pos)) freePos.splice(freePos.indexOf(pos), 1);
    const best = maxBy(bench.filter(p => !used.has(p.id)), p => slotScore(p, pos) + (pos === 'C' && !canCatch(p) ? -25 : 0));

}
function cleanManual(id) {

/* ---------- 1軍の自動編成 ---------- */
function autoRoster(tid) {
  const all = shihai(tid);
  const healthy = all.filter(p => p.injW === 0);
  const pick1 = new Set(); let frn = 0;
  const canAdd = p => !pick1.has(p.id) && (!p.frn || frn < LIM.frn1);
  const add = p => { pick1.add(p.id); if (p.frn) frn++; };
  const pits = healthy.filter(isP);
  const sps = pits.filter(p => p.a.sta >= 38).sort((a, b) => (spOvr(b) + (b.pt === 'SP' ? 5 : 0)) - (spOvr(a) + (a.pt === 'SP' ? 5 : 0)));
  let nsp = 0; for (const p of sps) { if (nsp >= (LG.rot || 6)) break; if (canAdd(p)) { add(p); nsp++; } }
  const rps = pits.filter(p => !pick1.has(p.id)).sort((a, b) => rpOvr(b) - rpOvr(a));
  let nrp = 0; for (const p of rps) { if (nrp >= (LG.nrp || 8)) break; if (canAdd(p)) { add(p); nrp++; } }
  const bats = healthy.filter(p => !isP(p));
  const cs = bats.filter(p => p.pos === 'C').sort((a, b) => batOvr(b.a, 'C') - batOvr(a.a, 'C'));
  let nc = 0; for (const p of cs) { if (nc >= 2) break; if (canAdd(p)) { add(p); nc++; } }
  for (const pos of ['SS', '2B', '3B', '1B']) {
    const c = bats.filter(p => p.pos === pos && !pick1.has(p.id)).sort((a, b) => batOvr(b.a, pos) - batOvr(a.a, pos));
    for (const p of c) { if (canAdd(p)) { add(p); break; } }
  }
  const ofs = bats.filter(p => p.pos === 'OF' && !pick1.has(p.id)).sort((a, b) => batOvr(b.a, 'OF') - batOvr(a.a, 'OF'));
  let nof = 0; for (const p of ofs) { if (nof >= 4) break; if (canAdd(p)) { add(p); nof++; } }

/* 故障者の入れ替え（同じ投手/野手で補充） */
function swapInjured(tid) {
  let changed = false;
  const first = rosterLv(tid, 1);
  for (const p of first) {
    if (p.injW <= 0) continue;
    p.lv = 2; changed = true;
    const frn = firstFrnCount(tid);
    const cands = rosterLv(tid, 2).filter(x => x.injW === 0 && isP(x) === isP(p) && (!x.frn || frn < LIM.frn1));
    let rep;
    if (isP(p)) rep = maxBy(cands, x => Math.max(spOvr(x), rpOvr(x)));
    else {
      const needC = rosterLv(tid, 1).filter(x => canCatch(x) && x.injW === 0).length < 2;
      rep = maxBy(cands, x => ovr(x) + (needC && canCatch(x) ? 30 : 0) + (x.pos === p.pos ? 4 : subLv(x, p.pos) * 1.5));
    }
    if (rep) rep.lv = 1;
  }
  if (changed) touch();
  return changed;
}

/* ---------- チーム評価 ---------- */
function teamDefense(lu) {
  const W = { C: 1.2, SS: 1.3, '2B': 1.1, '3B': 1.0, CF: 1.1, LF: 0.7, RF: 0.8, '1B': 0.6, DH: 0 };
  let s = 0, w = 0;
  for (const x of lu) { const ww = W[x.pos] || 0; if (!ww) continue; const f = fitPos(x.p, x.pos), fx = skFx(x.p); s += ((defVal(x.p) + fx.thr * 1.2 - (fx.err > 1 ? 3 : 0)) * f - (1 - f) * 20) * ww; w += ww; }
  return w ? s / w : 55;
}

  const rot = ro.rot.map(P_).filter(Boolean);

  const sp = rot.length ? avg(rot, spOvr) : 40;
  const rp = pen.length ? avg(pen, rpOvr) : 40;

  const spd = lu.length ? avg(lu, x => x.p.a.spd) : 50;

/* =========================================================
   試合エンジン（1打席ずつのシミュレーション）

const LGC_BASE = { bb: .077, hbp: .008, k: .188, hr: .0195, hrB: 1.35, babip: .290, err: .012, dbl: .20, tri: .020, era0: 3.7 };

}

/* sit：その打席の状況（risp＝得点圏に走者、wo＝サヨナラの場面） */
function batEff(p, home, side, sit) {

}

/* 1試合の偉業（公式戦）と連続試合安打 */
function gameFeats(S) {

    if (g.hr >= 3) out.push({ k: 'hr3', pid: p.id, tid: g.tid, v: g.hr });

        if (ps === W) st.w++; if (ps === L) st.l++; if (ps === SV) st.sv++; if (ps.hold) st.hld++;
        if (ps.isSP && sd.used.length === 1 && !tie) { st.cg++; if (opp === 0) st.sho++; }

/* =========================================================

const SEASON_START = 11, SEASON_END = 34, MAKEUP_TURN = 35;
const DOW = ['火', '水', '木', '金', '土', '日'];

function genSchedule() {
  if (LG.mlb) return genScheduleMLB();
  const L = [[], []]; for (const t of G.teams) L[t.league].push(t.id);
  const circle = ids => { const arr = ids.slice(); const rounds = []; for (let r = 0; r < 5; r++) { const pairs = []; for (let i = 0; i < 3; i++) pairs.push([arr[i], arr[5 - i]]); rounds.push(pairs); arr.splice(1, 0, arr.pop()); } return rounds; };

  const lens = [3, 3, 3, 2, 3, 3, 3, 2, 3];
  const hostX = [true, false, true, true, false, false, true, true, false];
  const extraOf = (lg, a, b) => {
    let i = L[lg].indexOf(a), j = L[lg].indexOf(b);
    const lo = Math.min(i, j), hi = Math.max(i, j); const d = hi - lo;
    const toLo = d === 1 || d === 2 || (d === 3 && lo < 3);

  for (let k = 0; k < 9; k++) for (let r = 0; r < 5; r++) {
    for (let g = 0; g < lens[k]; g++) {
      const day = [];
      for (let lg = 0; lg < 2; lg++) for (const [x, y] of R[lg][r]) {
        const ex = extraOf(lg, x, y); const o = ex === x ? y : x;
        const home = hostX[k] ? ex : o;
        day.push({ h: home, a: home === x ? y : x });
      }
      intra.push(day);
    }
  }
  const inter = [];
  for (let k = 0; k < 6; k++) for (let g = 0; g < 3; g++) {
    const day = [];
    for (let i = 0; i < 6; i++) { const a = L[0][i], b = L[1][(i + k) % 6]; const home = ((k + G.year) % 2 === 0) ? a : b; day.push({ h: home, a: home === a ? b : a }); }
    inter.push(day);
  }
  const days = intra.slice(0, 48).concat(inter, intra.slice(48));

}
function dayTurn(d) { return SEASON_START + Math.floor(d / (LG.dpw || 6)); }
function dayLabel(d) { const t = dayTurn(d); const m = Math.floor(t / 4) + 1, w = t % 4 + 1; return m + '月第' + w + '週(' + DOW[d % DOW.length] + ')'; }

  const uid = G.user.tid; const out = [];
  G.sched.days.forEach((day, d) => { for (const g of day) if (g.h === uid || g.a === uid) out.push({ d, g }); });
  (G.sched.mkDays || []).forEach((day, i) => { for (const g of day) if (g.h === uid || g.a === uid) out.push({ d: 'mk' + i, g, mk: true }); });

}

function blankRec() { return { w: 0, l: 0, d: 0, rs: 0, ra: 0, hw: 0, hl: 0, strk: 0, l10: [], vs: {}, il: [0, 0, 0] }; }
function pctOf(R) { const d = R.w + R.l; return d ? R.w / d : 0; }
function gamesPlayed(tid) { const r = G.teams[tid].rec; return r.w + r.l + r.d; }
function standings(lg) {

/* 順位はリーグ（日本版）／地区（メジャー版）の中で数える */
function grpTable(g) { return LG.mlb ? grpStandings(g) : standings(g); }

function gamesBehind(tid) { const t = G.teams[tid]; return grpTable(grpOf(t)).find(x => x.t.id === tid).gb; }
function applyRecord(hid, aid, res) {
  const H = G.teams[hid].rec, A = G.teams[aid].rec;

  const inter = G.teams[hid].league !== G.teams[aid].league;

/* ---------- プレーオフ ---------- */

}

/* ---------- 成績計算 ---------- */

/* ---------- ファンクラブ ---------- */

/* ---------- 人気・ファン人口（全球団・毎週） ---------- */

/* ---------- 広告料・命名権料の交渉 ---------- */
/* kind：'sp'＝スポンサー・球場内広告、'nm'＝ネーミングライツ */
function dealList(kind) { return kind === 'nm' ? G.naming.offers : G.sponsors.offers; }
function dealYearRange(kind) { return kind === 'nm' ? [3, 10] : [1, 5]; }
function dealFind(kind, id) { return dealList(kind).find(o => o.id === id) || null; }
function dealValue(kind, o) { return kind === 'nm' ? namingValue(o.kind) : sponsorValue(o.slot); }
function dealLabel(kind, o) { return kind === 'nm' ? (o.kind === 'main' ? '本拠地のネーミングライツ' : '2軍球場のネーミングライツ') : SPONSOR_SLOTS[o.slot].n; }
/* 古いセーブの提案にも交渉用の値を持たせる */
function dealEnsure(kind, o) {
  if (o.max != null && o.py != null) return o;
  const v = dealValue(kind, o);
  dealFields(o, v, o.yrs, {});

}
/* 希望年数から外れるほど、年額の上限は下がる */
function dealReserve(kind, o, yrs) { const k = kind === 'nm' ? 0.025 : 0.04; return o.max * (1 - k * Math.abs(yrs - o.py)); }
function dealMood(o) {

  if (o.pat === 1) return { t: '慎重になっている', c: 'warn' };
  return { t: o.int >= 0.6 ? 'ぜひ契約したい様子' : '前向き', c: 'pos' };
}
/* 営業部長の読み。能力が高いほど幅が狭く、正確 */
function dealHint(kind, o, yrs) {

  if (ab < 45) return null;

  const c = dealReserve(kind, o, yrs) * (1 + (o.hn || 0) * err * 0.5);
  return { lo: roundSal(c * (1 - err)), hi: roundSal(c * (1 + err)) };
}
function dealSign(kind, o) {

  else acceptSponsorId(o.id);
}
/* こちらの条件を出す。結果：signed（合意）／counter（相手が歩み寄り）／walk（決裂） */
function negotiateDeal(kind, id, ask, yrs) {
  const o = dealFind(kind, id); if (!o) return { res: 'gone' };
  dealEnsure(kind, o);
  const [y0, y1] = dealYearRange(kind);
  yrs = clamp(Math.round(+yrs || o.yrs), y0, y1);
  ask = roundSal(Math.max(0, +ask || 0));
  if (yrs === o.yrs && ask <= o.annual) { dealSign(kind, o); return { res: 'signed', annual: o.annual, yrs: o.yrs }; }
  const R = dealReserve(kind, o, yrs);
  o.rd++; o.log.push({ w: 'me', a: ask, y: yrs });
  if (ask <= R) { o.annual = ask; o.yrs = yrs; o.log.push({ w: 'co', t: 'ok', a: ask, y: yrs }); dealSign(kind, o); return { res: 'signed', annual: ask, yrs }; }
  const gap = ask / R - 1;
  o.pat -= gap > 0.25 ? 2 : 1;
  /* 上限を大きく超える要求は、相手を怒らせて打ち切られることがある */
  const angry = gap > 0.12 && chance(Math.min(0.6, (gap - 0.12) * 2.5));
  if (o.pat < 0 || angry) {
    const L = dealList(kind); L.splice(L.indexOf(o), 1);
    G.sponsors.ng = G.sponsors.ng || {}; G.sponsors.ng[o.co] = 24;
    addNews('biz', `${o.co}との${dealLabel(kind, o)}の交渉は決裂しました`, { tid: G.user.tid });
    return { res: 'walk', co: o.co, angry: angry && o.pat >= 0 };
  }
  const prev = o.yrs === yrs ? o.annual : Math.min(o.annual, R * 0.9);
  let next = prev + (Math.min(R, ask) - prev) * rf(0.35, 0.65);
  next = roundSal(Math.min(Math.floor(R), Math.max(next, prev)));
  o.annual = next; o.yrs = yrs;
  o.final = o.pat === 0 || (R - next) / R < 0.03;
  o.log.push({ w: 'co', t: o.final ? 'final' : 'counter', a: next, y: yrs });
  return { res: 'counter', annual: next, yrs, final: o.final };
}

const DEV_START = 50, DEV_COST = 200, DEV_MAX = 300;
function privateDevelopment() {
  const tw = G.town;

function aiKnows(p, tid) { return p.pr.hype >= 35 || hash2(p.id, tid * 13 + 5) < 0.55; }

  if (!isP(p)) { const same = r.filter(x => x.pos === p.pos).length; if (p.pos === 'C' && same < 4) b += 3; if (p.pos === 'SS' && same < 3) b += 2; }

}

  return G.teams.slice().sort((a, b) => pctOf(a.rec) - pctOf(b.rec) || a.rec.w - b.rec.w).map(t => t.id);
}

/* ---------- ドラフト会議の進行 ---------- */
function startDraft() {
  if (LG.mlb) {
    const ord = G.draftOrder && G.draftOrder.y === G.year ? G.draftOrder.order.slice() : mlbDraftOrder(true).order;
    G.draft = { stage: 'rounds', round: 1, picks: [], r1log: [], pending: [], order: ord, idx: 0, stopped: {}, userStop: false, ik: false, finished: false, maxRound: LG.draftRounds || 8, mlb: true };

  }

/* メジャー版：7月のドラフト。指名した選手はすぐにマイナー契約で入団し、契約金は指名順で決まる */

  addNews('draft', `1巡目の上位指名　${first.map(x => `${x.no}位 ${tShort(x.tid)}：${x.name || '?'}`).join(' ／ ')}`, {});
  const over = rosterLv(ut, 3).length - LIM.ikusei;
  if (over > 0) notify('contract', `マイナー契約の選手が${LIM.ikusei}人の上限を${over}人超えています。2月までに整理しないと、評価の低い選手から自動で放出されます`, { go: 'contracts', note: 'hi' });

/* =========================================================

   p.ren = { st:'pending'|'signed'|'hold', dem, off, sal, yrs, tries }

function salByWar(w) { w = Math.max(0, w); return 800 + w * 5500 + Math.max(0, w - 3) * 3500; }

}

}

}

/* ---------- トレード ---------- */

  if (isUser(p.team)) addNews('dev', `${p.name}が覚醒！ ${keys.map(k => ATTR_JP[k]).join('・')}が大きく伸びました`, { important: true, tid: p.team, note: 'hi', pid: p.id });
}

/* ---------- 調子とやる気 ---------- */
function weeklyMorale(weekRes) {
  const t = curTurn(); const season = t >= SEASON_START && t <= MAKEUP_TURN;
  for (const T of G.teams) {
    const mg = teamMgr(T.id);
    const R = T.rec; const wp = (R.w + R.l) >= 8 ? pctOf(R) : 0.5;
    const hasLeader = rosterLv(T.id, 1).some(p => p.per === 'leader' && ovr(p) >= 60);
    const moodB = clamp(sum(rosterLv(T.id, 1), p => skFx(p).mood) * 1.5, -4, 4);
    const dorm = isUser(T.id) ? G.tfac.dorm.lv : (T.facLv || 2) * 0.6;
    for (const p of roster(T.id)) {
      let tg = 55 + (wp - 0.5) * (p.per === 'passion' ? 60 : 40) + ((mg.lead || 50) - 50) * 0.15 + (hasLeader ? 4 : 0) + moodB;
      if (season) {
        if (p.lv === 1 && p.wkG >= 3) tg += 8;
        else if (p.lv !== 1 && p.age >= 28 && ovr(p) >= 60) tg -= 10;
      }
      if (p.age <= 23) tg += dorm;
      if (p.ren && p.ren.st === 'hold') tg -= 10;
      if (p.postY === G.year && p.postRef) tg -= 20;
      const sp = p.per === 'mypace' ? 0.07 : p.per === 'shy' ? 0.25 : 0.14;
      p.mor = clamp(p.mor + (tg - p.mor) * sp + rn(0, 1.5), 5, 100);
      // 調子
      const vol = (p.per === 'genius' ? 0.18 : p.per === 'shy' ? 0.42 : 0.3) * (skFx(p).swing ? 1.6 : 1);
      if (chance(vol)) p.form = clamp(p.form + (chance(0.5 + (p.mor - 50) / 200) ? 1 : -1), -2, 2);
      else if (p.form !== 0 && chance(0.25)) p.form += p.form > 0 ? -1 : 1;
      // 疲労（野手）
      if (!isP(p)) p.fat = Math.max(0, p.fat - 8 - (p.lv !== 1 ? 20 : 0));
    }
  }
}
function batterFatigue(res) {
  for (const id of res.bp) { const p = P_(id); if (p) p.fat = Math.min(100, p.fat + (p.pos === 'C' ? 4 : 2.2)); }
}

/* ---------- 故障 ---------- */
function injMult(p) {
  let m = (0.4 + p.inj / 80) * (1 + (p.fat || 0) / 150);
  if (p.team >= 0 && isUser(p.team)) {
    m *= 1 - facMult('team', 'medical') * 0.05 - facMult('team', 'gym') * 0.03 - facMult('stad', 'turf') * 0.03;
    m *= 1 - (coach('cond') - 50) * 0.004;
    m *= TRAIN_INT[G.user.train].inj;
    if (G.camp && G.camp.theme === 'stamina' && G.camp.done) m *= 0.85;
    const t = curTurn(); if (t >= 4 && t <= 7 && G.camp) m *= CAMP_SITES[G.camp.site].inj * CAMP_INT[G.camp.int].inj;
  } else if (p.team >= 0) m *= 1.05 - (G.teams[p.team].facLv || 2) * 0.03;
  return clamp(m, 0.15, 3);
}
function injure(p, mult) {
  const pool = INJURIES.filter(x => !(x.pit && !isP(p)) && !(x.bat && isP(p)));
  const inj = wpick(pool, x => x.p * (x.w[1] >= 12 ? mult : 1));
  const w = ri(inj.w[0], inj.w[1]);
  p.injW = w; p.injN = inj.n; p.form = Math.min(p.form, 0);
  if (inj.perm) { if (isP(p)) { p.a.vel = Math.max(120 + velOff(), p.a.vel - rf(1, 3)); p.cap.vel = Math.max(p.a.vel, p.cap.vel - 2); } else p.a.spd -= 3; }
  if (p.team >= 0) {
    if (isUser(p.team) && p.lv === 1) addNews('injury', `${p.name}が${inj.n}で離脱（全治${w}週間）`, { important: w >= 4, tid: p.team, note: w >= 4 ? 'hi' : true, pid: p.id });
    if (p.lv === 1) { if (isUser(p.team) && !G.user.autoSwap) { /* ユーザーに任せる */ } else swapInjured(p.team); }
    touch();
  }
}
function gameInjuries(res) {
  for (const id of res.bp) { const p = P_(id); if (p && p.injW === 0 && chance(0.0016 * injMult(p))) injure(p, injMult(p)); }
  for (const x of res.pp) { const p = P_(x.id); if (p && p.injW === 0 && chance((x.sp ? 0.006 : 0.0025) * injMult(p) * (x.pc > 115 ? 1.5 : 1))) injure(p, injMult(p)); }
  batterFatigue(res);
}
function weeklyInjuries() {
  const t = curTurn(); const camp = t >= 4 && t <= 7;
  for (const T of G.teams) for (const p of roster(T.id)) {
    if (p.injW > 0) {
      let rec = 1;
      if (isUser(T.id)) rec += facMult('team', 'medical') * 0.08 + G.town.stat.heal + (coach('cond') - 50) * 0.004;
      else rec += (T.facLv || 2) * 0.05;
      p.injW = Math.max(0, p.injW - rec);
      if (p.injW < 0.5) { const nm = p.injN; p.injW = 0; p.injN = ''; if (isUser(T.id) && p.lv === 1) touch(); if (isUser(T.id)) { p.recovered = G.year * 100 + t; if (p.lv !== 3 || ovr(p) >= 50) notify('injury', `${p.name}が${nm ? nm + 'から' : '故障から'}復帰しました${p.lv === 1 ? '' : '（いまは2軍）'}`, { pid: p.id, go: 'roster' }); } }
    } else if (chance((camp ? 0.004 : 0.0018) * injMult(p))) injure(p, injMult(p));
  }
}

/* ---------- キャンプ（2月）・秋季キャンプ・ウィンターリーグ ---------- */
function defaultCampSite() { return LG.mlb ? 'arizona' : 'miyazaki'; }
function startCamp() {
  if (!G.camp) G.camp = { site: defaultCampSite(), theme: 'balance', int: 'normal', guest: false };
  if (!CAMP_SITES[G.camp.site]) G.camp.site = defaultCampSite();
  const site = CAMP_SITES[G.camp.site];
  book('exp', 'camp', site.cost + (G.camp.guest ? 2000 : 0));
  uT().pop = clamp(uT().pop + site.pop, 0, 99);
  if (site.frn) for (const p of roster(G.user.tid)) if ((p.frn || (LG.mlb && p.nat && p.nat !== 'US')) && p.adapt < 0) p.adapt = Math.min(0, p.adapt + 2);
  G.camp.started = true;
  addNews('camp', `春季キャンプ開始（${site.n}・${CAMP_THEMES[G.camp.theme].n}・${CAMP_INT[G.camp.int].n}）`, { tid: G.user.tid });
}
function endCamp() {
  if (!G.camp) return;
  G.camp.done = true;
  const top = roster(G.user.tid).filter(p => p.grow > 0).sort((a, b) => b.grow - a.grow).slice(0, 3);
  addNews('camp', `春季キャンプ打ち上げ。${top.map(p => p.name).join('、')}らが成長をアピール`, { tid: G.user.tid, note: true });
}
function winterLeague() {
  const W = G.winter || []; if (!W.length) return;
  for (const id of W) {
    const p = P_(id); if (!p || p.team !== G.user.tid) continue;
    const keys = shuffle((isP(p) ? PIT_KEYS : BAT_KEYS).slice()).slice(0, 3);
    for (const k of keys) { const inc = (k === 'vel' ? 0.8 : 2.5) * rf(0.6, 1.4); p.a[k] = Math.min(p.cap[k], p.a[k] + inc); }
    if (chance(0.12)) breakout(p);
  }
  addNews('dev', `ウィンターリーグに派遣した${W.length}人が実戦経験を積んで帰国`, { tid: G.user.tid, note: true, go: 'training' });
  G.winter = [];
}
function newYearAging() {
  for (const id in G.players) { const p = G.players[id]; p.age++; p.grow = 0; }
  for (const m of G.mlbAway || []) { m.p.age++; m.p.grow = 0; }
}

/* リーグ全体の水準を保つ（能力インフレ・デフレの自動補正） */
function leagueLevel() { let s = 0, n = 0; for (const T of G.teams) for (const p of rosterLv(T.id, 1)) { s += ovr(p); n++; } return n ? s / n : 62.5; }
function adjustGrowth() {
  const lv = leagueLevel();
  G.growAdj = clamp((G.growAdj || 1) * (1 - (lv - 66) * 0.04), 0.85, 1.15);
  G.lvHist = G.lvHist || []; G.lvHist.push({ y: G.year, lv: r1(lv), adj: r1(G.growAdj * 100) / 100 });
}
